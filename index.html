<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RemOpsAI Incident Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0a0d12; --bg-raised:#0d1119; --ink:#e8ecf3;
  --rops-bg:#0b0f16; --rops-surface:#121826; --rops-surface2:#171f30; --rops-border:#232c40; --rops-border-soft:#1a2233;
  --rops-text:#e7ecf7; --rops-dim:#8b93ab; --rops-faint:#5c657c;
  --accent:#4c8dff; --accent-2:#22d3b7; --accent-soft:rgba(76,141,255,.14);
  --danger:#f0475a; --danger-soft:rgba(240,71,90,.14);
  --warn:#f5a623; --warn-soft:rgba(245,166,35,.14);
  --ok:#22c77a; --ok-soft:rgba(34,199,122,.14);

  --mer-bg:#fbf9f6; --mer-surface:#ffffff; --mer-border:#e7e2d9; --mer-ink:#1c1a17; --mer-dim:#6f6a60;
  --mer-accent:#c65a2e; --mer-accent-ink:#ffffff; --mer-accent-soft:#fbe6da;

  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --radius:10px; --radius-lg:16px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
::selection{background:var(--accent-soft)}
.hidden{display:none !important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#28324a;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}

/* ============ SIMULATION CONTROL STRIP ============ */
.simbar{
  position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;
  padding:9px 18px;background:linear-gradient(180deg,#0d1119,#0a0d12);
  border-bottom:1px solid #1c2334;
}
.simbar-tag{
  display:flex;align-items:center;gap:7px;font:700 10.5px/1 var(--mono);letter-spacing:.09em;
  color:var(--accent-2);padding:6px 9px;border:1px solid #1c3a3a;border-radius:7px;background:rgba(34,211,183,.06);
  white-space:nowrap;
}
.simbar-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 3px rgba(34,211,183,.18)}
.envswitch{display:flex;gap:4px;background:#10151f;border:1px solid #1c2334;border-radius:10px;padding:3px}
.envbtn{
  display:flex;align-items:center;gap:7px;padding:7px 13px;border:none;background:transparent;color:var(--rops-dim);
  border-radius:8px;font-size:12.5px;font-weight:600;letter-spacing:.01em;transition:background .15s,color .15s;
}
.envbtn .b{width:6px;height:6px;border-radius:50%;flex:none}
.envbtn.active{background:#1c2536;color:var(--ink)}
.envbtn:not(.active):hover{background:#141b28;color:#c6cce0}
.simbar-spacer{flex:1}
.status-pill{
  display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;
  border:1px solid var(--rops-border);background:var(--rops-surface);color:var(--ok);white-space:nowrap;
}
.status-pill .pdot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px currentColor;opacity:.9}
.status-pill.warn{color:var(--warn)}
.status-pill.bad{color:var(--danger);animation:pulseBad 1.4s ease-in-out infinite}
.status-pill.recovering{color:var(--accent)}
@keyframes pulseBad{0%,100%{box-shadow:0 0 0 0 rgba(240,71,90,0)}50%{box-shadow:0 0 0 5px rgba(240,71,90,.12)}}
.btn{
  border-radius:9px;padding:8px 15px;font-size:12.5px;font-weight:700;border:1px solid transparent;letter-spacing:.01em;
  transition:filter .15s,transform .05s;white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn-trigger{background:linear-gradient(180deg,#ff5a68,#e3324a);color:#fff;box-shadow:0 6px 18px -6px rgba(240,71,90,.55)}
.btn-trigger:hover:not(:disabled){filter:brightness(1.08)}
.btn-ghost{background:#12182450;border-color:var(--rops-border);color:var(--rops-dim)}
.btn-ghost:hover{color:var(--ink);border-color:#33405c}
.btn-auto{background:var(--rops-surface2);border-color:var(--rops-border);color:#cfe0ff;display:flex;align-items:center;gap:6px}
.btn-auto:hover{border-color:#3a4666}
.simbar{flex-wrap:wrap;row-gap:8px}

/* ============ SIMULATED CURSOR (autoplay) ============ */
.sim-cursor{
  position:fixed;top:0;left:0;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #ffffff, #cfe0ff 45%, var(--accent) 100%);
  box-shadow:0 0 0 4px rgba(76,141,255,.16), 0 8px 18px -6px rgba(0,0,0,.55);
  pointer-events:none;z-index:9999;transform:translate(-50%,-50%);
  transition:left .6s cubic-bezier(.45,0,.2,1), top .6s cubic-bezier(.45,0,.2,1), opacity .25s ease;
  opacity:0;
}
.sim-cursor.show{opacity:1}
.sim-cursor::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(76,141,255,.4);opacity:0;
}
.sim-cursor.clicking::after{animation:cursorPulse .5s ease-out}
@keyframes cursorPulse{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2)}}
.sim-caption{
  position:fixed;top:0;left:0;z-index:9999;background:#0d1119;border:1px solid #2a3450;color:#e7ecf7;
  padding:6px 13px;border-radius:20px;font:600 12px var(--sans);white-space:nowrap;pointer-events:none;
  transform:translate(-50%,calc(-100% - 20px));opacity:0;transition:left .6s cubic-bezier(.45,0,.2,1), top .6s cubic-bezier(.45,0,.2,1), opacity .25s ease;
  box-shadow:0 12px 26px -12px rgba(0,0,0,.6);
}
.sim-caption.show{opacity:1}
@media (prefers-reduced-motion: reduce){
  .sim-cursor, .sim-caption{transition:opacity .2s ease}
}

/* ============ VIEWPORT ============ */
.viewport{flex:1;min-height:0;background:var(--bg)}
.env{display:none;min-height:calc(100vh - 49px)}
.env.active{display:block}

/* ============================================================
   MERIDIAN STOREFRONT
   ============================================================ */
#env-store{background:var(--mer-bg);color:var(--mer-ink)}
.mer-shell{max-width:1180px;margin:0 auto}
.mer-addr{
  display:flex;align-items:center;gap:8px;padding:7px 18px;background:#f1ede4;border-bottom:1px solid var(--mer-border);
  font:500 11.5px var(--mono);color:var(--mer-dim);
}
.mer-addr .lockdot{width:6px;height:6px;border-radius:50%;background:#3fa15a}
.mer-header{
  display:flex;align-items:center;gap:22px;padding:16px 28px;background:var(--mer-surface);
  border-bottom:1px solid var(--mer-border);position:sticky;top:49px;z-index:20;
}
.mer-logo{font-weight:800;font-size:21px;letter-spacing:-.02em;color:var(--mer-ink);cursor:pointer;white-space:nowrap}
.mer-logo span{color:var(--mer-accent)}
.mer-search{
  flex:1;display:flex;align-items:center;gap:10px;background:#f4f1eb;border:1px solid var(--mer-border);
  border-radius:10px;padding:9px 14px;max-width:560px;
}
.mer-search input{flex:1;border:none;background:transparent;font-size:13.5px;color:var(--mer-ink);outline:none}
.mer-search svg{flex:none;opacity:.5}
.mer-navlinks{display:flex;gap:18px;font-size:12.5px;color:var(--mer-dim);font-weight:600}
.mer-navlinks a{color:inherit;text-decoration:none;cursor:pointer}
.mer-navlinks a:hover{color:var(--mer-ink)}
.mer-spacer{flex:1}
.mer-cart{
  display:flex;align-items:center;gap:7px;background:var(--mer-ink);color:#fff;border:none;border-radius:9px;
  padding:9px 14px;font-weight:700;font-size:12.5px;position:relative;
}
.mer-cart .cnt{
  background:var(--mer-accent);border-radius:50%;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;padding:0 4px;
}
.mer-body{padding:26px 28px 60px}
.mer-crumb{font-size:12px;color:var(--mer-dim);margin-bottom:16px;display:flex;gap:6px;align-items:center}
.mer-crumb a{color:var(--mer-dim);cursor:pointer;text-decoration:none}
.mer-crumb a:hover{color:var(--mer-accent)}
.mer-hero{
  background:linear-gradient(120deg,#2a2420,#453a2e);border-radius:18px;padding:38px 40px;color:#f4ede1;margin-bottom:26px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.mer-hero h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.01em}
.mer-hero p{margin:0;color:#cdbfa8;font-size:13.5px}
.mer-hero .tag{display:inline-block;margin-top:14px;background:var(--mer-accent);padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700}
.mer-grid-title{font-size:13px;font-weight:700;color:var(--mer-dim);text-transform:uppercase;letter-spacing:.06em;margin:0 0 14px}
.mer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:900px){.mer-grid{grid-template-columns:repeat(2,1fr)}}
.mer-card{
  background:var(--mer-surface);border:1px solid var(--mer-border);border-radius:14px;overflow:hidden;cursor:pointer;
  transition:box-shadow .15s,transform .1s;
}
.mer-card:hover{box-shadow:0 14px 30px -16px rgba(0,0,0,.18);transform:translateY(-2px)}
.mer-thumb{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:34px}
.mer-card .info{padding:12px 13px 15px}
.mer-card h3{margin:0 0 4px;font-size:13px;font-weight:600;line-height:1.35}
.mer-rating{font-size:11px;color:var(--mer-dim);margin-bottom:6px}
.mer-rating b{color:#c9a227}
.mer-price{font-size:15px;font-weight:800}
.mer-empty{padding:60px 0;text-align:center;color:var(--mer-dim);font-size:13.5px}

.mer-pdp{display:grid;grid-template-columns:1.05fr 1fr;gap:44px}
@media (max-width:860px){.mer-pdp{grid-template-columns:1fr}}
.mer-gallery-main{aspect-ratio:1/1;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:90px;margin-bottom:12px}
.mer-gallery-thumbs{display:flex;gap:9px}
.mer-gthumb{width:62px;height:62px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid transparent;cursor:pointer}
.mer-gthumb.sel{border-color:var(--mer-accent)}
.mer-pdp h1{font-size:23px;margin:0 0 8px;letter-spacing:-.01em}
.mer-pdp-price{font-size:24px;font-weight:800;margin:6px 0 16px}
.mer-pdp-price .was{font-size:14px;color:var(--mer-dim);text-decoration:line-through;font-weight:500;margin-left:8px}
.mer-section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mer-dim);margin:18px 0 8px}
.mer-swatches{display:flex;gap:8px;flex-wrap:wrap}
.mer-pill{
  padding:8px 15px;border-radius:9px;border:1.5px solid var(--mer-border);background:#fff;font-size:12.5px;font-weight:600;
}
.mer-pill.sel{border-color:var(--mer-ink);background:var(--mer-ink);color:#fff}
.mer-qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--mer-border);border-radius:9px;width:fit-content}
.mer-qty button{width:34px;height:34px;background:none;border:none;font-size:16px;font-weight:700}
.mer-qty span{width:34px;text-align:center;font-weight:700;font-size:13px}
.mer-addcart{
  margin-top:22px;width:100%;padding:14px;background:var(--mer-ink);color:#fff;border:none;border-radius:11px;
  font-size:14px;font-weight:800;letter-spacing:.01em;
}
.mer-addcart:hover{background:#000}
.mer-reviews{margin-top:26px;border-top:1px solid var(--mer-border);padding-top:18px}
.mer-review{padding:12px 0;border-bottom:1px solid #f0ece3}
.mer-review .stars{color:#c9a227;font-size:12px;margin-bottom:4px}
.mer-review .who{font-size:11.5px;color:var(--mer-dim);margin-top:4px}
.mer-review p{margin:4px 0 0;font-size:12.5px;line-height:1.55;color:#3a352d}

.mer-toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--mer-ink);color:#fff;
  padding:12px 20px;border-radius:11px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  z-index:500;box-shadow:0 20px 40px -16px rgba(0,0,0,.4);display:flex;align-items:center;gap:9px;
}
.mer-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.mer-cartview{max-width:760px;margin:0 auto}
.mer-cart-row{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--mer-border)}
.mer-cart-thumb{width:66px;height:66px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.mer-cart-row .meta{flex:1;min-width:0}
.mer-cart-row .meta h4{margin:0 0 3px;font-size:13.5px}
.mer-cart-row .meta .sub{font-size:11.5px;color:var(--mer-dim)}
.mer-cart-row .price{font-weight:800;font-size:14px;white-space:nowrap}
.mer-summary{
  background:var(--mer-surface);border:1px solid var(--mer-border);border-radius:14px;padding:20px 22px;margin-top:22px;
}
.mer-summary .line{display:flex;justify-content:space-between;font-size:13px;color:var(--mer-dim);padding:5px 0}
.mer-summary .line.total{border-top:1px solid var(--mer-border);margin-top:8px;padding-top:12px;font-size:16px;font-weight:800;color:var(--mer-ink)}
.mer-cta{width:100%;padding:15px;border:none;border-radius:11px;background:var(--mer-accent);color:#fff;font-size:14.5px;font-weight:800;margin-top:16px}
.mer-cta:hover:not(:disabled){filter:brightness(1.06)}
.mer-cta.secondary{background:var(--mer-ink)}

.mer-checkout{display:grid;grid-template-columns:1.2fr .9fr;gap:38px;max-width:980px;margin:0 auto}
@media (max-width:800px){.mer-checkout{grid-template-columns:1fr}}
.mer-field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mer-field{display:flex;flex-direction:column;gap:6px}
.mer-field label{font-size:11px;font-weight:700;color:var(--mer-dim);text-transform:uppercase;letter-spacing:.05em}
.mer-field input{border:1.5px solid var(--mer-border);border-radius:9px;padding:11px 12px;font-size:13px;background:#fff;color:var(--mer-ink)}
.mer-field input:focus{outline:none;border-color:var(--mer-accent)}
.mer-card-panel{background:var(--mer-surface);border:1px solid var(--mer-border);border-radius:14px;padding:20px 22px;margin-bottom:18px}
.mer-card-panel h3{margin:0 0 14px;font-size:13.5px}
.mer-payrow{display:flex;align-items:center;gap:12px;border:1.5px solid var(--mer-border);border-radius:10px;padding:12px 14px;font:600 13px var(--mono)}
.mer-payrow .brand{background:#1a1f71;color:#fff;font:800 10px var(--sans);padding:3px 7px;border-radius:4px}

.mer-alert{
  display:flex;gap:12px;align-items:flex-start;background:#fdecee;border:1.5px solid #f6b9c1;color:#9a1730;border-radius:12px;
  padding:14px 16px;margin-bottom:18px;font-size:13px;line-height:1.5;animation:shakeIn .35s ease;
}
@keyframes shakeIn{0%{transform:translateX(0);opacity:0}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}100%{transform:translateX(0);opacity:1}}
.mer-alert b{display:block;margin-bottom:2px;font-size:13.5px}
.mer-alert .code{font:600 11px var(--mono);color:#c4405a;margin-top:5px;display:block}

.mer-confirm{max-width:560px;margin:60px auto;text-align:center}
.mer-confirm .ring{width:76px;height:76px;border-radius:50%;background:var(--ok-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.mer-confirm h1{font-size:23px;margin:0 0 8px}
.mer-confirm .ordno{font:700 15px var(--mono);color:var(--mer-dim);margin-bottom:26px}
.mer-confirm-card{background:var(--mer-surface);border:1px solid var(--mer-border);border-radius:14px;padding:20px 22px;text-align:left}

.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   REMOPSAI CONSOLE
   ============================================================ */
#env-rops{background:var(--rops-bg);color:var(--rops-text)}
.rops-shell{display:flex;min-height:calc(100vh - 49px)}
.rops-side{
  width:216px;flex:none;background:var(--rops-surface);border-right:1px solid var(--rops-border-soft);
  padding:18px 12px;display:flex;flex-direction:column;gap:2px;
}
.rops-brand{display:flex;align-items:center;gap:9px;padding:4px 8px 18px}
.rops-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none;position:relative}
.rops-mark svg{position:absolute;inset:0}
.rops-brand b{font-size:14px;letter-spacing:-.01em}
.rops-brand span{color:var(--accent-2)}
.navsec{font:700 10px var(--mono);letter-spacing:.08em;color:var(--rops-faint);text-transform:uppercase;padding:14px 10px 6px}
.navitem{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:12.5px;font-weight:600;
  color:var(--rops-dim);border:none;background:none;width:100%;text-align:left;position:relative;
}
.navitem svg{flex:none;opacity:.85}
.navitem:hover{background:var(--rops-surface2);color:var(--rops-text)}
.navitem.active{background:var(--accent-soft);color:#cfe0ff}
.navitem .nbadge{
  margin-left:auto;background:var(--danger);color:#fff;font:700 9.5px var(--mono);padding:1px 6px;border-radius:20px;
}
.navitem .nbadge.ok{background:var(--ok)}
.navitem:disabled{opacity:.4}

.rops-main{flex:1;min-width:0;padding:22px 28px 60px;overflow-x:hidden}
.rops-topline{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.rops-topline h1{font-size:19px;margin:0;letter-spacing:-.01em}
.sev-badge{font:800 10.5px var(--mono);letter-spacing:.04em;padding:4px 9px;border-radius:6px;background:var(--danger-soft);color:var(--danger);border:1px solid rgba(240,71,90,.35)}
.rops-topline .meta{font-size:12px;color:var(--rops-faint);font-family:var(--mono)}

.panel{background:var(--rops-surface);border:1px solid var(--rops-border-soft);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.panel-h h2{font-size:13px;margin:0;font-weight:700;letter-spacing:.01em}
.panel-h .sub{font-size:11.5px;color:var(--rops-faint)}

.banner{
  border-radius:12px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;margin-bottom:18px;border:1px solid;
}
.banner.b-idle{background:var(--ok-soft);border-color:rgba(34,199,122,.3)}
.banner.b-bad{background:var(--danger-soft);border-color:rgba(240,71,90,.35)}
.banner.b-warn{background:var(--warn-soft);border-color:rgba(245,166,35,.35)}
.banner.b-info{background:var(--accent-soft);border-color:rgba(76,141,255,.35)}
.banner.b-ok{background:var(--ok-soft);border-color:rgba(34,199,122,.35)}
.banner h3{margin:0 0 3px;font-size:14.5px}
.banner p{margin:0;font-size:12.5px;color:var(--rops-dim);line-height:1.5}
.banner .bicon{flex:none;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}

.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
@media (max-width:1100px){.kpi-row{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--rops-surface2);border:1px solid var(--rops-border-soft);border-radius:12px;padding:13px 14px}
.kpi .lbl{font-size:10.5px;color:var(--rops-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:7px}
.kpi .val{font:700 19px/1 var(--mono);font-variant-numeric:tabular-nums}
.kpi .val.bad{color:var(--danger)}
.kpi .val.ok{color:var(--ok)}
.kpi .val.warn{color:var(--warn)}
.kpi svg.spark{margin-top:8px;width:100%;height:24px;display:block}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

/* service map */
.svcmap{width:100%;height:auto;display:block}
.svcnode-label{font:700 11px var(--sans);fill:var(--rops-text)}
.svcnode-sub{font:600 9px var(--mono);letter-spacing:.02em}

/* logs */
.logbox{
  background:#080b10;border:1px solid var(--rops-border-soft);border-radius:10px;padding:11px 4px 11px 0;
  max-height:420px;overflow-y:auto;font:500 11.5px/1.65 var(--mono);
}
.logline{padding:1px 14px;display:flex;gap:10px;white-space:pre-wrap;word-break:break-word}
.logline .ts{color:var(--rops-faint);flex:none}
.logline .lvl{flex:none;font-weight:800;width:42px}
.logline.INFO .lvl{color:#6c9dfa}
.logline.WARN .lvl{color:var(--warn)}
.logline.ERROR .lvl{color:var(--danger)}
.logline .svc{color:var(--accent-2);flex:none}
.logline .msg{color:#c7cee0}

/* metrics charts */
.chartcard{background:var(--rops-surface2);border:1px solid var(--rops-border-soft);border-radius:12px;padding:14px 16px}
.chartcard .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.chartcard .top .t{font-size:11.5px;font-weight:700;color:var(--rops-dim)}
.chartcard .top .v{font:700 18px var(--mono)}
.chartcard svg{width:100%;height:64px;display:block}
.gaugewrap{display:flex;align-items:center;gap:16px}
.gaugewrap .num{font:700 22px var(--mono)}
.gaugewrap .cap{font-size:11px;color:var(--rops-faint)}

/* traces */
.trace-row{display:grid;grid-template-columns:150px 1fr 70px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rops-border-soft)}
.trace-row:last-child{border:none}
.trace-svc{font:600 11.5px var(--mono);color:var(--rops-dim)}
.trace-bar-track{height:16px;background:#161d2c;border-radius:5px;position:relative;overflow:hidden}
.trace-bar{height:100%;border-radius:5px;background:var(--accent);transition:width .5s ease, background .3s ease}
.trace-bar.slow{background:var(--danger)}
.trace-dur{font:700 11px var(--mono);text-align:right}
.trace-dur.slow{color:var(--danger)}

/* k8s */
table.k8s{width:100%;border-collapse:collapse;font-size:12px}
table.k8s th{text-align:left;font:700 10.5px var(--mono);color:var(--rops-faint);text-transform:uppercase;letter-spacing:.04em;padding:6px 10px;border-bottom:1px solid var(--rops-border-soft)}
table.k8s td{padding:8px 10px;border-bottom:1px solid var(--rops-border-soft);font-family:var(--mono);color:var(--rops-dim)}
.pod-status{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.pod-status .d{width:7px;height:7px;border-radius:50%}
.pod-status.run{color:var(--ok)}
.pod-status.run .d{background:var(--ok)}
.pod-status.crash{color:var(--danger)}
.pod-status.crash .d{background:var(--danger);animation:blinkd 1s infinite}
.pod-status.restart{color:var(--warn)}
.pod-status.restart .d{background:var(--warn)}
@keyframes blinkd{50%{opacity:.25}}

/* db */
.pool-bar-track{height:22px;background:#161d2c;border-radius:8px;overflow:hidden;border:1px solid var(--rops-border-soft)}
.pool-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s ease, background .4s ease}
.pool-bar.crit{background:linear-gradient(90deg,#ff8a5a,var(--danger))}

/* deployments / github */
.dep-row{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--rops-border-soft)}
.dep-row:last-child{border:none}
.dep-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;background:var(--rops-border)}
.dep-row.flagged .dep-dot{background:var(--danger)}
.dep-row .body{flex:1;min-width:0}
.dep-row .ver{font:700 12.5px var(--mono)}
.dep-row .flag{font:700 9.5px var(--mono);background:var(--danger-soft);color:var(--danger);padding:2px 7px;border-radius:5px;margin-left:8px}
.dep-row .sub{font-size:11.5px;color:var(--rops-faint);margin-top:2px}
.rollback-btn{margin-top:8px;font:700 11px var(--sans);background:var(--rops-surface2);border:1px solid var(--rops-border);color:var(--rops-dim);padding:5px 10px;border-radius:7px}

.gh-card{border:1px solid var(--rops-border-soft);border-radius:10px;padding:14px 16px;background:var(--rops-surface2)}
.gh-card .title{font:700 13px var(--sans);margin-bottom:6px}
.gh-card .meta{font:500 11.5px var(--mono);color:var(--rops-faint);margin-bottom:10px}
.gh-diff{font:600 11.5px var(--mono);display:flex;gap:14px}
.gh-diff .add{color:var(--ok)}
.gh-diff .del{color:var(--danger)}

/* customer sessions */
.sess-row{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rops-border-soft);font-size:12px}
.sess-row .sid{font:700 11.5px var(--mono);color:var(--rops-dim);width:90px;flex:none}
.sess-row .txt{flex:1;color:var(--rops-dim)}
.sess-row .badge{font:700 9.5px var(--mono);padding:2px 8px;border-radius:20px;flex:none}
.sess-row .badge.fail{background:var(--danger-soft);color:var(--danger)}
.sess-row .badge.ok{background:var(--ok-soft);color:var(--ok)}
.sess-row .ts{color:var(--rops-faint);font:500 11px var(--mono);flex:none}

/* investigation */
.checklist-item{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px;color:var(--rops-faint)}
.checklist-item .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--rops-border);flex:none;display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s}
.checklist-item.done{color:var(--rops-text)}
.checklist-item.done .ck{background:var(--ok);border-color:var(--ok)}
.checklist-item.done .ck svg{display:block}
.checklist-item .ck svg{display:none;width:11px;height:11px}

.timeline-list{position:relative;padding-left:18px}
.timeline-list::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:1.5px;background:var(--rops-border)}
.tl-item{position:relative;padding-bottom:16px;font-size:12.5px}
.tl-item::before{content:"";position:absolute;left:-18px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--rops-surface)}
.tl-item .t{font:700 11px var(--mono);color:var(--rops-faint)}
.tl-item .d{color:var(--rops-text);margin-top:1px}

.evi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:1000px){.evi-grid{grid-template-columns:repeat(2,1fr)}}
.evi-card{background:var(--rops-surface2);border:1px solid var(--rops-border-soft);border-radius:12px;padding:14px}
.evi-card .k{font:700 10px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--rops-faint);margin-bottom:6px}
.evi-card .v{font:700 15px var(--mono);margin-bottom:4px}
.evi-card .s{font-size:11px;color:var(--rops-dim);line-height:1.45}

.confidence-wrap{display:flex;align-items:center;gap:16px;margin-top:14px}
.conf-ring{position:relative;width:66px;height:66px;flex:none}
.conf-ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 15px var(--mono)}

.remstep{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--rops-border-soft)}
.remstep:last-child{border:none}
.remstep .n{width:22px;height:22px;border-radius:50%;background:var(--rops-surface2);border:1px solid var(--rops-border);display:flex;align-items:center;justify-content:center;font:700 11px var(--mono);flex:none;color:var(--rops-faint)}
.remstep.active .n{border-color:var(--accent);color:var(--accent)}
.remstep.done .n{background:var(--ok);border-color:var(--ok);color:#06251a}
.remstep .txt{font-size:12.5px;color:var(--rops-dim);padding-top:1px}
.remstep.done .txt{color:var(--rops-text)}
.remstep .ts{margin-left:auto;font:600 10.5px var(--mono);color:var(--rops-faint);flex:none}

.authbtn{
  width:100%;padding:13px;border-radius:10px;border:none;font-size:13.5px;font-weight:800;letter-spacing:.01em;
  background:linear-gradient(180deg,#5b9bff,var(--accent));color:#fff;margin-top:4px;
}
.authbtn:disabled{background:var(--rops-surface2);color:var(--rops-faint);border:1px solid var(--rops-border)}

.report-field{display:grid;grid-template-columns:170px 1fr;gap:14px;padding:9px 0;border-bottom:1px solid var(--rops-border-soft);font-size:12.5px}
.report-field .k{font-weight:700;color:var(--rops-faint);text-transform:uppercase;font-size:10.5px;letter-spacing:.05em;padding-top:2px}
.report-field .v{color:var(--rops-text);line-height:1.55}

.empty-console{padding:60px 20px;text-align:center;color:var(--rops-faint);font-size:13px;max-width:420px;margin:0 auto}
.empty-console svg{margin-bottom:14px;opacity:.5}

@media (prefers-reduced-motion: reduce){
  .mer-alert{animation:none}
  .status-pill.bad{animation:none}
  .pod-status.crash .d{animation:none}
}
</style>
</head>
<body>
<div class="simbar">
  <div class="simbar-tag"><span class="dot"></span>LIVE SIMULATION</div>
  <div class="envswitch" id="envSwitch">
    <button class="envbtn active" data-env="store"><span class="b" style="background:var(--mer-accent)"></span>meridian.com — Storefront</button>
    <button class="envbtn" data-env="rops"><span class="b" style="background:var(--accent)"></span>RemOpsAI Console</button>
  </div>
  <div class="simbar-spacer"></div>
  <div class="status-pill" id="statusPill"><span class="pdot"></span><span id="statusPillText">All systems healthy</span></div>
  <button class="btn btn-auto" id="autoplayToggle">⏸ Pause Autoplay</button>
  <button class="btn btn-auto" id="replayBtn">⟲ Replay</button>
  <button class="btn btn-ghost" id="resetBtn">Reset Demo</button>
</div>

<div class="viewport">
  <div class="env active" id="env-store"></div>
  <div class="env" id="env-rops"></div>
</div>

<div class="mer-toast" id="toast"></div>
<div class="sim-cursor" id="simCursor"></div>
<div class="sim-caption" id="simCaption"></div>

<script>
(function(){
"use strict";

/* ============================================================
   SHARED UTILS
   ============================================================ */
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const now=()=>new Date();
const fmtTime=(d)=>d.toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
const fmtMs=(ms)=> ms>=1000 ? (ms/1000).toFixed(2)+'s' : Math.round(ms)+'ms';
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function svgPoints(hist,w,h,min,max){
  if(hist.length<2) return '';
  const n=hist.length;
  return hist.map((v,i)=>{
    const x=(i/(n-1))*w;
    const y=h-((clamp(v,min,max)-min)/(max-min||1))*h;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
}

/* ============================================================
   GLOBAL STATE
   ============================================================ */
const PHASES=['normal','incident','detecting','investigating','rootcause','remediation_ready','remediating','resolved'];
const BROKEN_PHASES=new Set(['incident','detecting','investigating','rootcause','remediation_ready','remediating']);

const state = {
  phase:'normal',
  timers:[],
  heartbeat:null,
  incident:null, // {id, severity, detectedAt, resolvedAt}
  timeline:[],
  evidence:[],
  confidence:0,
  investigation:{connected:[], traced:[]},
  remediationSteps:[
    {key:'rollback', label:'Rollback checkout-service deployment', done:false, ts:null},
    {key:'drain', label:'Drain unhealthy checkout pods', done:false, ts:null},
    {key:'dbrecover', label:'Verify PostgreSQL connection pool recovery', done:false, ts:null},
    {key:'latency', label:'Checkout latency recovering', done:false, ts:null},
    {key:'errorfall', label:'HTTP 500 rate falling', done:false, ts:null},
    {key:'orders', label:'Confirm successful customer orders', done:false, ts:null},
  ],
  authorized:false,
  logs:[],
  pods:[
    {name:'checkout-service-7f9d4c-2k9x', restarts:0, status:'run'},
    {name:'checkout-service-7f9d4c-x81m', restarts:0, status:'run'},
    {name:'checkout-service-7f9d4c-qw3v', restarts:0, status:'run'},
    {name:'checkout-service-7f9d4c-h6bp', restarts:0, status:'run'},
    {name:'checkout-service-7f9d4c-n0lz', restarts:0, status:'run'},
    {name:'checkout-service-7f9d4c-t4ry', restarts:0, status:'run'},
  ],
  sessions:[],
  failedCheckoutAttempts:0,
  orderConfirmed:false,
  orderConfirmedAt:null,
  metrics:{
    errorRate:{cur:0.15, hist:[], min:0, max:45, unit:'%', label:'Checkout Error Rate'},
    p95:{cur:230, hist:[], min:0, max:5200, unit:'ms', label:'Checkout API p95 Latency'},
    dbPool:{cur:41, hist:[], min:0, max:100, unit:'%', label:'DB Connection Pool'},
    payTimeout:{cur:0.1, hist:[], min:0, max:35, unit:'%', label:'Payment Timeout Rate'},
    orders:{cur:812, hist:[], min:0, max:2000, unit:'', label:'Successful Orders (5m)'},
  },
};

function targetsFor(phase){
  if(phase==='normal' || phase==='resolved'){
    return {errorRate:0.15, p95:230, dbPool:41, payTimeout:0.1};
  }
  return {errorRate:38.7, p95:4800, dbPool:100, payTimeout:29.4};
}

/* ============================================================
   LOGGING / EVENTS
   ============================================================ */
function pushLog(level, svc, msg, tsDate){
  const e={ts:fmtTime(tsDate||now()), level, svc, msg};
  state.logs.push(e);
  if(state.logs.length>240) state.logs.shift();
  if(state.rops.activeSection==='logs') renderLogsAppend(e);
}
function pushTimeline(text){
  state.timeline.push({t:fmtTime(now()), d:text});
  if(state.rops.activeSection==='investigation' || state.rops.activeSection==='command') renderActiveConsole();
}
function pushSession(text, ok){
  state.sessions.unshift({sid:'#'+(8800+Math.floor(Math.random()*90)), t:text, ok, ts:fmtTime(now())});
  if(state.sessions.length>30) state.sessions.pop();
  if(state.rops.activeSection==='sessions') renderActiveConsole();
}

/* ============================================================
   PHASE / INCIDENT ENGINE
   ============================================================ */
function schedule(fn, ms){
  const id=setTimeout(fn, ms);
  state.timers.push(id);
  return id;
}
function clearTimers(){ state.timers.forEach(id=>clearTimeout(id)); state.timers=[]; }

function setPhase(p){
  state.phase=p;
  updateStatusPill();
  renderActiveConsole();
  renderStoreCheckoutIfVisible();
  updateTriggerBtn();
}

function startIncident(){
  if(state.phase!=='normal') return;
  state.incident={ id:'INC-'+(2100+Math.floor(Math.random()*800)), severity:'P1', detectedAt:null, resolvedAt:null };
  state.timeline=[]; state.evidence=[]; state.confidence=0; state.authorized=false;
  state.investigation={connected:[], traced:[]};
  state.remediationSteps.forEach(s=>{s.done=false; s.ts=null;});
  state.failedCheckoutAttempts=0;

  setPhase('incident');
  pushLog('WARN','checkout-service','p99 latency exceeded 2000ms threshold on /v1/checkout/place-order');
  pushLog('ERROR','order-service','context deadline exceeded calling payment-service');
  flipPod(2,'restart');

  schedule(()=>{
    pushLog('ERROR','payment-service','upstream timeout after 5000ms (gateway: authnet-prod)');
    pushLog('WARN','postgres-primary','connection wait time p95 = 1840ms');
    pushTimeline('Checkout error rate begins increasing (0.2% → rising)');
  },900);

  schedule(()=>{
    flipPod(0,'restart');
    pushLog('ERROR','order-service','could not acquire db connection: pool exhausted (120/120 in use)');
    pushTimeline('Payment API p95 latency increases (240ms → 4.8s)');
  },2600);

  schedule(()=>{
    pushTimeline('PostgreSQL connection pool reaches saturation (100% utilized)');
    flipPod(4,'crash');
  },4200);

  schedule(()=>{
    state.incident.detectedAt=now();
    setPhase('detecting');
    pushTimeline('Checkout failures cross critical threshold — auto-detected by RemOps');
    pushLog('ERROR','remops-detector','anomaly correlation triggered: checkout.error_rate + db.pool_utilization + payment.timeout_rate');
  },5600);

  schedule(()=>{
    pushTimeline('Customer session telemetry shows repeated order failures');
  },6600);

  schedule(()=> startInvestigation(), 7600);
}

function flipPod(idx,status){
  const p=state.pods[idx];
  if(!p) return;
  p.status=status;
  if(status!=='run') p.restarts++;
  if(state.rops.activeSection==='k8s') renderActiveConsole();
}
function healPods(){
  state.pods.forEach((p,i)=>{
    schedule(()=>{ p.status='run'; if(state.rops.activeSection==='k8s') renderActiveConsole(); }, 400*i+200);
  });
}

const SIGNAL_SOURCES=['Customer Sessions','Application Logs','Metrics','Distributed Traces','Kubernetes','Database','Deployments','GitHub'];

function startInvestigation(){
  setPhase('investigating');
  SIGNAL_SOURCES.forEach((s,i)=>{
    schedule(()=>{
      state.investigation.connected.push(s);
      if(state.rops.activeSection==='investigation') renderActiveConsole();
    }, 300*i);
  });
  const TRACE_HOPS=['Customer Session','Checkout API','Order Service','Payment Service','PostgreSQL','DB Connection Pool'];
  schedule(()=>{
    TRACE_HOPS.forEach((h,i)=>{
      schedule(()=>{
        state.investigation.traced.push(h);
        if(state.rops.activeSection==='investigation'||state.rops.activeSection==='servicemap') renderActiveConsole();
      }, 420*i);
    });
  }, 2600);

  const EVIDENCE=[
    {k:'Recent Deployment', v:'checkout-service', s:'8 minutes ago · v2.114.0 · commit a13f9c2 · deployed by j.romero'},
    {k:'Database Connections', v:'42% → 100%', s:'PostgreSQL primary pool saturated shortly after deploy'},
    {k:'Error Pattern', v:'connection pool exhausted', s:'1,842 occurrences across 6 checkout-service pods'},
    {k:'Trace', v:'checkout → order → payment → postgres', s:'db.connection.acquire span: 240ms → 4.8s (p95)'},
  ];
  schedule(()=>{
    EVIDENCE.forEach((e,i)=>{
      schedule(()=>{
        state.evidence.push(e);
        if(state.rops.activeSection==='investigation') renderActiveConsole();
      }, 550*i);
    });
  }, 5600);

  schedule(()=> setPhase('rootcause'), 8200);
  schedule(()=>{
    animateConfidence(96);
    pushTimeline('Root cause identified — checkout-service deployment linked to connection pool exhaustion');
  }, 8400);

  schedule(()=>{
    setPhase('remediation_ready');
    pushTimeline('Remediation plan generated — awaiting authorization');
  }, 10600);
}

function animateConfidence(target){
  let v=0;
  const step=()=>{
    v=Math.min(target, v+Math.ceil((target-v)*0.22)+3);
    state.confidence=v;
    if(state.rops.activeSection==='investigation') renderActiveConsole();
    if(v<target) schedule(step,60);
  };
  step();
}

function authorizeRemediation(){
  if(state.phase!=='remediation_ready') return;
  state.authorized=true;
  setPhase('remediating');
  pushLog('INFO','remops-executor','remediation authorized — starting rollback of checkout-service');

  const steps=state.remediationSteps;
  const offsets=[900,2400,4000,5600,7200,8800];
  const logs=[
    ['INFO','deploy-controller','checkout-service rolled back: v2.114.0 → v2.113.2'],
    ['INFO','k8s-controller','draining 6 unhealthy checkout-service pods, replacing with v2.113.2'],
    ['INFO','postgres-primary','connection pool utilization falling: 100% → 63%'],
    ['INFO','checkout-service','p95 latency recovering: 4.8s → 890ms'],
    ['INFO','remops-monitor','HTTP 500 rate falling: 38.7% → 4.2%'],
    ['INFO','order-service','successful order rate returning to baseline'],
  ];
  steps.forEach((st,i)=>{
    schedule(()=>{
      st.done=true; st.ts=fmtTime(now());
      pushLog(logs[i][0],logs[i][1],logs[i][2]);
      if(i===1) healPods();
      if(state.rops.activeSection==='remediation'||state.rops.activeSection==='command') renderActiveConsole();
    }, offsets[i]);
  });

  schedule(()=>{
    state.incident.resolvedAt=now();
    setPhase('resolved');
    pushTimeline('Incident resolved — checkout error rate and DB pool utilization back to baseline');
  }, 10200);
}

/* ============================================================
   METRICS HEARTBEAT
   ============================================================ */
function heartbeatTick(){
  const targets=targetsFor(state.phase);
  const m=state.metrics;
  const rate = state.phase==='remediating' ? 0.30 : 0.22;

  m.errorRate.cur = clamp(lerp(m.errorRate.cur, targets.errorRate, rate) + rnd(-0.6,0.6), 0, 45);
  m.p95.cur = clamp(lerp(m.p95.cur, targets.p95, rate) + rnd(-40,40), 150, 5200);
  m.dbPool.cur = clamp(lerp(m.dbPool.cur, targets.dbPool, rate) + rnd(-1.5,1.5), 0, 100);
  m.payTimeout.cur = clamp(lerp(m.payTimeout.cur, targets.payTimeout, rate) + rnd(-0.4,0.4), 0, 35);

  const healthy = state.phase==='normal' || state.phase==='resolved';
  m.orders.cur = clamp(m.orders.cur + (healthy ? (Math.random()<0.5? rnd(0.5,3):0) : (Math.random()<0.08? 1:0)), 0, 2000);

  Object.values(m).forEach(mm=>{
    mm.hist.push(mm.cur);
    if(mm.hist.length>36) mm.hist.shift();
  });

  if(state.rops.activeSection==='command') renderKpisLive();
  if(state.rops.activeSection==='metrics') renderMetricsLive();
  if(state.rops.activeSection==='database') renderDbLive();
  updateStatusPillSpark();
}

function ambientTick(){
  if(state.phase==='normal' || state.phase==='resolved'){
    const svcs=['api-gateway','checkout-service','inventory-service','search-service','order-service'];
    const msgs=['request handled','health check ok','cache hit ratio 94.2%','GET /v1/products 200 OK','scaling check: nominal'];
    pushLog('INFO', svcs[Math.floor(Math.random()*svcs.length)], msgs[Math.floor(Math.random()*msgs.length)]);
  }
}

/* ============================================================
   STATUS PILL / TRIGGER BUTTON
   ============================================================ */
function updateStatusPill(){
  const el=$('#statusPill'), txt=$('#statusPillText');
  el.className='status-pill';
  const map={
    normal:['All systems healthy',''],
    incident:['Checkout degrading','bad'],
    detecting:['P1 incident detected','bad'],
    investigating:['RemOps investigating','bad'],
    rootcause:['Root cause identified','warn'],
    remediation_ready:['Awaiting authorization','warn'],

function handlePlaceOrder(){
  if(state.phase==='normal') startIncident();
  const btn=$('#placeOrderBtn');

  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> Processing payment…';
  const broken = BROKEN_PHASES.has(state.phase);
  setTimeout(()=>{
    if(broken){
      state.failedCheckoutAttempts++;
      pushSession('order attempt failed — HTTP 500 (checkout_failed)', false);
      pushLog('ERROR','checkout-api','POST /v1/checkout/place-order → 500 (upstream: payment-service timeout)');
      renderStoreBody();
    } else {
      store.lastOrderItems = store.cart.map(i=>({...i}));
      store.lastOrderTotals = checkoutTotals();
      store.cart=[];
      state.orderConfirmed=true; state.orderConfirmedAt=now();

      store.view='confirm';
      renderStore();
    }
  }, 950);
}

/* ---- Incident Command ---- */
function sectionCommand(){
  const p=state.phase;
  let banner;
  if(p==='normal') banner = bannerHtml('b-idle','✓','All Systems Healthy','No active incidents. Checkout, payments, inventory, search and infrastructure are operating within normal thresholds.');
  else if(p==='incident') banner = bannerHtml('b-bad','!','Checkout Failures Increasing','Elevated error rate detected on checkout-service. RemOps is correlating signals across services.');
  else if(p==='detecting') banner = bannerHtml('b-bad','!','P1 INCIDENT DETECTED','Checkout failures increasing — customers are unable to complete orders. Automatic detection triggered.');
  else if(p==='investigating') banner = bannerHtml('b-bad','↻','Investigation In Progress','RemOps is correlating logs, metrics, traces, Kubernetes, database and deployment signals across the stack.');
  else if(p==='rootcause') banner = bannerHtml('b-warn','✓','Root Cause Identified','Recent checkout-service deployment increased database connections per request, exhausting the PostgreSQL connection pool.');
  else if(p==='remediation_ready') banner = bannerHtml('b-warn','⏸','Awaiting Authorization','A remediation plan has been generated. Review it in Remediation and authorize execution.');
  else if(p==='remediating') banner = bannerHtml('b-info','↻','Remediation In Progress','Rolling back checkout-service and restoring healthy connection pool levels.');
  else banner = bannerHtml('b-ok','✓','Incident Resolved','checkout-service has been rolled back and verified healthy. Customer checkout is restored.');

  return `
    ${sevTopline('Incident Command Center')}
    ${banner}
    <div class="kpi-row" id="kpiRow">${kpiRowHtml()}</div>
    <div class="grid2">
      <div class="panel">
        <div class="panel-h"><h2>Fleet Health</h2></div>
        ${fleetHealthHtml()}
      </div>
      <div class="panel">
        <div class="panel-h"><h2>Incident Timeline</h2><span class="sub">${state.timeline.length} events</span></div>
        ${state.timeline.length ? timelineHtml() : `<div class="empty-console" style="padding:20px 10px">No active incident timeline.</div>`}
      </div>
    </div>
    ${p==='remediation_ready' ? `<div class="panel"><div class="panel-h"><h2>Quick Action</h2></div><button class="authbtn" id="quickAuth">Authorize Remediation</button></div>` : ''}
  `;
}
function bannerHtml(cls,glyph,title,body){
  return `<div class="banner ${cls}">
    <div class="bicon" style="background:rgba(255,255,255,.08)">${glyph}</div>
    <div><h3>${title}</h3><p>${body}</p></div>
  </div>`;
}
function fleetHealthHtml(){
  const broken=BROKEN_PHASES.has(state.phase);
  const services=[
    ['Checkout', broken],

function timelineHtml(){

function kpiRowHtml(){
  const m=state.metrics;
  const items=[

    ['p95', (m.p95.cur/1000).toFixed(2)+'s', m.p95.cur>1500?'bad':m.p95.cur>500?'warn':'ok'],

  ];

function sectionServiceMap(){

      ${serviceMapSvg()}
    </div>
  `;
}
const MAP_NODES=[
  {id:'Customer Session', x:60, y:130, w:150},
  {id:'Checkout API', x:270, y:60, w:130},
  {id:'Order Service', x:460, y:130, w:130},
  {id:'Payment Service', x:650, y:60, w:140},
  {id:'PostgreSQL', x:460, y:220, w:120},
  {id:'DB Connection Pool', x:650, y:220, w:160},
];
const MAP_EDGES=[['Customer Session','Checkout API'],['Checkout API','Order Service'],['Order Service','Payment Service'],['Order Service','PostgreSQL'],['PostgreSQL','DB Connection Pool']];
function nodeState(name){
  const traced=state.investigation.traced.includes(name);
  const broken = BROKEN_PHASES.has(state.phase);
  const badNodes=['Checkout API','Order Service','Payment Service','PostgreSQL','DB Connection Pool'];
  if(!broken) return {color:'var(--ok)', label:'Healthy'};
  if(state.phase==='remediating' || state.phase==='resolved') return {color:'var(--ok)', label:'Recovering'};
  if(name==='DB Connection Pool' && (state.phase==='rootcause'||state.phase==='remediation_ready')) return {color:'var(--danger)', label:'Saturated — Root Cause'};
  if(traced) return {color:'var(--warn)', label:badNodes.includes(name)?'Degraded':'Traced'};
  if(badNodes.includes(name)) return {color:'var(--danger)', label:'Degraded'};
  return {color:'var(--ok)', label:'Healthy'};
}
function serviceMapSvg(){
  const nx=n=>n.x, ny=n=>n.y;
  const edges=MAP_EDGES.map(([a,b])=>{
    const A=MAP_NODES.find(n=>n.id===a), B=MAP_NODES.find(n=>n.id===b);
    const traced = state.investigation.traced.includes(a) && state.investigation.traced.includes(b);
    const x1=A.x+A.w, y1=A.y+18, x2=B.x, y2=B.y+18;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${traced?'var(--accent)':'#2a3450'}" stroke-width="${traced?2.5:1.5}" marker-end="url(#arrow)"/>`;
  }).join('');
  const nodes=MAP_NODES.map(n=>{
    const st=nodeState(n.id);
    return `<g>
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="36" rx="9" fill="var(--rops-surface2)" stroke="${st.color}" stroke-width="1.5"/>
      <circle cx="${n.x+14}" cy="${n.y+18}" r="4" fill="${st.color}"/>
      <text x="${n.x+24}" y="${n.y+16}" class="svcnode-label">${n.id}</text>
      <text x="${n.x+24}" y="${n.y+28}" class="svcnode-sub" fill="${st.color}">${st.label}</text>
    </g>`;
  }).join('');
  return `<svg class="svcmap" viewBox="0 0 820 280">
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3a4666"/></marker></defs>
    ${edges}${nodes}
  </svg>`;
}

function confRingSvg(pct){
  const r=27, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg class="conf-ring" viewBox="0 0 66 66">
    <circle cx="33" cy="33" r="${r}" fill="none" stroke="#232c40" stroke-width="6"/>
    <circle cx="33" cy="33" r="${r}" fill="none" stroke="var(--warn)" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 33 33)" style="transition:stroke-dashoffset .3s"/>
  </svg><div class="num" style="position:relative;width:0;height:0"><span style="position:relative;left:-49px;top:-44px;font:700 14px var(--mono)">${pct}%</span></div>`;
}

function metricChart(m, key, cls){

    <svg viewBox="0 0 200 64" preserveAspectRatio="none"><polyline data-mline points="${svgPoints(m.hist,200,64,m.min,m.max)}" fill="none" stroke="${color}" stroke-width="2.5"/></svg>

}
function sectionMetrics(){
  const m=state.metrics;
  const clsOf = (k,v)=> k==='errorRate'? (v>10?'bad':v>2?'warn':'ok') : k==='p95'? (v>1500?'bad':v>500?'warn':'ok') : k==='dbPool'? (v>90?'bad':v>65?'warn':'ok') : k==='payTimeout'? (v>10?'bad':v>2?'warn':'ok') : 'ok';
  return `
    ${sevTopline('Metrics')}

      <div class="grid2" id="metricsGrid">
        ${metricChart(m.errorRate,'errorRate',clsOf('errorRate',m.errorRate.cur))}
        ${metricChart(m.p95,'p95',clsOf('p95',m.p95.cur))}
        ${metricChart(m.dbPool,'dbPool',clsOf('dbPool',m.dbPool.cur))}
        ${metricChart(m.payTimeout,'payTimeout',clsOf('payTimeout',m.payTimeout.cur))}
      </div>
      <div style="margin-top:12px">${metricChart(m.orders,'orders','ok')}</div>
    </div>
  `;
}
function renderMetricsLive(){
  const grid=$('#ropsMain'); if(!grid || state.rops.activeSection!=='metrics') return;
  const m=state.metrics;
  const clsOf = (k,v)=> k==='errorRate'? (v>10?'bad':v>2?'warn':'ok') : k==='p95'? (v>1500?'bad':v>500?'warn':'ok') : k==='dbPool'? (v>90?'bad':v>65?'warn':'ok') : k==='payTimeout'? (v>10?'bad':v>2?'warn':'ok') : 'ok';
  ['errorRate','p95','dbPool','payTimeout','orders'].forEach(k=>{

      </div>
    </div>

}

}

  switchEnv(b.getAttribute('data-env'));
});
$('#resetBtn').addEventListener('click', resetDemo);

/* ============================================================
   AUTOPLAY — simulated cursor drives the whole demo hands-free
   ============================================================ */
const cursorEl = $('#simCursor');
const captionEl = $('#simCaption');
const autoplay = { token:0, paused:false, running:false, timers:[] };

function autoRawWait(ms){
  return new Promise(res=>{ const id=setTimeout(res, ms); autoplay.timers.push(id); });
}
function clearAutoplayTimers(){ autoplay.timers.forEach(id=>clearTimeout(id)); autoplay.timers=[]; }

function placeCursorAt(x,y){
  cursorEl.style.left = x+'px'; cursorEl.style.top = y+'px';
  captionEl.style.left = x+'px'; captionEl.style.top = y+'px';
}
function pulseClick(){
  cursorEl.classList.remove('clicking'); void cursorEl.offsetWidth; cursorEl.classList.add('clicking');
}
function setPauseBtnUI(){
  const b=$('#autoplayToggle');
  if(!b) return;
  b.textContent = autoplay.paused ? '▶ Resume Autoplay' : '⏸ Pause Autoplay';
}

function stopAutoplayScript(){
  autoplay.token++;
  autoplay.running=false;
  autoplay.paused=false;
  clearAutoplayTimers();
  setPauseBtnUI();
  cursorEl.classList.remove('show');
  captionEl.classList.remove('show');
}

async function playScript(myToken){
  const dead = ()=> myToken!==autoplay.token;
  async function wait(ms){
    let elapsed=0;
    while(elapsed<ms){
      if(dead()) return;
      if(autoplay.paused){ await autoRawWait(150); continue; }
      const chunk=Math.min(150, ms-elapsed);
      await autoRawWait(chunk);
      elapsed+=chunk;
    }
  }
  async function waitForPhase(target, timeoutMs){
    const start=Date.now();
    const targetIdx=PHASES.indexOf(target);
    while(PHASES.indexOf(state.phase)<targetIdx){
      if(dead()) return false;
      if(Date.now()-start>timeoutMs) return false;
      await wait(200);
    }
    return true;
  }
  function caption(text){
    captionEl.textContent=text;
    captionEl.classList.add('show');
  }
  async function findEl(selector){
    for(let i=0;i<20;i++){
      const el=document.querySelector(selector);
      if(el) return el;
      if(dead()) return null;
      await autoRawWait(100);
    }
    return document.querySelector(selector);
  }
  async function goto(selector){
    const el=await findEl(selector);
    if(!el || dead()) return null;
    const r=el.getBoundingClientRect();
    cursorEl.classList.add('show');
    placeCursorAt(r.left+r.width/2, r.top+r.height/2);
    captionEl.classList.add('show');
    await wait(650);
    return dead() ? null : el;
  }
  async function click(selector, cap){
    if(cap) caption(cap);
    const el=await goto(selector);
    if(!el || dead()) return null;
    await wait(180);
    pulseClick();
    el.click();
    await wait(380);
    return el;
  }
  async function typeInto(selector, text, cap){
    if(cap) caption(cap);
    const el=await goto(selector);
    if(!el || dead()) return;
    el.focus();
    for(const ch of text){
      if(dead()) return;
      el.value += ch;
      el.dispatchEvent(new Event('input',{bubbles:true}));
      await autoRawWait(38);
    }
    await wait(400);
  }

  autoplay.running=true;
  await wait(900);
  if(dead()) return;

  caption('Customer browsing meridian.com');
  await wait(500);
  await typeInto('#searchInput','jacket');
  if(dead()) return;

  await click('.mer-card','Opening product page');
  if(dead()) return;
  await click('[data-size="L"]','Selecting size');
  await click('[data-color="Midnight"]','Selecting color');
  await click('#addCartBtn','Adding to cart');
  if(dead()) return;
  await click('.mer-cart','Opening cart');
  await click('#proceedCheckoutBtn','Proceeding to checkout');
  if(dead()) return;
  await wait(700);

  await click('#placeOrderBtn','Customer clicks Place Order');
  if(dead()) return;
  await wait(900);
  caption('Order failed — customer retries');
  await click('#placeOrderBtn');
  if(dead()) return;
  await wait(900);

  caption('Escalating to RemOpsAI…');
  await click('[data-env="rops"]');
  if(dead()) return;
  await wait(600);

  await goto('[data-sec="command"]');
  caption('P1 incident detected automatically');
  await wait(2200);
  if(dead()) return;

  await click('[data-sec="metrics"]','Error rate and latency spiking');
  await wait(2400);
  if(dead()) return;

  await click('[data-sec="k8s"]','Checkout pods restarting');
  await wait(2000);
  if(dead()) return;

  await click('[data-sec="logs"]','Application logs streaming errors');
  await wait(2000);
  if(dead()) return;

  await click('[data-sec="servicemap"]','Tracing the dependency chain');
  await wait(2600);
  if(dead()) return;

  await click('[data-sec="investigation"]','Correlating evidence across the stack');
  const gotRoot = await waitForPhase('rootcause', 20000);
  if(dead()) return;
  if(gotRoot){ caption('Root cause identified'); await wait(1600); }
  await waitForPhase('remediation_ready', 15000);
  if(dead()) return;

  await click('[data-sec="remediation"]','Reviewing remediation plan');
  await wait(1200);
  if(dead()) return;
  await click('#authBtn','Authorizing remediation');
  if(dead()) return;

  await goto('[data-sec="command"]');
  caption('Rolling back deployment, restoring connections…');
  await waitForPhase('resolved', 20000);
  if(dead()) return;
  await wait(1000);

  caption('Verifying the customer can now order');
  await click('[data-env="store"]');
  if(dead()) return;
  await wait(500);
  await click('#placeOrderBtn','Retrying the same order');
  if(dead()) return;
  await wait(1400);
  caption('Order confirmed');
  await wait(1400);

  await click('[data-env="rops"]');
  await click('[data-sec="report"]','Auto-generated incident report');
  if(dead()) return;
  await wait(3200);

  caption('Demo complete — press Replay to run again');
  await wait(2200);
  captionEl.classList.remove('show');
  cursorEl.classList.remove('show');
  autoplay.running=false;
}

function launchAutoplay(){
  clearAutoplayTimers();
  autoplay.token++;
  autoplay.paused=false;
  setPauseBtnUI();
  playScript(autoplay.token);
}

$('#autoplayToggle').addEventListener('click', ()=>{
  if(!autoplay.running) return;
  autoplay.paused=!autoplay.paused;
  setPauseBtnUI();
});
$('#replayBtn').addEventListener('click', ()=>{
  stopAutoplayScript();
  resetDemo();
  autoRawWait(400).then(launchAutoplay);
});

store.lastOrderItems=[];
renderStore();
renderActiveConsole();
updateStatusPill();
updateTriggerBtn();

state.heartbeat = setInterval(heartbeatTick, 700);
setInterval(ambientTick, 3600);

launchAutoplay();

})();
