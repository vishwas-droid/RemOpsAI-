<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RemOpsAI Incident Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0a0d12; --bg-raised:#0d1119; --ink:#e8ecf3;
  --rops-bg:#0b0f16; --rops-surface:#121826; --rops-surface2:#171f30; --rops-border:#232c40; --rops-border-soft:#1a2233;
  --rops-text:#e7ecf7; --rops-dim:#8b93ab; --rops-faint:#5c657c;
  --accent:#4c8dff; --accent-2:#22d3b7; --accent-soft:rgba(76,141,255,.14);
  --danger:#f0475a; --danger-soft:rgba(240,71,90,.14);
  --warn:#f5a623; --warn-soft:rgba(245,166,35,.14);
  --ok:#22c77a; --ok-soft:rgba(34,199,122,.14);

  --mer-bg:#fbf9f6; --mer-surface:#ffffff; --mer-border:#e7e2d9; --mer-ink:#1c1a17; --mer-dim:#6f6a60;
  --mer-accent:#c65a2e; --mer-accent-ink:#ffffff; --mer-accent-soft:#fbe6da;

  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --radius:10px; --radius-lg:16px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
::selection{background:var(--accent-soft)}
.hidden{display:none !important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#28324a;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}

/* ============ SIMULATION CONTROL STRIP ============ */
.simbar{
  position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;
  padding:9px 18px;background:linear-gradient(180deg,#0d1119,#0a0d12);
  border-bottom:1px solid #1c2334;
}
.simbar-tag{
  display:flex;align-items:center;gap:7px;font:700 10.5px/1 var(--mono);letter-spacing:.09em;
  color:var(--accent-2);padding:6px 9px;border:1px solid #1c3a3a;border-radius:7px;background:rgba(34,211,183,.06);
  white-space:nowrap;
}
.simbar-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 3px rgba(34,211,183,.18)}
.envswitch{display:flex;gap:4px;background:#10151f;border:1px solid #1c2334;border-radius:10px;padding:3px}
.envbtn{
  display:flex;align-items:center;gap:7px;padding:7px 13px;border:none;background:transparent;color:var(--rops-dim);
  border-radius:8px;font-size:12.5px;font-weight:600;letter-spacing:.01em;transition:background .15s,color .15s;
}
.envbtn .b{width:6px;height:6px;border-radius:50%;flex:none}
.envbtn.active{background:#1c2536;color:var(--ink)}
.envbtn:not(.active):hover{background:#141b28;color:#c6cce0}
.simbar-spacer{flex:1}
.status-pill{
  display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;
  border:1px solid var(--rops-border);background:var(--rops-surface);color:var(--ok);white-space:nowrap;
}
.status-pill .pdot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px currentColor;opacity:.9}
.status-pill.warn{color:var(--warn)}
.status-pill.bad{color:var(--danger);animation:pulseBad 1.4s ease-in-out infinite}
.status-pill.recovering{color:var(--accent)}
@keyframes pulseBad{0%,100%{box-shadow:0 0 0 0 rgba(240,71,90,0)}50%{box-shadow:0 0 0 5px rgba(240,71,90,.12)}}
.btn{
  border-radius:9px;padding:8px 15px;font-size:12.5px;font-weight:700;border:1px solid transparent;letter-spacing:.01em;
  transition:filter .15s,transform .05s;white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn-trigger{background:linear-gradient(180deg,#ff5a68,#e3324a);color:#fff;box-shadow:0 6px 18px -6px rgba(240,71,90,.55)}
.btn-trigger:hover:not(:disabled){filter:brightness(1.08)}
.btn-ghost{background:#12182450;border-color:var(--rops-border);color:var(--rops-dim)}
.btn-ghost:hover{color:var(--ink);border-color:#33405c}
.btn-auto{background:var(--rops-surface2);border-color:var(--rops-border);color:#cfe0ff;display:flex;align-items:center;gap:6px}
.btn-auto:hover{border-color:#3a4666}
.simbar{flex-wrap:wrap;row-gap:8px}

/* ============ SIMULATED CURSOR (autoplay) ============ */
.sim-cursor{
  position:fixed;top:0;left:0;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #ffffff, #cfe0ff 45%, var(--accent) 100%);
  box-shadow:0 0 0 4px rgba(76,141,255,.16), 0 8px 18px -6px rgba(0,0,0,.55);
  pointer-events:none;z-index:9999;transform:translate(-50%,-50%);
  transition:left .6s cubic-bezier(.45,0,.2,1), top .6s cubic-bezier(.45,0,.2,1), opacity .25s ease;
  opacity:0;
}
.sim-cursor.show{opacity:1}
.sim-cursor::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(76,141,255,.4);opacity:0;
}
.sim-cursor.clicking::after{animation:cursorPulse .5s ease-out}
@keyframes cursorPulse{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2)}}
.sim-caption{
  position:fixed;top:0;left:0;z-index:9999;background:#0d1119;border:1px solid #2a3450;color:#e7ecf7;
  padding:6px 13px;border-radius:20px;font:600 12px var(--sans);white-space:nowrap;pointer-events:none;
  transform:translate(-50%,calc(-100% - 20px));opacity:0;transition:left .6s cubic-bezier(.45,0,.2,1), top .6s cubic-bezier(.45,0,.2,1), opacity .25s ease;
  box-shadow:0 12px 26px -12px rgba(0,0,0,.6);
}
.sim-caption.show{opacity:1}
@media (prefers-reduced-motion: reduce){
  .sim-cursor, .sim-caption{transition:opacity .2s ease}
}

/* ============ VIEWPORT ============ */
.viewport{flex:1;min-height:0;background:var(--bg)}
.env{display:none;min-height:calc(100vh - 49px)}
.env.active{display:block}

/* ============================================================
   MERIDIAN STOREFRONT
   ============================================================ */
#env-store{background:var(--mer-bg);color:var(--mer-ink)}
.mer-shell{max-width:1180px;margin:0 auto}
.mer-addr{
  display:flex;align-items:center;gap:8px;padding:7px 18px;background:#f1ede4;border-bottom:1px solid var(--mer-border);
  font:500 11.5px var(--mono);color:var(--mer-dim);
}
.mer-addr .lockdot{width:6px;height:6px;border-radius:50%;background:#3fa15a}
.mer-header{
  display:flex;align-items:center;gap:22px;padding:16px 28px;background:var(--mer-surface);
  border-bottom:1px solid var(--mer-border);position:sticky;top:49px;z-index:20;
}
.mer-logo{font-weight:800;font-size:21px;letter-spacing:-.02em;color:var(--mer-ink);cursor:pointer;white-space:nowrap}
.mer-logo span{color:var(--mer-accent)}
.mer-search{
  flex:1;display:flex;align-items:center;gap:10px;background:#f4f1eb;border:1px solid var(--mer-border);
  border-radius:10px;padding:9px 14px;max-width:560px;
}
.mer-search input{flex:1;border:none;background:transparent;font-size:13.5px;color:var(--mer-ink);outline:none}
.mer-search svg{flex:none;opacity:.5}
.mer-navlinks{display:flex;gap:18px;font-size:12.5px;color:var(--mer-dim);font-weight:600}
.mer-navlinks a{color:inherit;text-decoration:none;cursor:pointer}
.mer-navlinks a:hover{color:var(--mer-ink)}
.mer-spacer{flex:1}
.mer-cart{
  display:flex;align-items:center;gap:7px;background:var(--mer-ink);color:#fff;border:none;border-radius:9px;
  padding:9px 14px;font-weight:700;font-size:12.5px;position:relative;
}
.mer-cart .cnt{
  background:var(--mer-accent);border-radius:50%;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;padding:0 4px;
}
.mer-body{padding:26px 28px 60px}
.mer-crumb{font-size:12px;color:var(--mer-dim);margin-bottom:16px;display:flex;gap:6px;align-items:center}
.mer-crumb a{color:var(--mer-dim);cursor:pointer;text-decoration:none}
.mer-crumb a:hover{color:var(--mer-accent)}
.mer-hero{
  background:linear-gradient(120deg,#2a2420,#453a2e);border-radius:18px;padding:38px 40px;color:#f4ede1;margin-bottom:26px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.mer-hero h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.01em}
.mer-hero p{margin:0;color:#cdbfa8;font-size:13.5px}
.mer-hero .tag{display:inline-block;margin-top:14px;background:var(--mer-accent);padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700}
.mer-grid-title{font-size:13px;font-weight:700;color:var(--mer-dim);text-transform:uppercase;letter-spacing:.06em;margin:0 0 14px}
.mer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:900px){.mer-grid{grid-template-columns:repeat(2,1fr)}}
.mer-card{
  background:var(--mer-surface);border:1px solid var(--mer-border);border-radius:14px;overflow:hidden;cursor:pointer;
  transition:box-shadow .15s,transform .1s;
}
.mer-card:hover{box-shadow:0 14px 30px -16px rgba(0,0,0,.18);transform:translateY(-2px)}
.mer-thumb{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:34px}
.mer-card .info{padding:12px 13px 15px}
.mer-card h3{margin:0 0 4px;font-size:13px;font-weight:600;line-height:1.35}
.mer-rating{font-size:11px;color:var(--mer-dim);margin-bottom:6px}
.mer-rating b{color:#c9a227}
.mer-price{font-size:15px;font-weight:800}
.mer-empty{padding:60px 0;text-align:center;color:var(--mer-dim);font-size:13.5px}

.mer-pdp{display:grid;grid-template-columns:1.05fr 1fr;gap:44px}
@media (max-width:860px){.mer-pdp{grid-template-columns:1fr}}
.mer-gallery-main{aspect-ratio:1/1;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:90px;margin-bottom:12px}
.mer-gallery-thumbs{display:flex;gap:9px}
.mer-gthumb{width:62px;height:62px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid transparent;cursor:pointer}
.mer-gthumb.sel{border-color:var(--mer-accent)}
.mer-pdp h1{font-size:23px;margin:0 0 8px;letter-spacing:-.01em}
.mer-pdp-price{font-size:24px;font-weight:800;margin:6px 0 16px}
.mer-pdp-price .was{font-size:14px;color:var(--mer-dim);text-decoration:line-through;font-weight:500;margin-left:8px}
.mer-section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mer-dim);margin:18px 0 8px}
.mer-swatches{display:flex;gap:8px;flex-wrap:wrap}
.mer-pill{
  padding:8px 15px;border-radius:9px;border:1.5px solid var(--mer-border);background:#fff;font-size:12.5px;font-weight:600;
}
.mer-pill.sel{border-color:var(--mer-ink);background:var(--mer-ink);color:#fff}
.mer-qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--mer-border);border-radius:9px;width:fit-content}
.mer-qty button{width:34px;height:34px;background:none;border:none;font-size:16px;font-weight:700}
.mer-qty span{width:34px;text-align:center;font-weight:700;font-size:13px}
.mer-addcart{
  margin-top:22px;width:100%;padding:14px;background:var(--mer-ink);color:#fff;border:none;border-radius:11px;
  font-size:14px;font-weight:800;letter-spacing:.01em;
}
.mer-addcart:hover{background:#000}
.mer-reviews{margin-top:26px;border-top:1px solid var(--mer-border);padding-top:18px}
.mer-review{padding:12px 0;border-bottom:1px solid #f0ece3}
.mer-review .stars{color:#c9a227;font-size:12px;margin-bottom:4px}
.mer-review .who{font-size:11.5px;color:var(--mer-dim);margin-top:4px}
.mer-review p{margin:4px 0 0;font-size:12.5px;line-height:1.55;color:#3a352d}

.mer-toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--mer-ink);color:#fff;
  padding:12px 20px;border-radius:11px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  z-index:500;box-shadow:0 20px 40px -16px rgba(0,0,0,.4);display:flex;align-items:center;gap:9px;
}
.mer-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.mer-cartview{max-width:760px;margin:0 auto}
.mer-cart-row{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--mer-border)}
.mer-cart-thumb{width:66px;height:66px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.mer-cart-row .meta{flex:1;min-width:0}
.mer-cart-row .meta h4{margin:0 0 3px;font-size:13.5px}
.mer-cart-row .meta .sub{font-size:11.5px;color:var(--mer-dim)}
.mer-cart-row .price{font-weight:800;font-size:14px;white-space:nowrap}
.mer-summary{
  background:var(--mer-surface);border:1px solid var(--mer-border);border-radius:14px;padding:20px 22px;margin-top:22px;
}
.mer-summary .line{display:flex;justify-content:space-between;font-size:13px;color:var(--mer-dim);padding:5px 0}
.mer-summary .line.total{border-top:1px solid var(--mer-border);margin-top:8px;padding-top:12px;font-size:16px;font-weight:800;color:var(--mer-ink)}
.mer-cta{width:100%;padding:15px;border:none;border-radius:11px;background:var(--mer-accent);color:#fff;font-size:14.5px;font-weight:800;margin-top:16px}
.mer-cta:hover:not(:disabled){filter:brightness(1.06)}
.mer-cta.secondary{background:var(--mer-ink)}

.mer-checkout{display:grid;grid-template-columns:1.2fr .9fr;gap:38px;max-width:980px;margin:0 auto}
@media (max-width:800px){.mer-checkout{grid-template-columns:1fr}}
.mer-field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mer-field{display:flex;flex-direction:column;gap:6px}
.mer-field label{font-size:11px;font-weight:700;color:var(--mer-dim);text-transform:uppercase;letter-spacing:.05em}
.mer-field input{border:1.5px solid var(--mer-border);border-radius:9px;padding:11px 12px;font-size:13px;background:#fff;color:var(--mer-ink)}
.mer-field input:focus{outline:none;border-color:var(--mer-accent)}
.mer-card-panel{background:var(--mer-surface);border:1px solid var(--mer-border);border-radius:14px;padding:20px 22px;margin-bottom:18px}
.mer-card-panel h3{margin:0 0 14px;font-size:13.5px}
.mer-payrow{display:flex;align-items:center;gap:12px;border:1.5px solid var(--mer-border);border-radius:10px;padding:12px 14px;font:600 13px var(--mono)}
.mer-payrow .brand{background:#1a1f71;color:#fff;font:800 10px var(--sans);padding:3px 7px;border-radius:4px}

.mer-alert{
  display:flex;gap:12px;align-items:flex-start;background:#fdecee;border:1.5px solid #f6b9c1;color:#9a1730;border-radius:12px;
  padding:14px 16px;margin-bottom:18px;font-size:13px;line-height:1.5;animation:shakeIn .35s ease;
}
@keyframes shakeIn{0%{transform:translateX(0);opacity:0}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}100%{transform:translateX(0);opacity:1}}
.mer-alert b{display:block;margin-bottom:2px;font-size:13.5px}
.mer-alert .code{font:600 11px var(--mono);color:#c4405a;margin-top:5px;display:block}

.mer-confirm{max-width:560px;margin:60px auto;text-align:center}
.mer-confirm .ring{width:76px;height:76px;border-radius:50%;background:var(--ok-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.mer-confirm h1{font-size:23px;margin:0 0 8px}
.mer-confirm .ordno{font:700 15px var(--mono);color:var(--mer-dim);margin-bottom:26px}
.mer-confirm-card{background:var(--mer-surface);border:1px solid var(--mer-border);border-radius:14px;padding:20px 22px;text-align:left}

.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   REMOPSAI CONSOLE — "PHOSPHOR FLIGHT DECK"
   A flight-ops / annunciator board, not a SaaS dashboard.
   Rules not cards. Amber phosphor. Tabular numerals. No blur.
   ============================================================ */
#env-rops{
  --deck-void:#08090b;
  --deck-plate:#0d0e11;
  --deck-plate2:#101116;
  --deck-rule:#1e2027;
  --deck-rule2:#2b2e38;
  --amber:#f2a115;
  --amber-lit:#ffc75c;
  --amber-dim:rgba(242,161,21,.13);
  --red:#ff3b30;
  --red-dim:rgba(255,59,48,.13);
  --mint:#2fe08a;
  --mint-dim:rgba(47,224,138,.12);
  --ice:#63b3ff;
  --ice-dim:rgba(99,179,255,.12);
  --txt:#e6e7ea;
  --txt-2:#9ba0ac;
  --txt-3:#5d626e;
  --deck-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--deck-void);
  color:var(--txt);
  font-feature-settings:"tnum" 1,"zero" 1;
  position:relative;
}
/* CRT scanlines — the one texture, kept near-invisible */
#env-rops::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
}
#env-rops *{border-radius:0}

/* ---------- Shell ---------- */
.rops-shell{display:flex;min-height:calc(100vh - 49px);align-items:stretch}

/* ---------- Index rail (sidebar) ---------- */
.rops-side{
  width:206px;flex:none;padding:0;gap:0;
  background:var(--deck-plate);
  border-right:1px solid var(--deck-rule);
  display:flex;flex-direction:column;
}
.rops-brand{
  display:flex;align-items:center;gap:9px;
  padding:13px 14px;border-bottom:1px solid var(--deck-rule);
}
.rops-mark{
  width:24px;height:24px;flex:none;background:var(--amber);position:relative;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
}
.rops-mark svg path{stroke:#0b0906 !important}
.rops-brand b{font:800 13px var(--deck-mono);letter-spacing:.02em;color:var(--txt)}
.rops-brand b span{color:var(--amber)}
.rops-brand .sub{
  display:block;font:500 8px var(--deck-mono);letter-spacing:.24em;
  color:var(--txt-3);text-transform:uppercase;margin-top:3px;
}
.navsec{
  font:600 8.5px var(--deck-mono);letter-spacing:.22em;color:var(--txt-3);
  text-transform:uppercase;padding:15px 14px 7px;
  display:flex;align-items:center;gap:8px;
}
.navsec::after{content:"";flex:1;height:1px;background:var(--deck-rule)}
.navitem{
  position:relative;width:100%;display:grid;
  grid-template-columns:20px 15px 1fr auto;align-items:center;gap:9px;
  padding:6px 14px;background:none;border:none;cursor:pointer;
  font:500 11.5px var(--deck-mono);letter-spacing:-.01em;
  color:var(--txt-2);text-align:left;
  transition:color .12s linear,background .12s linear;
}
.navitem::before{
  content:attr(data-idx);
  font:600 9px var(--deck-mono);color:var(--txt-3);letter-spacing:.02em;
}
.navitem svg{opacity:.55;width:14px;height:14px}
.navitem:hover:not(:disabled){background:#15161b;color:var(--txt)}
.navitem.active{background:var(--amber-dim);color:var(--amber-lit)}
.navitem.active::before{color:var(--amber)}
.navitem.active svg{opacity:1}
.navitem.active::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--amber);
}
.navitem:disabled{opacity:.32;cursor:default}
.navitem .nbadge{
  font:700 8px var(--deck-mono);letter-spacing:.08em;padding:2px 5px;
  background:var(--red);color:#150202;
}
.navitem .nbadge:not(.ok){animation:lampBlink 1.1s steps(1,end) infinite}
.navitem .nbadge.ok{background:var(--mint);color:#052414}
@keyframes lampBlink{0%,49%{opacity:1}50%,100%{opacity:.22}}

.rops-sidefoot{margin-top:auto;border-top:1px solid var(--deck-rule);padding:11px 14px 13px}
.sfrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2.5px 0;font:500 9.5px var(--deck-mono)}
.sfrow .k{color:var(--txt-3);letter-spacing:.1em;text-transform:uppercase}
.sfrow .v{color:var(--txt-2)}
.sfrow .v.lit{color:var(--mint)}

/* ---------- Main ---------- */
.rops-main{flex:1;min-width:0;padding:0 0 70px;overflow-x:hidden}

/* ---------- Annunciator header strip ---------- */
.deck-strip{
  display:flex;align-items:stretch;border-bottom:1px solid var(--deck-rule);
  background:var(--deck-plate);
}
.deck-strip .cell{
  padding:10px 18px;border-right:1px solid var(--deck-rule);
  display:flex;flex-direction:column;gap:4px;justify-content:center;min-width:0;
}
.deck-strip .cell .k{font:600 8.5px var(--deck-mono);letter-spacing:.2em;color:var(--txt-3);text-transform:uppercase}
.deck-strip .cell .v{font:700 14px var(--deck-mono);color:var(--txt);letter-spacing:-.01em;white-space:nowrap}
.deck-strip .cell.title{flex:1;border-right:1px solid var(--deck-rule)}
.deck-strip .cell.title .v{font-size:17px;letter-spacing:-.02em}
.deck-strip .cell .v.red{color:var(--red)}
.deck-strip .cell .v.amber{color:var(--amber-lit)}
.deck-strip .cell .v.mint{color:var(--mint)}
.deck-strip .cell.clock .v{font-size:20px;font-weight:800}
.deck-strip .cell:last-child{border-right:none}
.deck-state{
  display:flex;align-items:center;gap:8px;padding:0 20px;flex:none;
  border-right:1px solid var(--deck-rule);
}
.deck-lamp{width:9px;height:9px;flex:none;background:var(--txt-3)}
.deck-lamp.red{background:var(--red);box-shadow:0 0 9px 0 rgba(255,59,48,.7);animation:lampBlink 1.1s steps(1,end) infinite}
.deck-lamp.amber{background:var(--amber);box-shadow:0 0 9px 0 rgba(242,161,21,.65)}
.deck-lamp.mint{background:var(--mint);box-shadow:0 0 9px 0 rgba(47,224,138,.55)}
.deck-state .lbl{font:700 10px var(--deck-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--txt-2);white-space:nowrap}
.deck-state.red .lbl{color:var(--red)}
.deck-state.amber .lbl{color:var(--amber-lit)}
.deck-state.mint .lbl{color:var(--mint)}

/* ---------- Section body / topline ---------- */
.deck-body{padding:20px 22px 0}
.rops-topline{display:none}

/* ---------- Panels: rules, not cards ---------- */
.panel{
  background:var(--deck-plate);
  border:1px solid var(--deck-rule);
  border-radius:0;padding:0;margin-bottom:16px;
}
.panel-h{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin:0;padding:9px 14px;border-bottom:1px solid var(--deck-rule);
  background:var(--deck-plate2);
}
.panel-h h2{
  margin:0;font:700 9.5px var(--deck-mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--txt-2);display:flex;align-items:center;gap:9px;
}
.panel-h h2::before{
  content:attr(data-n);color:var(--amber);font-weight:700;letter-spacing:.06em;
}
.panel-h .sub{font:500 9.5px var(--deck-mono);letter-spacing:.06em;color:var(--txt-3)}
.panel > *:not(.panel-h){padding-left:14px;padding-right:14px}
.panel > *:not(.panel-h):first-child{padding-top:12px}
.panel > *:last-child{padding-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}

/* ---------- Callout (replaces banner) ---------- */
.banner{
  display:flex;gap:0;align-items:stretch;padding:0;margin-bottom:16px;
  border:1px solid var(--deck-rule);background:var(--deck-plate);position:relative;
}
.banner .bicon{
  flex:none;width:52px;display:flex;align-items:center;justify-content:center;
  font:800 20px var(--deck-mono);border-right:1px solid var(--deck-rule);
  background:var(--deck-plate2);
}
.banner .btext{padding:13px 16px;flex:1;min-width:0}
.banner h3{
  margin:0 0 5px;font:700 12px var(--deck-mono);letter-spacing:.14em;text-transform:uppercase;
}
.banner p{margin:0;font:400 12.5px var(--sans);color:var(--txt-2);line-height:1.6;max-width:82ch}
.banner.b-bad{border-color:rgba(255,59,48,.42);background:linear-gradient(90deg,var(--red-dim),transparent 42%)}
.banner.b-bad .bicon{color:var(--red);background:rgba(255,59,48,.10);border-right-color:rgba(255,59,48,.42)}
.banner.b-bad h3{color:var(--red)}
.banner.b-warn{border-color:rgba(242,161,21,.42);background:linear-gradient(90deg,var(--amber-dim),transparent 42%)}
.banner.b-warn .bicon{color:var(--amber-lit);background:rgba(242,161,21,.10);border-right-color:rgba(242,161,21,.42)}
.banner.b-warn h3{color:var(--amber-lit)}
.banner.b-info{border-color:rgba(99,179,255,.4);background:linear-gradient(90deg,var(--ice-dim),transparent 42%)}
.banner.b-info .bicon{color:var(--ice);background:rgba(99,179,255,.09);border-right-color:rgba(99,179,255,.4)}
.banner.b-info h3{color:var(--ice)}
.banner.b-ok,.banner.b-idle{border-color:rgba(47,224,138,.4);background:linear-gradient(90deg,var(--mint-dim),transparent 42%)}
.banner.b-ok .bicon,.banner.b-idle .bicon{color:var(--mint);background:rgba(47,224,138,.09);border-right-color:rgba(47,224,138,.4)}
.banner.b-ok h3,.banner.b-idle h3{color:var(--mint)}
.banner-facts{display:flex;flex-wrap:wrap;gap:0;margin-top:11px;border-top:1px solid var(--deck-rule)}
.bfact{padding:7px 16px 0 0;margin-right:16px;min-width:104px}
.bfact .k{font:600 8.5px var(--deck-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--txt-3)}
.bfact .v{font:700 11.5px var(--deck-mono);color:var(--txt);margin-top:3px}

/* ---------- Phase ladder ---------- */
.ladder{display:flex;align-items:stretch;border:1px solid var(--deck-rule);background:var(--deck-plate);margin-bottom:16px}
.lstep{
  flex:1;min-width:0;padding:9px 13px;border-right:1px solid var(--deck-rule);
  display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden;
}
.lstep:last-child{border-right:none}
.lstep .lidx{font:600 8.5px var(--deck-mono);letter-spacing:.2em;color:var(--txt-3)}
.lstep .lname{font:700 11px var(--deck-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--txt-3);white-space:nowrap}
.lstep .lbar{height:2px;background:var(--deck-rule2);margin-top:2px}
.lstep.done .lname{color:var(--mint)}
.lstep.done .lbar{background:var(--mint)}
.lstep.done .lidx{color:var(--mint)}
.lstep.active{background:var(--amber-dim)}
.lstep.active .lname{color:var(--amber-lit)}
.lstep.active .lidx{color:var(--amber)}
.lstep.active .lbar{background:var(--deck-rule2);position:relative;overflow:hidden}
.lstep.active .lbar::after{
  content:"";position:absolute;inset:0;background:var(--amber);
  transform-origin:left;animation:barSweep 1.5s linear infinite;
}
@keyframes barSweep{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}

/* ---------- Strip-chart wall (shared time axis) ---------- */
.stripwall{position:relative;padding:0 !important}
.strip{
  display:grid;grid-template-columns:186px 1fr 92px;align-items:stretch;
  border-bottom:1px solid var(--deck-rule);
}
.strip:last-child{border-bottom:none}
.strip .sid{
  padding:10px 14px;border-right:1px solid var(--deck-rule);
  display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;
}
.strip .sid .nm{font:600 10px var(--deck-mono);letter-spacing:.13em;text-transform:uppercase;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .sid .th{font:500 9px var(--deck-mono);color:var(--txt-3);letter-spacing:.04em}
.strip .plot{position:relative;min-width:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.032) 0 1px,transparent 1px 44px);
}
.strip .plot svg{display:block;width:100%;height:52px}
.strip .val{
  padding:10px 14px;border-left:1px solid var(--deck-rule);
  display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:2px;
}
.strip .val .n{font:700 16px var(--deck-mono);letter-spacing:-.02em;line-height:1}
.strip .val .d{font:600 9px var(--deck-mono);letter-spacing:.04em;color:var(--txt-3)}
.strip.s-ok .val .n{color:var(--txt)}
.strip.s-warn .val .n{color:var(--amber-lit)}
.strip.s-bad .val .n{color:var(--red)}
.strip.s-bad{background:linear-gradient(90deg,rgba(255,59,48,.055),transparent 55%)}
.strip.s-bad .sid .nm{color:var(--red)}
.strip .val .d.up{color:var(--red)}
.strip .val .d.down{color:var(--mint)}
.strip-thresh{stroke:var(--red);stroke-width:1;stroke-dasharray:3 3;opacity:.42;vector-effect:non-scaling-stroke}
.strip-axis{
  display:grid;grid-template-columns:186px 1fr 92px;
  border-top:1px solid var(--deck-rule);background:var(--deck-plate2);
}
.strip-axis .lead{padding:5px 14px;border-right:1px solid var(--deck-rule);font:600 8.5px var(--deck-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--txt-3)}
.strip-axis .ticks{display:flex;justify-content:space-between;padding:5px 6px;font:500 8.5px var(--deck-mono);color:var(--txt-3);letter-spacing:.06em}
.strip-axis .tail{border-left:1px solid var(--deck-rule)}


/* ---------- Metrics wall ---------- */
.mwall{padding:0 !important}
.mstrip{
  display:grid;grid-template-columns:210px 1fr 300px;align-items:stretch;
  border-bottom:1px solid var(--deck-rule);
}
.mstrip:last-child{border-bottom:none}
.mhead{
  padding:14px;border-right:1px solid var(--deck-rule);
  display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0;
}
.mname{font:600 11px var(--deck-mono);letter-spacing:.13em;text-transform:uppercase;color:var(--txt-2)}
.mthresh{font:500 9px var(--deck-mono);letter-spacing:.05em;color:var(--txt-3)}
.mplot{position:relative;min-width:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.032) 0 1px,transparent 1px 44px)}
.mplot svg{display:block;width:100%;height:96px}
.mstats{
  display:grid;grid-template-columns:repeat(4,1fr);
  border-left:1px solid var(--deck-rule);
}
.ms{
  padding:14px 10px;border-right:1px solid var(--deck-rule);
  display:flex;flex-direction:column;justify-content:center;gap:5px;text-align:right;
}
.ms:last-child{border-right:none}
.ms .k{font:600 8px var(--deck-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--txt-3)}
.ms .v{font:700 12.5px var(--deck-mono);color:var(--txt-2);letter-spacing:-.01em}
.mstrip.s-ok .v.now{color:var(--mint)}
.mstrip.s-warn .v.now{color:var(--amber-lit)}
.mstrip.s-bad .v.now{color:var(--red)}
.mstrip.s-bad{background:linear-gradient(90deg,rgba(255,59,48,.05),transparent 60%)}
.mstrip.s-bad .mname{color:var(--red)}
@media (max-width:1200px){
  .mstrip{grid-template-columns:1fr;}
  .mhead,.mstats{border-right:none;border-left:none;border-bottom:1px solid var(--deck-rule)}
}

/* ---------- Annunciator matrix (fleet) ---------- */
.annun{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:0 !important;border-top:0}
@media (max-width:1240px){.annun{grid-template-columns:repeat(2,1fr)}}
.ann{
  position:relative;padding:12px 14px;border-right:1px solid var(--deck-rule);border-bottom:1px solid var(--deck-rule);
  display:flex;align-items:center;gap:11px;min-width:0;
}
.annun .ann:nth-child(3n){border-right:none}
@media (max-width:1240px){.annun .ann:nth-child(3n){border-right:1px solid var(--deck-rule)}.annun .ann:nth-child(2n){border-right:none}}
.annun .ann:nth-last-child(-n+3){border-bottom:none}
.ann .lamp{width:11px;height:11px;flex:none;background:var(--txt-3);position:relative}
.ann .meta{min-width:0;flex:1;display:flex;flex-direction:column}

.ann .code{display:block;font:700 11px var(--deck-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ann .stat{display:block;font:600 8.5px var(--deck-mono);letter-spacing:.18em;text-transform:uppercase;margin-top:3px}
.ann .load{font:600 10px var(--deck-mono);color:var(--txt-3);flex:none;letter-spacing:.02em}
.ann.ok .lamp{background:var(--mint);box-shadow:0 0 8px 0 rgba(47,224,138,.5)}
.ann.ok .stat{color:var(--mint)}
.ann.bad{background:rgba(255,59,48,.055)}
.ann.bad .lamp{background:var(--red);box-shadow:0 0 10px 0 rgba(255,59,48,.75);animation:lampBlink 1.1s steps(1,end) infinite}
.ann.bad .stat{color:var(--red)}
.ann.bad .code{color:#ff8a83}
.ann.bad .load{color:var(--red)}

/* ---------- Ledger timeline ---------- */
.ledger{padding:0 !important;max-height:322px;overflow-y:auto}
.led{
  display:grid;grid-template-columns:74px 12px 1fr;align-items:baseline;gap:0;
  padding:7px 14px;border-bottom:1px solid var(--deck-rule);
  font:400 12px var(--sans);
}
.led:last-child{border-bottom:none}
.led .lt{font:600 10px var(--deck-mono);color:var(--txt-3);letter-spacing:.02em}
.led .lm{font:600 10px var(--deck-mono);color:var(--amber)}
.led .ld{color:var(--txt-2);line-height:1.5}
.led:first-child{background:var(--amber-dim)}
.led:first-child .ld{color:var(--txt)}
.led:first-child .lm{color:var(--amber-lit)}
.timeline-list{padding:0}
.timeline-list::before{display:none}
.tl-item{position:relative;padding:0}
.tl-item::before{display:none}

/* ---------- Data tables / rows across all sections ---------- */
table.k8s{width:100%;border-collapse:collapse;font:500 11.5px var(--deck-mono)}
table.k8s th{
  text-align:left;padding:7px 10px;border-bottom:1px solid var(--deck-rule2);
  font:600 8.5px var(--deck-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--txt-3);
}
table.k8s td{padding:7px 10px;border-bottom:1px solid var(--deck-rule);color:var(--txt-2)}
table.k8s tr:last-child td{border-bottom:none}
table.k8s td:first-child{color:var(--txt)}
.pod-status{font:600 10px var(--deck-mono);letter-spacing:.12em;text-transform:uppercase}
.pod-status .d{width:8px;height:8px;border-radius:0}
.pod-status.run{color:var(--mint)}.pod-status.run .d{background:var(--mint)}
.pod-status.restart{color:var(--amber-lit)}.pod-status.restart .d{background:var(--amber)}
.pod-status.crash{color:var(--red)}.pod-status.crash .d{background:var(--red);animation:lampBlink 1.1s steps(1,end) infinite}

.logbox{
  background:#060608;border:1px solid var(--deck-rule);font-family:var(--deck-mono);
  font-size:11.5px;line-height:1.6;padding:6px 0;max-height:520px;overflow-y:auto;
}
.logline{
  display:grid;grid-template-columns:66px 48px 132px 1fr;gap:12px;
  padding:2.5px 14px;white-space:pre-wrap;word-break:break-word;
}
.logline .ts{color:var(--txt-3)}
.logline .lvl{width:auto;letter-spacing:.1em;font-weight:700}
.logline .svc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logline.INFO .lvl{color:var(--ice)}
.logline.WARN .lvl{color:var(--amber)}
.logline.ERROR .lvl{color:var(--red)}
.logline.ERROR{background:rgba(255,59,48,.05)}
.logline .svc{color:var(--amber-lit)}
.logline .msg{color:var(--txt-2)}

.trace-row{grid-template-columns:170px 1fr 78px;padding:9px 0;border-bottom:1px solid var(--deck-rule)}
.trace-svc{font:600 10.5px var(--deck-mono);letter-spacing:.06em;color:var(--txt-2)}
.trace-bar-track{height:14px;background:#111217;border:1px solid var(--deck-rule);border-radius:0}
.trace-bar{border-radius:0;background:var(--ice)}
.trace-bar.slow{background:repeating-linear-gradient(45deg,var(--red) 0 5px,#c22a21 5px 10px)}
.trace-dur{font:700 10.5px var(--deck-mono);color:var(--txt-2)}
.trace-dur.slow{color:var(--red)}

.pool-bar-track{height:26px;background:#111217;border:1px solid var(--deck-rule);border-radius:0;position:relative}
.pool-bar{
  border-radius:0;
  background:repeating-linear-gradient(90deg,var(--mint) 0 7px,transparent 7px 10px);
}
.pool-bar.crit{background:repeating-linear-gradient(90deg,var(--red) 0 7px,transparent 7px 10px)}
.gaugewrap .num{font:800 26px var(--deck-mono);letter-spacing:-.02em}
.gaugewrap .cap{font:500 10px var(--deck-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--txt-3);line-height:1.7}

.dep-row{padding:12px 0;border-bottom:1px solid var(--deck-rule);gap:12px}
.dep-dot{width:8px;height:8px;border-radius:0;background:var(--deck-rule2);margin-top:4px}
.dep-row.flagged{background:linear-gradient(90deg,rgba(255,59,48,.055),transparent 50%)}
.dep-row.flagged .dep-dot{background:var(--red);animation:lampBlink 1.1s steps(1,end) infinite}
.dep-row .ver{font:700 12px var(--deck-mono);letter-spacing:.04em;color:var(--txt)}
.dep-row .flag{font:700 8.5px var(--deck-mono);letter-spacing:.14em;background:var(--red);color:#150202;padding:2px 6px;border-radius:0}
.dep-row .sub{font:400 11.5px var(--sans);color:var(--txt-3);margin-top:4px;line-height:1.5}
.rollback-btn{
  margin-top:9px;font:700 9.5px var(--deck-mono);letter-spacing:.16em;text-transform:uppercase;
  background:transparent;border:1px solid var(--amber);color:var(--amber-lit);padding:6px 12px;border-radius:0;cursor:pointer;
}
.rollback-btn:hover{background:var(--amber);color:#150e02}

.gh-card{background:var(--deck-plate2);border:1px solid var(--deck-rule);border-radius:0;padding:13px 15px}
.gh-card .title{font:600 12.5px var(--sans);color:var(--txt)}
.gh-card .meta{font:500 10px var(--deck-mono);color:var(--txt-3);letter-spacing:.04em;margin:6px 0 10px}
.gh-diff{font:700 10.5px var(--deck-mono);letter-spacing:.06em}
.gh-diff .add{color:var(--mint)}.gh-diff .del{color:var(--red)}

.sess-row{padding:9px 0;border-bottom:1px solid var(--deck-rule);font-family:var(--deck-mono);font-size:11px}
.sess-row .sid{color:var(--amber);width:96px}
.sess-row .txt{color:var(--txt-2);font-family:var(--sans);font-size:12px}
.sess-row .badge{border-radius:0;font:700 8.5px var(--deck-mono);letter-spacing:.14em;padding:3px 7px}
.sess-row .badge.fail{background:var(--red);color:#150202}
.sess-row .badge.ok{background:var(--mint);color:#052414}
.sess-row .ts{color:var(--txt-3);font-size:10px}

.checklist-item{padding:8px 0;border-bottom:1px solid var(--deck-rule);font:500 11.5px var(--deck-mono);letter-spacing:.04em;color:var(--txt-3)}
.checklist-item:last-child{border-bottom:none}
.checklist-item .ck{width:15px;height:15px;border-radius:0;border:1px solid var(--deck-rule2);background:transparent}
.checklist-item.done{color:var(--txt)}
.checklist-item.done .ck{background:var(--mint);border-color:var(--mint)}

.evi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:0;padding:0 !important}
.evi-card{
  background:transparent;border:none;border-radius:0;padding:12px 14px;
  border-right:1px solid var(--deck-rule);border-bottom:1px solid var(--deck-rule);
}
.evi-card:last-child{border-right:none}
.evi-card .k{font:600 8.5px var(--deck-mono);letter-spacing:.18em;color:var(--txt-3)}
.evi-card .v{font:700 13px var(--deck-mono);color:var(--amber-lit);margin:5px 0 4px;letter-spacing:-.01em}
.evi-card .s{font:400 11px var(--sans);color:var(--txt-3);line-height:1.5}

.remstep{padding:11px 0;border-bottom:1px solid var(--deck-rule);gap:12px}
.remstep .n{
  width:20px;height:20px;border-radius:0;background:transparent;border:1px solid var(--deck-rule2);
  font:700 9.5px var(--deck-mono);color:var(--txt-3);
}
.remstep.active .n{border-color:var(--amber);color:var(--amber)}
.remstep.done .n{background:var(--mint);border-color:var(--mint);color:#052414}
.remstep .txt{font:500 12px var(--deck-mono);letter-spacing:.02em;color:var(--txt-3)}
.remstep.done .txt{color:var(--txt)}
.remstep .ts{font:600 9.5px var(--deck-mono);color:var(--txt-3);letter-spacing:.04em}
.authbtn{
  width:100%;margin-top:14px;padding:14px;border:1px solid var(--amber);border-radius:0;
  background:var(--amber);color:#150e02;
  font:800 11px var(--deck-mono);letter-spacing:.22em;text-transform:uppercase;cursor:pointer;
  transition:background .12s linear,color .12s linear;
}
.authbtn:not(:disabled):hover{background:var(--amber-lit);border-color:var(--amber-lit)}
.authbtn:disabled{background:transparent;border-color:var(--deck-rule2);color:var(--txt-3);cursor:default}

.report-field{grid-template-columns:180px 1fr;gap:16px;padding:10px 0;border-bottom:1px solid var(--deck-rule)}
.report-field .k{font:600 8.5px var(--deck-mono);letter-spacing:.18em;color:var(--txt-3)}
.report-field .v{font:400 12.5px var(--sans);color:var(--txt-2);line-height:1.6}

.empty-console{
  padding:44px 20px;color:var(--txt-3);
  font:500 10.5px var(--deck-mono);letter-spacing:.16em;text-transform:uppercase;
}
.chartcard{background:var(--deck-plate2);border:1px solid var(--deck-rule);border-radius:0;padding:12px 14px}
.chartcard .top .t{font:600 9px var(--deck-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--txt-3)}
.chartcard .top .v{font:700 17px var(--deck-mono);letter-spacing:-.02em}
.conf-ring{display:none}


.confmeter{display:flex;align-items:center;gap:11px;margin-top:5px}
.cbar{display:flex;gap:2px}
.cbar span{width:5px;height:16px;background:var(--deck-rule2)}
.cbar span.on{background:var(--amber)}
.cnum{font:800 15px var(--deck-mono);color:var(--amber-lit);letter-spacing:-.02em}
.cnum small{font-size:10px;font-weight:600;margin-left:1px}

/* ---------- Service map ---------- */
.svcmap{width:100%;height:auto;display:block}
.svcnode-label{font-family:var(--deck-mono);font-size:9.5px;font-weight:700;letter-spacing:.12em;fill:var(--txt)}
.svcnode-sub{font-family:var(--deck-mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase}
.edge-live{animation:edgeFlow 1s linear infinite}
@keyframes edgeFlow{to{stroke-dashoffset:-14}}



/* ---------- Trace waterfall ---------- */
.waterfall{padding:0 !important}
.wrow{display:grid;grid-template-columns:270px 1fr 74px;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--deck-rule)}
.wlab{display:flex;align-items:baseline;gap:8px;min-width:0}
.wtick{width:8px;height:1px;background:var(--deck-rule2);flex:none;position:relative;top:-3px}
.wsvc{font:600 10.5px var(--deck-mono);letter-spacing:.05em;color:var(--txt-2);white-space:nowrap}
.wop{font:400 10px var(--deck-mono);color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtrack{position:relative;height:14px;background:#111217;border:1px solid var(--deck-rule)}
.wbar{position:absolute;top:0;bottom:0;background:var(--ice);transition:left .4s ease,width .4s ease}
.wrow.slow .wbar{background:repeating-linear-gradient(45deg,var(--red) 0 5px,#b8261e 5px 10px)}
.wrow.slow .wsvc{color:var(--red)}
.wdur{font:700 10.5px var(--deck-mono);text-align:right;color:var(--txt-2)}
.wrow.slow .wdur{color:var(--red)}
.waxis{display:grid;grid-template-columns:270px 1fr 74px;gap:12px;padding:6px 14px;background:var(--deck-plate2);border-top:1px solid var(--deck-rule)}
.wticks{display:flex;justify-content:space-between;font:500 8.5px var(--deck-mono);letter-spacing:.06em;color:var(--txt-3)}
@media (max-width:1000px){.wrow,.waxis{grid-template-columns:150px 1fr 62px}}

/* ---------- Layout primitives shared by every section ---------- */
.remstep{display:flex;align-items:flex-start;gap:12px}
.remstep .n{flex:none;display:flex;align-items:center;justify-content:center}
.remstep .txt{flex:1;min-width:0;padding-top:2px}
.remstep .ts{margin-left:auto;flex:none;padding-top:3px}

.checklist-item{display:flex;align-items:center;gap:11px}
.checklist-item .ck{flex:none;display:flex;align-items:center;justify-content:center}
.checklist-item .ck svg{display:none;width:10px;height:10px;stroke:#052414;stroke-width:3.5}
.checklist-item.done .ck svg{display:block}

.dep-row{display:flex;align-items:flex-start}
.dep-row .body{flex:1;min-width:0}

.sess-row{display:flex;align-items:center;gap:12px}
.sess-row .sid{flex:none}
.sess-row .txt{flex:1;min-width:0}
.sess-row .badge,.sess-row .ts{flex:none}

.trace-row{display:grid;align-items:center;gap:12px}
.trace-bar-track{position:relative;overflow:hidden}
.trace-bar{height:100%;transition:width .45s ease}
.trace-dur{text-align:right}

.pod-status{display:inline-flex;align-items:center;gap:7px}
.pod-status .d{flex:none}

.gaugewrap{display:flex;align-items:center;gap:18px}
.pool-bar-track{overflow:hidden}
.pool-bar{height:100%;transition:width .5s linear}

.report-field{display:grid}
.report-field .v{min-width:0}

/* ---------- Scrollbars ---------- */
.ledger::-webkit-scrollbar,.logbox::-webkit-scrollbar{width:9px}
.ledger::-webkit-scrollbar-track,.logbox::-webkit-scrollbar-track{background:var(--deck-plate)}
.ledger::-webkit-scrollbar-thumb,.logbox::-webkit-scrollbar-thumb{background:var(--deck-rule2)}

@media (prefers-reduced-motion: reduce){
  .deck-lamp.red,.ann.bad .lamp,.navitem .nbadge:not(.ok),
  .pod-status.crash .d,.dep-row.flagged .dep-dot,.lstep.active .lbar::after,
  .edge-live{animation:none}
  .lstep.active .lbar::after{transform:scaleX(1)}
}
@media (max-width:1000px){
  .rops-side{width:172px}
  .deck-strip{flex-wrap:wrap}
  .strip{grid-template-columns:130px 1fr 78px}
  .strip-axis{grid-template-columns:130px 1fr 78px}
}

@media (prefers-reduced-motion: reduce){
  .mer-alert{animation:none}
  .status-pill.bad{animation:none}
  .pod-status.crash .d{animation:none}
}

<body>
<div class="simbar">
  <div class="simbar-tag"><span class="dot"></span>LIVE SIMULATION</div>
  <div class="envswitch" id="envSwitch">
    <button class="envbtn active" data-env="store"><span class="b" style="background:var(--mer-accent)"></span>meridian.com — Storefront</button>
    <button class="envbtn" data-env="rops"><span class="b" style="background:var(--accent)"></span>RemOpsAI Console</button>
  </div>
  <div class="simbar-spacer"></div>
  <div class="status-pill" id="statusPill"><span class="pdot"></span><span id="statusPillText">All systems healthy</span></div>
  <button class="btn btn-auto" id="autoplayToggle">⏸ Pause Autoplay</button>
  <button class="btn btn-auto" id="replayBtn">⟲ Replay</button>
  <button class="btn btn-ghost" id="resetBtn">Reset Demo</button>
</div>

<div class="viewport">
  <div class="env active" id="env-store"></div>
  <div class="env" id="env-rops"></div>
</div>

<div class="mer-toast" id="toast"></div>
<div class="sim-cursor" id="simCursor"></div>
<div class="sim-caption" id="simCaption"></div>

<script>
(function(){
"use strict";

/* ============================================================
   SHARED UTILS
   ============================================================ */
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const now=()=>new Date();
const fmtTime=(d)=>d.toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
const fmtMs=(ms)=> ms>=1000 ? (ms/1000).toFixed(2)+'s' : Math.round(ms)+'ms';
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function svgPoints(hist,w,h,min,max){
  if(hist.length<2) return '';
  const n=hist.length;
  return hist.map((v,i)=>{
    const x=(i/(n-1))*w;
    const y=h-((clamp(v,min,max)-min)/(max-min||1))*h;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
}

/* ============================================================
   GLOBAL STATE
   ============================================================ */
const PHASES=['normal','incident','detecting','investigating','rootcause','remediation_ready','remediating','resolved'];
const BROKEN_PHASES=new Set(['incident','detecting','investigating','rootcause','remediation_ready','remediating']);

const state = {
  phase:'normal',
  timers:[],
  heartbeat:null,
  incident:null, // {id, severity, detectedAt, resolvedAt}
  timeline:[],
  evidence:[],
  confidence:0,
  investigation:{connected:[], traced:[]},
  remediationSteps:[
    {key:'rollback', label:'Rollback checkout-service deployment', done:false, ts:null},
    {key:'drain', label:'Drain unhealthy checkout pods', done:false, ts:null},
    {key:'dbrecover', label:'Verify PostgreSQL connection pool recovery', done:false, ts:null},
    {key:'latency', label:'Checkout latency recovering', done:false, ts:null},
    {key:'errorfall', label:'HTTP 500 rate falling', done:false, ts:null},
    {key:'orders', label:'Confirm successful customer orders', done:false, ts:null},
  ],
  authorized:false,
  logs:[],
  pods:[
    {name:'checkout-service-7f9d4c-2k9x', restarts:0, status:'run'},
    {name:'checkout-service-7f9d4c-x81m', restarts:0, status:'run'},
    {name:'checkout-service-7f9d4c-qw3v', restarts:0, status:'run'},
    {name:'checkout-service-7f9d4c-h6bp', restarts:0, status:'run'},
    {name:'checkout-service-7f9d4c-n0lz', restarts:0, status:'run'},
    {name:'checkout-service-7f9d4c-t4ry', restarts:0, status:'run'},
  ],
  sessions:[],
  failedCheckoutAttempts:0,
  orderConfirmed:false,
  orderConfirmedAt:null,
  metrics:{
    errorRate:{cur:0.15, hist:[], min:0, max:45, unit:'%', label:'Checkout Error Rate'},
    p95:{cur:230, hist:[], min:0, max:5200, unit:'ms', label:'Checkout API p95 Latency'},
    dbPool:{cur:41, hist:[], min:0, max:100, unit:'%', label:'DB Connection Pool'},
    payTimeout:{cur:0.1, hist:[], min:0, max:35, unit:'%', label:'Payment Timeout Rate'},
    orders:{cur:812, hist:[], min:0, max:2000, unit:'', label:'Successful Orders (5m)'},
  },
};

function targetsFor(phase){
  if(phase==='normal' || phase==='resolved'){
    return {errorRate:0.15, p95:230, dbPool:41, payTimeout:0.1};
  }
  return {errorRate:38.7, p95:4800, dbPool:100, payTimeout:29.4};
}

/* ============================================================
   LOGGING / EVENTS
   ============================================================ */
function pushLog(level, svc, msg, tsDate){
  const e={ts:fmtTime(tsDate||now()), level, svc, msg};
  state.logs.push(e);
  if(state.logs.length>240) state.logs.shift();
  if(state.rops.activeSection==='logs') renderLogsAppend(e);
}
function pushTimeline(text){
  state.timeline.push({t:fmtTime(now()), d:text});
  if(state.rops.activeSection==='investigation' || state.rops.activeSection==='command') renderActiveConsole();
}
function pushSession(text, ok){
  state.sessions.unshift({sid:'#'+(8800+Math.floor(Math.random()*90)), t:text, ok, ts:fmtTime(now())});
  if(state.sessions.length>30) state.sessions.pop();
  if(state.rops.activeSection==='sessions') renderActiveConsole();
}

/* ============================================================
   PHASE / INCIDENT ENGINE
   ============================================================ */
function schedule(fn, ms){
  const id=setTimeout(fn, ms);
  state.timers.push(id);
  return id;
}
function clearTimers(){ state.timers.forEach(id=>clearTimeout(id)); state.timers=[]; }

function setPhase(p){
  state.phase=p;
  updateStatusPill();
  renderActiveConsole();
  renderStoreCheckoutIfVisible();
  updateTriggerBtn();
}

function startIncident(){
  if(state.phase!=='normal') return;
  state.incident={ id:'INC-'+(2100+Math.floor(Math.random()*800)), severity:'P1', detectedAt:null, resolvedAt:null };
  state.timeline=[]; state.evidence=[]; state.confidence=0; state.authorized=false;
  state.investigation={connected:[], traced:[]};
  state.remediationSteps.forEach(s=>{s.done=false; s.ts=null;});
  state.failedCheckoutAttempts=0;

  setPhase('incident');
  pushLog('WARN','checkout-service','p99 latency exceeded 2000ms threshold on /v1/checkout/place-order');
  pushLog('ERROR','order-service','context deadline exceeded calling payment-service');
  flipPod(2,'restart');

  schedule(()=>{
    pushLog('ERROR','payment-service','upstream timeout after 5000ms (gateway: authnet-prod)');
    pushLog('WARN','postgres-primary','connection wait time p95 = 1840ms');
    pushTimeline('Checkout error rate begins increasing (0.2% → rising)');
  },900);

  schedule(()=>{
    flipPod(0,'restart');
    pushLog('ERROR','order-service','could not acquire db connection: pool exhausted (120/120 in use)');
    pushTimeline('Payment API p95 latency increases (240ms → 4.8s)');
  },2600);

  schedule(()=>{
    pushTimeline('PostgreSQL connection pool reaches saturation (100% utilized)');
    flipPod(4,'crash');
  },4200);

  schedule(()=>{
    state.incident.detectedAt=now();
    setPhase('detecting');
    pushTimeline('Checkout failures cross critical threshold — auto-detected by RemOps');
    pushLog('ERROR','remops-detector','anomaly correlation triggered: checkout.error_rate + db.pool_utilization + payment.timeout_rate');
  },5600);

  schedule(()=>{
    pushTimeline('Customer session telemetry shows repeated order failures');
  },6600);

  schedule(()=> startInvestigation(), 7600);
}

function flipPod(idx,status){
  const p=state.pods[idx];
  if(!p) return;
  p.status=status;
  if(status!=='run') p.restarts++;
  if(state.rops.activeSection==='k8s') renderActiveConsole();
}
function healPods(){
  state.pods.forEach((p,i)=>{
    schedule(()=>{ p.status='run'; if(state.rops.activeSection==='k8s') renderActiveConsole(); }, 400*i+200);
  });
}

const SIGNAL_SOURCES=['Customer Sessions','Application Logs','Metrics','Distributed Traces','Kubernetes','Database','Deployments','GitHub'];

function startInvestigation(){
  setPhase('investigating');
  SIGNAL_SOURCES.forEach((s,i)=>{
    schedule(()=>{
      state.investigation.connected.push(s);
      if(state.rops.activeSection==='investigation') renderActiveConsole();
    }, 300*i);
  });
  const TRACE_HOPS=['Customer Session','Checkout API','Order Service','Payment Service','PostgreSQL','DB Connection Pool'];
  schedule(()=>{
    TRACE_HOPS.forEach((h,i)=>{
      schedule(()=>{
        state.investigation.traced.push(h);
        if(state.rops.activeSection==='investigation'||state.rops.activeSection==='servicemap') renderActiveConsole();
      }, 420*i);
    });
  }, 2600);

  const EVIDENCE=[
    {k:'Recent Deployment', v:'checkout-service', s:'8 minutes ago · v2.114.0 · commit a13f9c2 · deployed by j.romero'},
    {k:'Database Connections', v:'42% → 100%', s:'PostgreSQL primary pool saturated shortly after deploy'},
    {k:'Error Pattern', v:'connection pool exhausted', s:'1,842 occurrences across 6 checkout-service pods'},
    {k:'Trace', v:'checkout → order → payment → postgres', s:'db.connection.acquire span: 240ms → 4.8s (p95)'},
  ];
  schedule(()=>{
    EVIDENCE.forEach((e,i)=>{
      schedule(()=>{
        state.evidence.push(e);
        if(state.rops.activeSection==='investigation') renderActiveConsole();
      }, 550*i);
    });
  }, 5600);

  schedule(()=> setPhase('rootcause'), 8200);
  schedule(()=>{
    animateConfidence(96);
    pushTimeline('Root cause identified — checkout-service deployment linked to connection pool exhaustion');
  }, 8400);

  schedule(()=>{
    setPhase('remediation_ready');
    pushTimeline('Remediation plan generated — awaiting authorization');
  }, 10600);
}

function animateConfidence(target){
  let v=0;
  const step=()=>{
    v=Math.min(target, v+Math.ceil((target-v)*0.22)+3);
    state.confidence=v;
    if(state.rops.activeSection==='investigation') renderActiveConsole();
    if(v<target) schedule(step,60);
  };
  step();
}

function authorizeRemediation(){
  if(state.phase!=='remediation_ready') return;
  state.authorized=true;
  setPhase('remediating');
  pushLog('INFO','remops-executor','remediation authorized — starting rollback of checkout-service');

  const steps=state.remediationSteps;
  const offsets=[900,2400,4000,5600,7200,8800];
  const logs=[
    ['INFO','deploy-controller','checkout-service rolled back: v2.114.0 → v2.113.2'],
    ['INFO','k8s-controller','draining 6 unhealthy checkout-service pods, replacing with v2.113.2'],
    ['INFO','postgres-primary','connection pool utilization falling: 100% → 63%'],
    ['INFO','checkout-service','p95 latency recovering: 4.8s → 890ms'],
    ['INFO','remops-monitor','HTTP 500 rate falling: 38.7% → 4.2%'],
    ['INFO','order-service','successful order rate returning to baseline'],
  ];
  steps.forEach((st,i)=>{
    schedule(()=>{
      st.done=true; st.ts=fmtTime(now());
      pushLog(logs[i][0],logs[i][1],logs[i][2]);
      if(i===1) healPods();
      if(state.rops.activeSection==='remediation'||state.rops.activeSection==='command') renderActiveConsole();
    }, offsets[i]);
  });

  schedule(()=>{
    state.incident.resolvedAt=now();
    setPhase('resolved');
    pushTimeline('Incident resolved — checkout error rate and DB pool utilization back to baseline');
  }, 10200);
}

/* ============================================================
   METRICS HEARTBEAT
   ============================================================ */
function heartbeatTick(){
  const targets=targetsFor(state.phase);
  const m=state.metrics;
  const rate = state.phase==='remediating' ? 0.30 : 0.22;

  m.errorRate.cur = clamp(lerp(m.errorRate.cur, targets.errorRate, rate) + rnd(-0.6,0.6), 0, 45);
  m.p95.cur = clamp(lerp(m.p95.cur, targets.p95, rate) + rnd(-40,40), 150, 5200);
  m.dbPool.cur = clamp(lerp(m.dbPool.cur, targets.dbPool, rate) + rnd(-1.5,1.5), 0, 100);
  m.payTimeout.cur = clamp(lerp(m.payTimeout.cur, targets.payTimeout, rate) + rnd(-0.4,0.4), 0, 35);

  const healthy = state.phase==='normal' || state.phase==='resolved';
  m.orders.cur = clamp(m.orders.cur + (healthy ? (Math.random()<0.5? rnd(0.5,3):0) : (Math.random()<0.08? 1:0)), 0, 2000);

  Object.values(m).forEach(mm=>{
    mm.hist.push(mm.cur);
    if(mm.hist.length>36) mm.hist.shift();
  });

  renderKpisLive();
  if(state.rops.activeSection==='metrics') renderMetricsLive();
  if(state.rops.activeSection==='database') renderDbLive();
  updateStatusPillSpark();
}

function ambientTick(){
  if(state.phase==='normal' || state.phase==='resolved'){
    const svcs=['api-gateway','checkout-service','inventory-service','search-service','order-service'];
    const msgs=['request handled','health check ok','cache hit ratio 94.2%','GET /v1/products 200 OK','scaling check: nominal'];
    pushLog('INFO', svcs[Math.floor(Math.random()*svcs.length)], msgs[Math.floor(Math.random()*msgs.length)]);
  }
}

/* ============================================================
   STATUS PILL / TRIGGER BUTTON
   ============================================================ */
function updateStatusPill(){
  const el=$('#statusPill'), txt=$('#statusPillText');
  el.className='status-pill';
  const map={
    normal:['All systems healthy',''],
    incident:['Checkout degrading','bad'],
    detecting:['P1 incident detected','bad'],
    investigating:['RemOps investigating','bad'],
    rootcause:['Root cause identified','warn'],
    remediation_ready:['Awaiting authorization','warn'],
    remediating:['Remediation in progress','recovering'],
    resolved:['Incident resolved · healthy','']
  };
  const [t,cls]=map[state.phase];
  if(cls) el.classList.add(cls);
  txt.textContent=t;
}
function updateStatusPillSpark(){}
function updateTriggerBtn(){}

/* ============================================================
   RESET
   ============================================================ */
function resetDemo(){
  stopAutoplayScript();
  clearTimers();
  state.phase='normal';
  state.incident=null;
  state.timeline=[]; state.evidence=[]; state.confidence=0; state.authorized=false;
  state.investigation={connected:[], traced:[]};
  state.remediationSteps.forEach(s=>{s.done=false; s.ts=null;});
  state.failedCheckoutAttempts=0;
  state.orderConfirmed=false; state.orderConfirmedAt=null;
  state.sessions=[]; state.logs=[];
  state.pods.forEach(p=>{p.restarts=0; p.status='run';});
  state.metrics.errorRate.cur=0.15; state.metrics.p95.cur=230; state.metrics.dbPool.cur=41; state.metrics.payTimeout.cur=0.1;
  Object.values(state.metrics).forEach(m=>m.hist=[]);
  store.view='home'; store.selectedProduct=null; store.cart=[];
  updateStatusPill(); updateTriggerBtn();
  renderStore(); renderActiveConsole();
}

/* ============================================================
   MERIDIAN STOREFRONT
   ============================================================ */
const PRODUCTS=[
  {id:'p1', name:'AeroTrail Running Jacket', price:128, was:null, rating:4.7, revs:2384, emoji:'🧥', cat:'Apparel'},

const store = { view:'home', query:'', selectedProduct:null, size:'M', color:'Storm Grey', img:0, qty:1, cart:[] };

function money(n){ return '$'+n.toFixed(2); }
function cartCount(){ return store.cart.reduce((n,i)=>n+i.qty,0); }
function cartSubtotal(){ return store.cart.reduce((n,i)=>n+i.qty*i.price,0); }

  const t=$('#toast'); t.innerHTML=msg; t.classList.add('show');
  clearTimeout(toast._id); toast._id=setTimeout(()=>t.classList.remove('show'),2200);

    <div class="mer-body" id="merBody"></div>

  if(addBtn) addBtn.addEventListener('click', ()=>{

    const existing=store.cart.find(i=>i.id===p.id && i.size===store.size && i.color===store.color);
    if(existing) existing.qty+=store.qty;
    else store.cart.push({id:p.id,name:p.name,price:p.price,emoji:p.emoji,size:store.size,color:store.color,qty:store.qty});

  });

  if(placeBtn) placeBtn.addEventListener('click', handlePlaceOrder);

  if(store.view==='checkout') renderStoreBody();
}

function handlePlaceOrder(){
  if(state.phase==='normal') startIncident();
  const btn=$('#placeOrderBtn');
  if(!btn || btn.disabled) return;
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> Processing payment…';
  const broken = BROKEN_PHASES.has(state.phase);
  setTimeout(()=>{
    if(broken){
      state.failedCheckoutAttempts++;
      pushSession('order attempt failed — HTTP 500 (checkout_failed)', false);
      pushLog('ERROR','checkout-api','POST /v1/checkout/place-order → 500 (upstream: payment-service timeout)');
      renderStoreBody();
    } else {
      store.lastOrderItems = store.cart.map(i=>({...i}));
      store.lastOrderTotals = checkoutTotals();
      store.cart=[];
      state.orderConfirmed=true; state.orderConfirmedAt=now();
      pushSession('order placed successfully — #4829137', true);
      pushLog('INFO','order-service','order #4829137 confirmed and queued for fulfillment');
      store.view='confirm';
      renderStore();
    }
  }, 950);
}

function elapsedStr(){
  const inc=state.incident;
  if(!inc || !inc.detectedAt) return '--:--';
  const end = inc.resolvedAt || now();
  const secs=Math.max(0,Math.floor((end-inc.detectedAt)/1000));
  return String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');
}

    <div class="cell clock"><span class="k">${inc&&inc.resolvedAt?'Time to resolve':'Elapsed'}</span><span class="v ${inc&&!inc.resolvedAt?'red':'mint'}" data-deck-clock>${elapsedStr()}</span></div>
    <div class="cell"><span class="k">Error rate</span><span class="v ${errCls}" data-deck-err>${state.metrics.errorRate.cur.toFixed(1)}%</span></div>
  </div><!--DECKCUT-->`;

  $$('.panel-h h2', el).forEach((h,i)=>h.setAttribute('data-n', String(i+1).padStart(2,'0')));

function ladderIndex(){
  const p=state.phase;
  if(p==='normal') return -1;
  if(p==='resolved') return LADDER.length; // every checkpoint cleared
  for(let i=0;i<LADDER.length;i++) if(LADDER[i].phases.includes(p)) return i;

}

/* Scale each strip to its own recent range (with headroom for the alarm
   line) instead of a fixed 0..max — a flat baseline still shows its shape. */
function stripDomain(m,cfg){
  const h=m.hist.length?m.hist:[m.cur];
  let hi=Math.max(...h, m.cur);
  if(cfg.thresh!=null) hi=Math.max(hi, cfg.thresh*1.15);
  let lo=Math.min(...h, m.cur);
  const pad=(hi-lo)*0.28 || Math.max(hi*0.25, 1);
  return {lo:Math.max(0,lo-pad), hi:hi+pad};
}
function stripSvg(m,cfg,H){
  const W=400; H=H||52;
  const dom=stripDomain(m,cfg);
  const pts=svgPoints(m.hist,W,H,dom.lo,dom.hi);
  if(!pts) return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"></svg>`;
  const bad = cfg.thresh!=null && m.cur>=cfg.thresh;
  const warn = cfg.thresh!=null && m.cur>=cfg.thresh*0.55;
  const col = bad?'var(--red)':warn?'var(--amber)':'var(--mint)';
  const tyRaw = cfg.thresh!=null ? H-((cfg.thresh-dom.lo)/((dom.hi-dom.lo)||1))*H : null;
  const ty = (tyRaw!=null && tyRaw>=0 && tyRaw<=H) ? tyRaw.toFixed(1) : null;
  const last=pts.split(' ').slice(-1)[0].split(',');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${ty!=null?`<line class="strip-thresh" x1="0" y1="${ty}" x2="${W}" y2="${ty}"/>`:''}
    <polygon data-sfill points="0,${H} ${pts} ${W},${H}" fill="${col}" opacity=".10"/>
    <polyline data-sline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    <line data-scursor x1="${last[0]}" y1="0" x2="${last[0]}" y2="${H}" stroke="${col}" stroke-width="1" opacity=".45" vector-effect="non-scaling-stroke"/>
    <rect data-shead x="${(parseFloat(last[0])-1.6).toFixed(1)}" y="${(parseFloat(last[1])-1.6).toFixed(1)}" width="3.2" height="3.2" fill="${col}"/>
  </svg>`;
}
function stripDelta(m){
  if(m.hist.length<9) return '';
  const a=m.hist[m.hist.length-9], b=m.hist[m.hist.length-1];
  if(!a) return '';
  const d=((b-a)/a)*100;
  if(Math.abs(d)<2) return `<span class="d">flat</span>`;
  const n=Math.abs(d)>=1000?'>999':Math.round(Math.abs(d));
  return `<span class="d ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${n}%</span>`;
}
function stripWallHtml(){
  const m=state.metrics;
  const rows = STRIPS.map(cfg=>{
    const mm=m[cfg.k];
    const bad = cfg.thresh!=null && mm.cur>=cfg.thresh;
    const warn = cfg.thresh!=null && mm.cur>=cfg.thresh*0.55;
    return `<div class="strip s-${bad?'bad':warn?'warn':'ok'}" data-strip="${cfg.k}">
      <div class="sid">
        <span class="nm">${cfg.nm}</span>
        <span class="th">${cfg.thresh!=null?'alarm ≥ '+cfg.fmt(cfg.thresh):'no alarm'}</span>
      </div>
      <div class="plot">${stripSvg(mm,cfg)}</div>
      <div class="val"><span class="n" data-sval>${cfg.fmt(mm.cur)}</span>${stripDelta(mm)}</div>
    </div>`;
  }).join('');
  return rows + `<div class="strip-axis">
    <div class="lead">Time</div>
    <div class="ticks"><span>−60s</span><span>−45s</span><span>−30s</span><span>−15s</span><span>now</span></div>
    <div class="tail"></div>
  </div>`;
}

/* Cockpit-style caution/warning panel: one lamp per service. */
function annunHtml(){
  const broken=BROKEN_PHASES.has(state.phase);
  const mid=['incident','detecting','investigating','rootcause','remediation_ready'].includes(state.phase);
  const infra=['investigating','rootcause','remediation_ready'].includes(state.phase);
  const services=[
    ['CHECKOUT', broken],
    ['PAYMENTS', mid],
    ['INVENTORY', false],
    ['SEARCH', false],
    ['ORDERS', broken],
    ['INFRA', infra],
  ];
  return services.map(([name,bad])=>{
    let h=0; const seed=name+state.phase;
    for(let i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))>>>0;
    const load = bad ? 82+(h%18) : 8+(h%34);
    return `<div class="ann ${bad?'bad':'ok'}">
      <span class="lamp"></span>
      <span class="meta"><span class="code">${name}</span><span class="stat">${bad?'Degraded':'Nominal'}</span></span>
      <span class="load">${String(load).padStart(2,'0')}%</span>
    </div>`;
  }).join('');
}

const MAP_NODES=[
  {id:'Customer Session', x:40, y:130, w:172},
  {id:'Checkout API', x:262, y:60, w:158},
  {id:'Order Service', x:470, y:130, w:158},
  {id:'Payment Service', x:648, y:60, w:164},
  {id:'PostgreSQL', x:470, y:220, w:158},
  {id:'DB Connection Pool', x:648, y:220, w:164},
];
const MAP_EDGES=[['Customer Session','Checkout API'],['Checkout API','Order Service'],['Order Service','Payment Service'],['Order Service','PostgreSQL'],['PostgreSQL','DB Connection Pool']];
function nodeState(name){
  const traced=state.investigation.traced.includes(name);
  const broken = BROKEN_PHASES.has(state.phase);
  const badNodes=['Checkout API','Order Service','Payment Service','PostgreSQL','DB Connection Pool'];
  if(!broken) return {color:'var(--mint)', label:'Nominal'};
  if(state.phase==='remediating' || state.phase==='resolved') return {color:'var(--mint)', label:'Recovering'};
  if(name==='DB Connection Pool' && (state.phase==='rootcause'||state.phase==='remediation_ready')) return {color:'var(--red)', label:'Saturated · root cause'};
  if(traced) return {color:'var(--amber)', label:badNodes.includes(name)?'Degraded':'Traced'};
  if(badNodes.includes(name)) return {color:'var(--red)', label:'Degraded'};
  return {color:'var(--mint)', label:'Nominal'};
}
function serviceMapSvg(){
  const edges=MAP_EDGES.map(([a,b])=>{
    const A=MAP_NODES.find(n=>n.id===a), B=MAP_NODES.find(n=>n.id===b);
    const traced = state.investigation.traced.includes(a) && state.investigation.traced.includes(b);
    // Orthogonal routing reads like a real topology diagram, not a spline.
    // Stacked nodes get a vertical drop; the rest get a right-angle elbow.
    const overlap = A.x < B.x+B.w && B.x < A.x+A.w;
    let d;
    if(overlap){
      const cx=Math.round(A.x+Math.min(A.w,B.w)/2);
      d = B.y>A.y ? `M${cx},${A.y+40} V${B.y-7}` : `M${cx},${A.y} V${B.y+47}`;
    } else {
      const x1=A.x+A.w, y1=A.y+20, x2=B.x-7, y2=B.y+20;
      const mx=Math.round(x1+(x2-x1)/2);
      d = `M${x1},${y1} H${mx} V${y2} H${x2}`;
    }
    return `<path d="${d}" fill="none" stroke="${traced?'var(--amber)':'#2b2e38'}" stroke-width="${traced?1.6:1.2}"
      ${traced?'stroke-dasharray="4 3" class="edge-live"':''} marker-end="url(#arrow)"/>`;
  }).join('');
  const nodes=MAP_NODES.map(n=>{
    const st=nodeState(n.id);
    const bad = st.color==='var(--red)';
    return `<g>
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="40" fill="${bad?'rgba(255,59,48,.07)':'var(--deck-plate2)'}" stroke="${st.color}" stroke-width="1"/>
      <rect x="${n.x}" y="${n.y}" width="3" height="40" fill="${st.color}"/>
      <text x="${n.x+13}" y="${n.y+17}" class="svcnode-label">${n.id.toUpperCase()}</text>
      <text x="${n.x+13}" y="${n.y+30}" class="svcnode-sub" fill="${st.color}">${st.label}</text>
    </g>`;
  }).join('');
  return `<svg class="svcmap" viewBox="0 0 830 285">
    <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3f434f"/></marker></defs>
    ${edges}${nodes}
  </svg>`;
}

/* ---- Traces ---- */
function sectionTraces(){

  const recovering = state.phase==='remediating';
  const pick=(bad,rec,ok)=> broken?bad:recovering?rec:ok;
  // depth = nesting level, start = offset from trace origin (ms)
  const spans=[
    {svc:'checkout-service',      op:'POST /v1/checkout/place-order', depth:0, start:0,                       dur:pick(4800,1400,210)},
    {svc:'order-service',         op:'orders.create',                 depth:1, start:pick(90,50,18),          dur:pick(4200,1050,150)},
    {svc:'db.connection.acquire', op:'pool.acquire',                  depth:2, start:pick(140,80,26),         dur:pick(3900,900,12)},
    {svc:'payment-service',       op:'payments.authorize',            depth:2, start:pick(4100,980,52),       dur:pick(1600,520,80)},
  ];
  const total=Math.max(...spans.map(s=>s.start+s.dur),300);
  return `
    ${sevTopline('Traces')}
    <div class="panel">
      <div class="panel-h"><h2>Trace — POST /v1/checkout/place-order</h2><span class="sub">${broken?'trace_id 9c14ef2a · status error':'trace_id 771ab30f · status ok'}</span></div>
      <div class="waterfall">
        ${spans.map(sp=>{
          const slow = sp.dur>1000;
          const left=(sp.start/total)*100, w=Math.max(0.6,(sp.dur/total)*100);
          return `<div class="wrow ${slow?'slow':''}">
            <div class="wlab" style="padding-left:${sp.depth*14}px">
              ${sp.depth?'<span class="wtick"></span>':''}
              <span class="wsvc">${sp.svc}</span>
              <span class="wop">${sp.op}</span>
            </div>
            <div class="wtrack">
              <div class="wbar" style="left:${left.toFixed(2)}%;width:${w.toFixed(2)}%"></div>
            </div>
            <span class="wdur">${fmtMs(sp.dur)}</span>
          </div>`;
        }).join('')}
        <div class="waxis">
          <div></div>
          <div class="wticks">${[0,.25,.5,.75,1].map(f=>`<span>${fmtMs(total*f)}</span>`).join('')}</div>
          <div></div>
        </div>
      </div>
    </div>
  `;
}

function sectionK8s(){

      <table class="k8s"><thead><tr><th>Pod</th><th>Status</th><th>Restarts</th><th>CPU</th><th>Memory</th></tr></thead>

function rndFixed(a,b){return Math.round(rnd(a,b));}
function podStatusHtml(s){
  if(s==='run') return `<span class="pod-status run"><span class="d"></span>Running</span>`;
  if(s==='restart') return `<span class="pod-status restart"><span class="d"></span>Restarting</span>`;
  return `<span class="pod-status crash"><span class="d"></span>CrashLoopBackOff</span>`;
}

/* ============================================================
   AUTOPLAY — simulated cursor drives the whole demo hands-free
   ============================================================ */
const cursorEl = $('#simCursor');
const captionEl = $('#simCaption');
const autoplay = { token:0, paused:false, running:false, timers:[] };

function autoRawWait(ms){
  return new Promise(res=>{ const id=setTimeout(res, ms); autoplay.timers.push(id); });
}
function clearAutoplayTimers(){ autoplay.timers.forEach(id=>clearTimeout(id)); autoplay.timers=[]; }

function placeCursorAt(x,y){
  cursorEl.style.left = x+'px'; cursorEl.style.top = y+'px';
  captionEl.style.left = x+'px'; captionEl.style.top = y+'px';
}
function pulseClick(){
  cursorEl.classList.remove('clicking'); void cursorEl.offsetWidth; cursorEl.classList.add('clicking');
}
function setPauseBtnUI(){
  const b=$('#autoplayToggle');
  if(!b) return;
  b.textContent = autoplay.paused ? '▶ Resume Autoplay' : '⏸ Pause Autoplay';
}

function stopAutoplayScript(){
  autoplay.token++;
  autoplay.running=false;
  autoplay.paused=false;
  clearAutoplayTimers();
  setPauseBtnUI();
  cursorEl.classList.remove('show');
  captionEl.classList.remove('show');
}

async function playScript(myToken){
  const dead = ()=> myToken!==autoplay.token;
  async function wait(ms){
    let elapsed=0;
    while(elapsed<ms){
      if(dead()) return;
      if(autoplay.paused){ await autoRawWait(150); continue; }
      const chunk=Math.min(150, ms-elapsed);
      await autoRawWait(chunk);
      elapsed+=chunk;
    }
  }
  async function waitForPhase(target, timeoutMs){
    const start=Date.now();
    const targetIdx=PHASES.indexOf(target);
    while(PHASES.indexOf(state.phase)<targetIdx){
      if(dead()) return false;
      if(Date.now()-start>timeoutMs) return false;
      await wait(200);
    }
    return true;
  }
  function caption(text){
    captionEl.textContent=text;
    captionEl.classList.add('show');
  }
  async function findEl(selector){
    for(let i=0;i<20;i++){
      const el=document.querySelector(selector);
      if(el) return el;
      if(dead()) return null;
      await autoRawWait(100);
    }
    return document.querySelector(selector);
  }
  async function goto(selector){
    const el=await findEl(selector);
    if(!el || dead()) return null;
    const r=el.getBoundingClientRect();
    cursorEl.classList.add('show');
    placeCursorAt(r.left+r.width/2, r.top+r.height/2);
    captionEl.classList.add('show');
    await wait(650);
    return dead() ? null : el;
  }
  async function click(selector, cap){
    if(cap) caption(cap);
    const el=await goto(selector);
    if(!el || dead()) return null;
    await wait(180);
    pulseClick();
    el.click();
    await wait(380);
    return el;
  }
  async function typeInto(selector, text, cap){
    if(cap) caption(cap);
    const el=await goto(selector);
    if(!el || dead()) return;
    el.focus();
    for(const ch of text){
      if(dead()) return;
      el.value += ch;
      el.dispatchEvent(new Event('input',{bubbles:true}));
      await autoRawWait(38);
    }
    await wait(400);
  }

  autoplay.running=true;
  await wait(900);
  if(dead()) return;

  caption('Customer browsing meridian.com');
  await wait(500);
  await typeInto('#searchInput','jacket');
  if(dead()) return;

  await click('.mer-card','Opening product page');
  if(dead()) return;
  await click('[data-size="L"]','Selecting size');
  await click('[data-color="Midnight"]','Selecting color');
  await click('#addCartBtn','Adding to cart');
  if(dead()) return;
  await click('.mer-cart','Opening cart');
  await click('#proceedCheckoutBtn','Proceeding to checkout');
  if(dead()) return;
  await wait(700);

  await click('#placeOrderBtn','Customer clicks Place Order');
  if(dead()) return;
  await wait(900);
  caption('Order failed — customer retries');
  await click('#placeOrderBtn');
  if(dead()) return;
  await wait(900);

  caption('Escalating to RemOpsAI…');
  await click('[data-env="rops"]');
  if(dead()) return;
  await wait(600);

  await goto('[data-sec="command"]');
  caption('P1 incident detected automatically');
  await wait(2200);
  if(dead()) return;

  await click('[data-sec="metrics"]','Error rate and latency spiking');
  await wait(2400);
  if(dead()) return;

  await click('[data-sec="k8s"]','Checkout pods restarting');
  await wait(2000);
  if(dead()) return;

  await click('[data-sec="logs"]','Application logs streaming errors');
  await wait(2000);
  if(dead()) return;

  await click('[data-sec="servicemap"]','Tracing the dependency chain');
  await wait(2600);
  if(dead()) return;

  await click('[data-sec="investigation"]','Correlating evidence across the stack');
  const gotRoot = await waitForPhase('rootcause', 20000);
  if(dead()) return;
  if(gotRoot){ caption('Root cause identified'); await wait(1600); }
  await waitForPhase('remediation_ready', 15000);
  if(dead()) return;

  await click('[data-sec="remediation"]','Reviewing remediation plan');
  await wait(1200);
  if(dead()) return;
  await click('#authBtn','Authorizing remediation');
  if(dead()) return;

  await goto('[data-sec="command"]');
  caption('Rolling back deployment, restoring connections…');
  await waitForPhase('resolved', 20000);
  if(dead()) return;
  await wait(1000);

  caption('Verifying the customer can now order');
  await click('[data-env="store"]');
  if(dead()) return;
  await wait(500);
  await click('#placeOrderBtn','Retrying the same order');
  if(dead()) return;
  await wait(1400);
  caption('Order confirmed');
  await wait(1400);

  await click('[data-env="rops"]');
  await click('[data-sec="report"]','Auto-generated incident report');
  if(dead()) return;
  await wait(3200);

  caption('Demo complete — press Replay to run again');
  await wait(2200);
  captionEl.classList.remove('show');
  cursorEl.classList.remove('show');
  autoplay.running=false;
}

function launchAutoplay(){
  clearAutoplayTimers();
  autoplay.token++;
  autoplay.paused=false;
  setPauseBtnUI();
  playScript(autoplay.token);
}

$('#autoplayToggle').addEventListener('click', ()=>{
  if(!autoplay.running) return;
  autoplay.paused=!autoplay.paused;
  setPauseBtnUI();
});
$('#replayBtn').addEventListener('click', ()=>{
  stopAutoplayScript();
  resetDemo();
  autoRawWait(400).then(launchAutoplay);
});

store.lastOrderItems=[];
renderStore();
renderActiveConsole();
updateStatusPill();
updateTriggerBtn();

state.heartbeat = setInterval(heartbeatTick, 700);
setInterval(ambientTick, 3600);

launchAutoplay();

})();
</script>
