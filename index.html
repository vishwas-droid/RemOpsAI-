/* ============================================================
   LIVE RACE — Manual On-Call vs RemOpsAI, on the same real
   incident, both clocks real wall-time. One click starts both;
   the manual side has to be clicked through step by step, the
   same as a human actually would — nothing here is scripted pacing.
   ============================================================ */
const MANUAL_STEPS=[
  {label:'Open the paging alert and acknowledge it', sub:'checkout-service error rate paging on-call'},
  {label:'Open the logs dashboard and search for errors', sub:'grep across checkout-service, order-service, payment-service'},
  {label:'Open the metrics dashboard and check error rate / latency', sub:'cross-reference against the alert'},
  {label:'Open the tracing tool and follow one slow request', sub:'checkout → order → payment → postgres'},
  {label:'Open the Kubernetes dashboard and check pod health', sub:'pods restarting — cause, or symptom?'},
  {label:'Open the database dashboard and check connection pool', sub:'cross-reference saturation timing against the trace'},
  {label:'Open the deploy history and find what shipped recently', sub:'read the diff, form a hypothesis'},
  {label:'Write the fix and push it straight to production', sub:'no isolated test — hoping it works', risky:true},
];
const raceState={
  started:false, startedAt:null,
  manualIdx:0, manualDoneAt:null, manualBusy:false,
  remopsStartedAt:null, remopsDoneAt:null,
};
function fmtRaceClock(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function raceIsActive(){ const el=$('#env-race'); return !!(el && el.classList.contains('active')); }
function renderRaceIfVisible(){ if(raceIsActive()) renderRace(); }

function raceManualBody(){
  if(!raceState.started) return `<p class="race-note">Same incident, handled the old way — click through every step yourself, the same as an on-call engineer actually has to.</p>`;
  return `
    <p class="race-note">Click each step in order.</p>
    ${MANUAL_STEPS.map((st,i)=>{
      const done = i<raceState.manualIdx;
      const active = i===raceState.manualIdx && !raceState.manualDoneAt;
      const busy = active && raceState.manualBusy;
      return `<div class="race-step ${done?'done':active?'active':''}">
        <span class="dot"></span>
        <span class="txt">${esc(st.label)}<span class="sub">${esc(st.sub)}</span>${st.risky?'<span class="race-riskflag">no safety net</span>':''}</span>
        ${done ? '' : active ? `<button class="race-stepbtn" data-step="${i}" ${busy?'disabled':''}>${busy?'Working…':'Do it'}</button>` : `<button class="race-stepbtn" disabled>Waiting</button>`}
      </div>`;
    }).join('')}
  `;
}
function raceRemopsBody(){
  if(!raceState.started) return `<p class="race-note">RemOps starts the moment the race begins — no clicking required until it asks for authorization.</p>`;
  const tl=state.timeline;
  const needsAuth = state.phase==='remediation_ready';
  return `
    ${needsAuth ? `<div class="race-authbar"><p>Fix is ready. RemOps is waiting on a human to authorize it before touching anything.</p><button class="race-authbtn" id="raceAuthBtn">Authorize Remediation</button></div>` : ''}
    <div class="race-feed">
      ${tl.length ? tl.slice().reverse().map(e=>`<div class="ln"><span class="t">${e.t}</span>${esc(e.d)}</div>`).join('') : `<div class="ln">Waiting for the first signal…</div>`}
    </div>
  `;
}
function renderRace(){
  const el=$('#env-race'); if(!el) return;
  const manualDone = raceState.manualDoneAt!=null;
  const remopsDone = raceState.remopsDoneAt!=null;
  const manualMs = raceState.started ? (manualDone?raceState.manualDoneAt:Date.now())-raceState.startedAt : 0;
  const remopsMs = raceState.started ? (remopsDone?raceState.remopsDoneAt:Date.now())-raceState.startedAt : 0;
  const racing = raceState.started && !(manualDone && remopsDone);
  el.innerHTML=`
    <div class="race-shell">
      <div class="race-intro">
        <div>
          <h1>Same incident. Two ways to handle it.</h1>
          <p>Both clocks are real wall-clock time — nothing sped up, nothing scripted. Click through the manual side yourself while RemOps handles the same incident on its own.</p>
        </div>
        <button class="race-start" id="raceStartBtn" ${racing?'disabled':''}>${racing?'Racing…':(raceState.started?'↻ Run it again':'▶ Start the race')}</button>
      </div>
      <div class="race-grid">
        <div class="race-col manual">
          <div class="race-col-head">
            <span class="ico">🧑‍💻</span>
            <span class="ti"><b>Manual On-Call Engineer</b><span>you click every step</span></span>
            <span class="race-clock ${manualDone?'done':''}" id="raceManualClock">${fmtRaceClock(manualMs)}</span>
          </div>
          <div class="race-col-body" id="raceManualBody">${raceManualBody()}</div>
        </div>
        <div class="race-col remops">
          <div class="race-col-head">
            <span class="ico">⚙️</span>
            <span class="ti"><b>RemOpsAI</b><span>autonomous, one authorization</span></span>
            <span class="race-clock ${remopsDone?'done':''}" id="raceRemopsClock">${fmtRaceClock(remopsMs)}</span>
          </div>
          <div class="race-col-body" id="raceRemopsBody">${raceRemopsBody()}</div>
        </div>
      </div>
      <div class="race-result ${manualDone&&remopsDone?'show':''}">
        <h3>Result — this run</h3>
        <div class="rrow"><span>Manual process</span><b>${fmtRaceClock(manualMs)}</b></div>
        <div class="rrow"><span>RemOpsAI</span><b>${fmtRaceClock(remopsMs)}</b></div>
      </div>
    </div>
  `;
  const startBtn=$('#raceStartBtn'); if(startBtn) startBtn.addEventListener('click', startRace);
  $$('.race-stepbtn[data-step]', el).forEach(b=>b.addEventListener('click', ()=>doManualStep(+b.getAttribute('data-step'))));
  const authBtn=$('#raceAuthBtn'); if(authBtn) authBtn.addEventListener('click', authorizeRemediation);
}
function startRace(){
  if(raceState.started && !(raceState.manualDoneAt && raceState.remopsDoneAt)) return;
  if(state.phase!=='normal') resetDemo();
  raceState.started=true;
  raceState.startedAt=Date.now();
  raceState.manualIdx=0; raceState.manualDoneAt=null; raceState.manualBusy=false;
  raceState.remopsStartedAt=Date.now(); raceState.remopsDoneAt=null;
  startIncident();
  renderRace();
}
function doManualStep(i){
  if(!raceState.started || raceState.manualBusy || raceState.manualDoneAt) return;
  if(i!==raceState.manualIdx) return;
  raceState.manualBusy=true;
  renderRace();
  setTimeout(()=>{
    raceState.manualBusy=false;
    raceState.manualIdx++;
    if(raceState.manualIdx>=MANUAL_STEPS.length) raceState.manualDoneAt=Date.now();
    renderRace();
  }, 700+Math.random()*900);
}
function tickRace(){
  if(!raceState.started) return;
  if(state.phase==='resolved' && !raceState.remopsDoneAt){
    raceState.remopsDoneAt = (state.incident && state.incident.resolvedAt) ? state.incident.resolvedAt.getTime() : Date.now();
    renderRaceIfVisible();
  }
  if(!raceIsActive()) return;
  const mc=$('#raceManualClock'), rc=$('#raceRemopsClock');
  if(mc) mc.textContent = fmtRaceClock((raceState.manualDoneAt?raceState.manualDoneAt:Date.now())-raceState.startedAt);
  if(rc) rc.textContent = fmtRaceClock((raceState.remopsDoneAt?raceState.remopsDoneAt:Date.now())-raceState.startedAt);
}

function switchEnv(env){
  $$('.env').forEach(e=>e.classList.remove('active'));

  $$('.envbtn').forEach(b=>b.classList.toggle('active', b.getAttribute('data-env')===env));
  renderCC();
  if(env==='race') renderRace();
}

$('#envSwitch').addEventListener('click', e=>{
  const b=e.target.closest('.envbtn'); if(!b) return;
  switchEnv(b.getAttribute('data-env'));
});
$('#resetBtn').addEventListener('click', resetDemo);
$('#ccToggle').addEventListener('click', ()=> setCC(!cc.on));
$('#ccClose').addEventListener('click', ()=> setCC(false));

store.lastOrderItems=[];
renderStore();
renderActiveConsole();
renderRace();
setCC(true);
updateStatusPill();
updateTriggerBtn();

state.heartbeat = setInterval(heartbeatTick, 700);
setInterval(ambientTick, 3600);
setInterval(tickRace, 250);

})();
