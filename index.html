<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RemOpsAI Incident Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0a0d12; --bg-raised:#0d1119; --ink:#e8ecf3;
  --rops-bg:#0b0f16; --rops-surface:#121826; --rops-surface2:#171f30; --rops-border:#232c40; --rops-border-soft:#1a2233;
  --rops-text:#e7ecf7; --rops-dim:#8b93ab; --rops-faint:#5c657c;
  --accent:#4c8dff; --accent-2:#22d3b7; --accent-soft:rgba(76,141,255,.14);
  --danger:#f0475a; --danger-soft:rgba(240,71,90,.14);
  --warn:#f5a623; --warn-soft:rgba(245,166,35,.14);
  --ok:#22c77a; --ok-soft:rgba(34,199,122,.14);

  --mer-bg:#fbf9f6; --mer-surface:#ffffff; --mer-border:#e7e2d9; --mer-ink:#1c1a17; --mer-dim:#6f6a60;
  --mer-accent:#c65a2e; --mer-accent-ink:#ffffff; --mer-accent-soft:#fbe6da;

  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --radius:10px; --radius-lg:16px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
::selection{background:var(--accent-soft)}
.hidden{display:none !important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#28324a;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}

/* ============ SIMULATION CONTROL STRIP ============ */
.simbar{
  position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;
  padding:9px 18px;background:linear-gradient(180deg,#0d1119,#0a0d12);
  border-bottom:1px solid #1c2334;
}
.simbar-tag{
  display:flex;align-items:center;gap:7px;font:700 10.5px/1 var(--mono);letter-spacing:.09em;
  color:var(--accent-2);padding:6px 9px;border:1px solid #1c3a3a;border-radius:7px;background:rgba(34,211,183,.06);
  white-space:nowrap;
}
.simbar-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 3px rgba(34,211,183,.18)}
.envswitch{display:flex;gap:4px;background:#10151f;border:1px solid #1c2334;border-radius:10px;padding:3px}
.envbtn{
  display:flex;align-items:center;gap:7px;padding:7px 13px;border:none;background:transparent;color:var(--rops-dim);
  border-radius:8px;font-size:12.5px;font-weight:600;letter-spacing:.01em;transition:background .15s,color .15s;
}
.envbtn .b{width:6px;height:6px;border-radius:50%;flex:none}
.envbtn.active{background:#1c2536;color:var(--ink)}
.envbtn:not(.active):hover{background:#141b28;color:#c6cce0}
.simbar-spacer{flex:1}
.status-pill{
  display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;
  border:1px solid var(--rops-border);background:var(--rops-surface);color:var(--ok);white-space:nowrap;
}
.status-pill .pdot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px currentColor;opacity:.9}
.status-pill.warn{color:var(--warn)}
.status-pill.bad{color:var(--danger);animation:pulseBad 1.4s ease-in-out infinite}
.status-pill.recovering{color:var(--accent)}
@keyframes pulseBad{0%,100%{box-shadow:0 0 0 0 rgba(240,71,90,0)}50%{box-shadow:0 0 0 5px rgba(240,71,90,.12)}}
.btn{
  border-radius:9px;padding:8px 15px;font-size:12.5px;font-weight:700;border:1px solid transparent;letter-spacing:.01em;
  transition:filter .15s,transform .05s;white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn-trigger{background:linear-gradient(180deg,#ff5a68,#e3324a);color:#fff;box-shadow:0 6px 18px -6px rgba(240,71,90,.55)}
.btn-trigger:hover:not(:disabled){filter:brightness(1.08)}
.btn-ghost{background:#12182450;border-color:var(--rops-border);color:var(--rops-dim)}
.btn-ghost:hover{color:var(--ink);border-color:#33405c}
.btn-auto{background:var(--rops-surface2);border-color:var(--rops-border);color:#cfe0ff;display:flex;align-items:center;gap:6px}
.btn-auto:hover{border-color:#3a4666}
.simbar{flex-wrap:wrap;row-gap:8px}

/* ============ VIEWPORT ============ */
.viewport{flex:1;min-height:0;background:var(--bg)}
.env{display:none;min-height:calc(100vh - 49px)}
.env.active{display:block}

/* ============================================================
   MERIDIAN STOREFRONT
   ============================================================ */
#env-store{background:var(--mer-bg);color:var(--mer-ink)}
.mer-shell{max-width:1180px;margin:0 auto}
.mer-addr{
  display:flex;align-items:center;gap:8px;padding:7px 18px;background:#f1ede4;border-bottom:1px solid var(--mer-border);
  font:500 11.5px var(--mono);color:var(--mer-dim);
}
.mer-addr .lockdot{width:6px;height:6px;border-radius:50%;background:#3fa15a}
.mer-header{
  display:flex;align-items:center;gap:22px;padding:16px 28px;background:var(--mer-surface);
  border-bottom:1px solid var(--mer-border);position:sticky;top:49px;z-index:20;
}
.mer-logo{font-weight:800;font-size:21px;letter-spacing:-.02em;color:var(--mer-ink);cursor:pointer;white-space:nowrap}
.mer-logo span{color:var(--mer-accent)}
.mer-search{
  flex:1;display:flex;align-items:center;gap:10px;background:#f4f1eb;border:1px solid var(--mer-border);
  border-radius:10px;padding:9px 14px;max-width:560px;
}
.mer-search input{flex:1;border:none;background:transparent;font-size:13.5px;color:var(--mer-ink);outline:none}
.mer-search svg{flex:none;opacity:.5}
.mer-navlinks{display:flex;gap:18px;font-size:12.5px;color:var(--mer-dim);font-weight:600}
.mer-navlinks a{color:inherit;text-decoration:none;cursor:pointer}
.mer-navlinks a:hover{color:var(--mer-ink)}
.mer-spacer{flex:1}
.mer-cart{
  display:flex;align-items:center;gap:7px;background:var(--mer-ink);color:#fff;border:none;border-radius:9px;
  padding:9px 14px;font-weight:700;font-size:12.5px;position:relative;
}
.mer-cart .cnt{
  background:var(--mer-accent);border-radius:50%;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;padding:0 4px;
}
.mer-body{padding:26px 28px 60px}
.mer-crumb{font-size:12px;color:var(--mer-dim);margin-bottom:16px;display:flex;gap:6px;align-items:center}
.mer-crumb a{color:var(--mer-dim);cursor:pointer;text-decoration:none}
.mer-crumb a:hover{color:var(--mer-accent)}
.mer-hero{
  background:linear-gradient(120deg,#2a2420,#453a2e);border-radius:18px;padding:38px 40px;color:#f4ede1;margin-bottom:26px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.mer-hero h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.01em}
.mer-hero p{margin:0;color:#cdbfa8;font-size:13.5px}
.mer-hero .tag{display:inline-block;margin-top:14px;background:var(--mer-accent);padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700}
.mer-grid-title{font-size:13px;font-weight:700;color:var(--mer-dim);text-transform:uppercase;letter-spacing:.06em;margin:0 0 14px}
.mer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:900px){.mer-grid{grid-template-columns:repeat(2,1fr)}}
.mer-card{
  background:var(--mer-surface);border:1px solid var(--mer-border);border-radius:14px;overflow:hidden;cursor:pointer;
  transition:box-shadow .15s,transform .1s;
}
.mer-card:hover{box-shadow:0 14px 30px -16px rgba(0,0,0,.18);transform:translateY(-2px)}
.mer-thumb{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:34px}
.mer-card .info{padding:12px 13px 15px}
.mer-card h3{margin:0 0 4px;font-size:13px;font-weight:600;line-height:1.35}
.mer-rating{font-size:11px;color:var(--mer-dim);margin-bottom:6px}
.mer-rating b{color:#c9a227}
.mer-price{font-size:15px;font-weight:800}
.mer-empty{padding:60px 0;text-align:center;color:var(--mer-dim);font-size:13.5px}

.mer-pdp{display:grid;grid-template-columns:1.05fr 1fr;gap:44px}
@media (max-width:860px){.mer-pdp{grid-template-columns:1fr}}
.mer-gallery-main{aspect-ratio:1/1;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:90px;margin-bottom:12px}
.mer-gallery-thumbs{display:flex;gap:9px}
.mer-gthumb{width:62px;height:62px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid transparent;cursor:pointer}
.mer-gthumb.sel{border-color:var(--mer-accent)}
.mer-pdp h1{font-size:23px;margin:0 0 8px;letter-spacing:-.01em}
.mer-pdp-price{font-size:24px;font-weight:800;margin:6px 0 16px}
.mer-pdp-price .was{font-size:14px;color:var(--mer-dim);text-decoration:line-through;font-weight:500;margin-left:8px}
.mer-section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mer-dim);margin:18px 0 8px}
.mer-swatches{display:flex;gap:8px;flex-wrap:wrap}
.mer-pill{
  padding:8px 15px;border-radius:9px;border:1.5px solid var(--mer-border);background:#fff;font-size:12.5px;font-weight:600;
}
.mer-pill.sel{border-color:var(--mer-ink);background:var(--mer-ink);color:#fff}
.mer-qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--mer-border);border-radius:9px;width:fit-content}
.mer-qty button{width:34px;height:34px;background:none;border:none;font-size:16px;font-weight:700}
.mer-qty span{width:34px;text-align:center;font-weight:700;font-size:13px}
.mer-addcart{
  margin-top:22px;width:100%;padding:14px;background:var(--mer-ink);color:#fff;border:none;border-radius:11px;
  font-size:14px;font-weight:800;letter-spacing:.01em;
}
.mer-addcart:hover{background:#000}
.mer-reviews{margin-top:26px;border-top:1px solid var(--mer-border);padding-top:18px}
.mer-review{padding:12px 0;border-bottom:1px solid #f0ece3}
.mer-review .stars{color:#c9a227;font-size:12px;margin-bottom:4px}
.mer-review .who{font-size:11.5px;color:var(--mer-dim);margin-top:4px}
.mer-review p{margin:4px 0 0;font-size:12.5px;line-height:1.55;color:#3a352d}

.mer-toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--mer-ink);color:#fff;
  padding:12px 20px;border-radius:11px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  z-index:500;box-shadow:0 20px 40px -16px rgba(0,0,0,.4);display:flex;align-items:center;gap:9px;
}
.mer-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.mer-cartview{max-width:760px;margin:0 auto}
.mer-cart-row{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--mer-border)}
.mer-cart-thumb{width:66px;height:66px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.mer-cart-row .meta{flex:1;min-width:0}
.mer-cart-row .meta h4{margin:0 0 3px;font-size:13.5px}
.mer-cart-row .meta .sub{font-size:11.5px;color:var(--mer-dim)}
.mer-cart-row .price{font-weight:800;font-size:14px;white-space:nowrap}
.mer-summary{
  background:var(--mer-surface);border:1px solid var(--mer-border);border-radius:14px;padding:20px 22px;margin-top:22px;
}
.mer-summary .line{display:flex;justify-content:space-between;font-size:13px;color:var(--mer-dim);padding:5px 0}
.mer-summary .line.total{border-top:1px solid var(--mer-border);margin-top:8px;padding-top:12px;font-size:16px;font-weight:800;color:var(--mer-ink)}
.mer-cta{width:100%;padding:15px;border:none;border-radius:11px;background:var(--mer-accent);color:#fff;font-size:14.5px;font-weight:800;margin-top:16px}
.mer-cta:hover:not(:disabled){filter:brightness(1.06)}
.mer-cta.secondary{background:var(--mer-ink)}

.mer-checkout{display:grid;grid-template-columns:1.2fr .9fr;gap:38px;max-width:980px;margin:0 auto}
@media (max-width:800px){.mer-checkout{grid-template-columns:1fr}}
.mer-field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mer-field{display:flex;flex-direction:column;gap:6px}
.mer-field label{font-size:11px;font-weight:700;color:var(--mer-dim);text-transform:uppercase;letter-spacing:.05em}
.mer-field input{border:1.5px solid var(--mer-border);border-radius:9px;padding:11px 12px;font-size:13px;background:#fff;color:var(--mer-ink)}
.mer-field input:focus{outline:none;border-color:var(--mer-accent)}
.mer-card-panel{background:var(--mer-surface);border:1px solid var(--mer-border);border-radius:14px;padding:20px 22px;margin-bottom:18px}
.mer-card-panel h3{margin:0 0 14px;font-size:13.5px}
.mer-payrow{display:flex;align-items:center;gap:12px;border:1.5px solid var(--mer-border);border-radius:10px;padding:12px 14px;font:600 13px var(--mono)}
.mer-payrow .brand{background:#1a1f71;color:#fff;font:800 10px var(--sans);padding:3px 7px;border-radius:4px}

.mer-alert{
  display:flex;gap:12px;align-items:flex-start;background:#fdecee;border:1.5px solid #f6b9c1;color:#9a1730;border-radius:12px;
  padding:14px 16px;margin-bottom:18px;font-size:13px;line-height:1.5;animation:shakeIn .35s ease;
}
@keyframes shakeIn{0%{transform:translateX(0);opacity:0}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}100%{transform:translateX(0);opacity:1}}
.mer-alert b{display:block;margin-bottom:2px;font-size:13.5px}
.mer-alert .code{font:600 11px var(--mono);color:#c4405a;margin-top:5px;display:block}

.mer-confirm{max-width:560px;margin:60px auto;text-align:center}
.mer-confirm .ring{width:76px;height:76px;border-radius:50%;background:var(--ok-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.mer-confirm h1{font-size:23px;margin:0 0 8px}
.mer-confirm .ordno{font:700 15px var(--mono);color:var(--mer-dim);margin-bottom:26px}
.mer-confirm-card{background:var(--mer-surface);border:1px solid var(--mer-border);border-radius:14px;padding:20px 22px;text-align:left}

.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   REMOPSAI CONSOLE — "INSTRUMENT PLATE"
   An engineering drawing sheet, not a dashboard. Warm paper ground,
   white plates, hairline ink rules, print inks for signal colour,
   graph-paper chart recorders. No blur, no glow, no rounded corners.
   ============================================================ */
#env-rops{
  --paper:#f2f0e9;
  --paper-2:#e9e6dd;
  --plate:#ffffff;
  --ink:#15171c;
  --ink-2:#4d525c;
  --ink-3:#8a8f9a;
  --rule:#dedbd1;
  --rule-2:#c2beb2;
  --rule-3:#a9a496;

  --red:#c2261a;
  --red-wash:#fbeae7;
  --amber:#9c6300;
  --amber-wash:#fbf1de;
  --green:#1b6f45;
  --green-wash:#e9f3ec;
  --blue:#27476f;

  --pm:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --pc:'IBM Plex Sans Condensed','IBM Plex Sans',Inter,system-ui,sans-serif;
  --pt:'IBM Plex Sans',Inter,system-ui,sans-serif;

  background:var(--paper);
  color:var(--ink);
  font-feature-settings:"tnum" 1,"zero" 1,"ss01" 1;
  position:relative;
}
/* Graph-paper ground — the sheet the instruments are drawn on. */
#env-rops::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(21,23,28,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,23,28,.07) 1px,transparent 1px),
    linear-gradient(rgba(21,23,28,.038) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,23,28,.038) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,16px 16px,16px 16px;
}
#env-rops *{border-radius:0}
.rops-shell{display:flex;min-height:calc(100vh - 49px);align-items:stretch;position:relative;z-index:1}

/* ---------- Index rail ---------- */
.rops-side{
  width:212px;flex:none;padding:0;gap:0;
  background:var(--plate);
  border-right:1px solid var(--rule-2);
  display:flex;flex-direction:column;
}
.rops-brand{
  display:flex;align-items:center;gap:10px;
  padding:14px 14px;border-bottom:1px solid var(--rule-2);
}
.rops-mark{
  width:26px;height:26px;flex:none;background:var(--ink);position:relative;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
}
.rops-mark svg path{stroke:#fff !important}
.rops-brand b{font:700 14px var(--pc);letter-spacing:.01em;color:var(--ink);display:block}
.rops-brand b span{color:var(--red)}
.rops-brand .sub{
  display:block;font:500 8px var(--pm);letter-spacing:.22em;
  color:var(--ink-3);text-transform:uppercase;margin-top:3px;
}
.navsec{
  font:600 8.5px var(--pm);letter-spacing:.2em;color:var(--ink-3);
  text-transform:uppercase;padding:16px 14px 7px;
  display:flex;align-items:center;gap:9px;
}
.navsec::after{content:"";flex:1;height:1px;background:var(--rule)}
.navitem{
  position:relative;width:100%;display:grid;
  grid-template-columns:20px 15px 1fr auto;align-items:center;gap:9px;
  padding:6px 14px;background:none;border:none;cursor:pointer;
  font:500 12.5px var(--pc);letter-spacing:.005em;
  color:var(--ink-2);text-align:left;
  transition:background .1s linear,color .1s linear;
}
.navitem::before{content:attr(data-idx);font:500 9px var(--pm);color:var(--ink-3)}
.navitem svg{opacity:.55;width:14px;height:14px}
.navitem:hover:not(:disabled){background:var(--paper);color:var(--ink)}
.navitem.active{background:var(--ink);color:#fff}
.navitem.active::before{color:rgba(255,255,255,.62)}
.navitem.active svg{opacity:1}
.navitem:disabled{opacity:.36;cursor:default}
.navitem .nbadge{
  font:600 8px var(--pm);letter-spacing:.1em;padding:2px 5px;
  background:var(--red);color:#fff;
}
.navitem.active .nbadge{background:#fff;color:var(--ink)}
.navitem .nbadge:not(.ok){animation:lampBlink 1.1s steps(1,end) infinite}
.navitem .nbadge.ok{background:var(--green);color:#fff}
@keyframes lampBlink{0%,49%{opacity:1}50%,100%{opacity:.25}}

.rops-sidefoot{margin-top:auto;border-top:1px solid var(--rule-2);padding:12px 14px 14px}
.sfrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:3px 0;font:500 9.5px var(--pm)}
.sfrow .k{color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase}
.sfrow .v{color:var(--ink-2)}
.sfrow .v.lit{color:var(--green)}

.rops-main{flex:1;min-width:0;padding:0 0 70px;overflow-x:hidden}

/* ---------- Title block: an engineering drawing header ---------- */
.deck-strip{
  display:flex;align-items:stretch;background:var(--plate);
  border-bottom:1px solid var(--ink);position:relative;
  box-shadow:0 3px 0 -1px var(--plate),0 4px 0 -1px var(--rule-2);
}
/* registration crosses, like a plate ready for the press */
.deck-strip::before,.deck-strip::after{
  content:"";position:absolute;top:50%;width:9px;height:9px;pointer-events:none;
  background:
    linear-gradient(var(--rule-3),var(--rule-3)) center/1px 100% no-repeat,
    linear-gradient(var(--rule-3),var(--rule-3)) center/100% 1px no-repeat;
  transform:translateY(-50%);
}
.deck-strip::before{left:5px}
.deck-strip::after{right:5px}
.deck-state{
  display:flex;align-items:center;gap:9px;padding:0 18px 0 22px;flex:none;
  border-right:1px solid var(--rule-2);
}
.deck-lamp{width:10px;height:10px;flex:none;background:var(--ink-3);border:1px solid rgba(0,0,0,.22)}
.deck-lamp.red{background:var(--red);animation:lampBlink 1.1s steps(1,end) infinite}
.deck-lamp.amber{background:var(--amber)}
.deck-lamp.mint{background:var(--green)}
.deck-state .lbl{font:600 9.5px var(--pm);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.deck-state.red .lbl{color:var(--red)}
.deck-state.amber .lbl{color:var(--amber)}
.deck-state.mint .lbl{color:var(--green)}
.deck-strip .cell{
  padding:9px 18px;border-right:1px solid var(--rule);
  display:flex;flex-direction:column;gap:4px;justify-content:center;min-width:0;
}
.deck-strip .cell .k{font:600 8px var(--pm);letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
.deck-strip .cell .v{font:600 14px var(--pm);color:var(--ink);letter-spacing:-.01em;white-space:nowrap}
.deck-strip .cell.title{flex:1}
.deck-strip .cell.title .v{font:600 20px var(--pc);letter-spacing:-.005em}
.deck-strip .cell .v.red{color:var(--red)}
.deck-strip .cell .v.amber{color:var(--amber)}
.deck-strip .cell .v.mint{color:var(--green)}
.deck-strip .cell.clock .v{font-size:21px;font-weight:700}
.deck-strip .cell:last-child{border-right:none;padding-right:24px}

.deck-body{padding:18px 20px 0}
.rops-topline{display:none}

/* ---------- Plates ---------- */
.panel{
  background:var(--plate);
  border:1px solid var(--rule-2);
  padding:0;margin-bottom:16px;position:relative;
  box-shadow:0 1px 0 rgba(21,23,28,.05);
}
/* registration ticks, as on a plate trimmed for the press */
.panel::before,.panel::after{
  content:"";position:absolute;width:6px;height:6px;pointer-events:none;z-index:2;
}
.panel::before{top:-1px;left:-1px;border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.panel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--ink);border-right:2px solid var(--ink)}
.panel-h{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin:0;padding:8px 14px;border-bottom:1px solid var(--rule-2);
}
.panel-h h2{
  margin:0;font:600 9.5px var(--pm);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink);display:flex;align-items:center;gap:10px;
}
.panel-h h2::before{
  content:attr(data-n);color:#fff;background:var(--ink);
  padding:2px 5px;font-weight:600;letter-spacing:.06em;
}
.panel-h .sub{font:500 9.5px var(--pm);letter-spacing:.05em;color:var(--ink-3)}
.panel > *:not(.panel-h){padding-left:14px;padding-right:14px}
.panel > *:not(.panel-h):first-child{padding-top:12px}
.panel > *:last-child{padding-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}

/* ---------- Status callout ---------- */
.banner{
  display:flex;gap:0;align-items:stretch;padding:0;margin-bottom:16px;
  border:1px solid var(--rule-2);background:var(--plate);position:relative;
}
.banner .bicon{
  flex:none;width:54px;display:flex;align-items:center;justify-content:center;
  font:700 19px var(--pm);border-right:1px solid var(--rule-2);color:#fff;
}
.banner .btext{padding:14px 18px;flex:1;min-width:0}
.banner h3{margin:0 0 6px;font:600 13px var(--pm);letter-spacing:.13em;text-transform:uppercase}
.banner p{margin:0;font:400 13px var(--pt);color:var(--ink-2);line-height:1.6;max-width:86ch}
.banner.b-bad{border-color:var(--red)}
.banner.b-bad .bicon{background:var(--red);border-right-color:var(--red)}
.banner.b-bad h3{color:var(--red)}
.banner.b-bad .btext{background:var(--red-wash)}
.banner.b-warn{border-color:var(--amber)}
.banner.b-warn .bicon{background:var(--amber);border-right-color:var(--amber)}
.banner.b-warn h3{color:var(--amber)}
.banner.b-warn .btext{background:var(--amber-wash)}
.banner.b-info{border-color:var(--blue)}
.banner.b-info .bicon{background:var(--blue);border-right-color:var(--blue)}
.banner.b-info h3{color:var(--blue)}
.banner.b-ok,.banner.b-idle{border-color:var(--green)}
.banner.b-ok .bicon,.banner.b-idle .bicon{background:var(--green);border-right-color:var(--green)}
.banner.b-ok h3,.banner.b-idle h3{color:var(--green)}
.banner.b-ok .btext,.banner.b-idle .btext{background:var(--green-wash)}
.banner-facts{display:flex;flex-wrap:wrap;gap:0;margin-top:12px;border-top:1px solid rgba(21,23,28,.14)}
.bfact{padding:8px 20px 0 0;margin-right:20px;min-width:110px}
.bfact .k{font:600 8px var(--pm);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.bfact .v{font:600 12px var(--pm);color:var(--ink);margin-top:4px}

/* ---------- Flight-plan ladder ---------- */
.ladder{display:flex;align-items:stretch;border:1px solid var(--rule-2);background:var(--plate);margin-bottom:16px}
.lstep{
  flex:1;min-width:0;padding:9px 14px;border-right:1px solid var(--rule);
  display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;
}
.lstep:last-child{border-right:none}
.lstep .lidx{font:500 8.5px var(--pm);letter-spacing:.2em;color:var(--ink-3)}
.lstep .lname{font:600 11px var(--pm);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.lstep .lbar{height:3px;background:var(--paper-2)}
.lstep.done .lname,.lstep.done .lidx{color:var(--green)}
.lstep.done .lbar{background:var(--green)}
.lstep.active{background:var(--amber-wash)}
.lstep.active .lname,.lstep.active .lidx{color:var(--amber)}
.lstep.active .lbar{position:relative;overflow:hidden}
.lstep.active .lbar::after{
  content:"";position:absolute;inset:0;background:var(--amber);
  transform-origin:left;animation:barSweep 1.5s linear infinite;
}
@keyframes barSweep{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}


/* ---------- What Happened ---------- */
.xp{padding:0 !important}
.xrow{display:grid;grid-template-columns:56px 1fr;border-bottom:1px solid var(--rule)}
.xrow:last-child{border-bottom:none}
.xn{
  display:flex;align-items:flex-start;justify-content:center;padding:18px 0;
  border-right:1px solid var(--rule);background:var(--paper);
  font:600 17px var(--pm);color:var(--ink-3);letter-spacing:-.02em;
}
.xb{padding:17px 20px;min-width:0}
.xb h3{
  margin:0 0 7px;font:600 17px var(--pc);letter-spacing:-.005em;color:var(--ink);
  line-height:1.25;
}
.xb p{margin:0;font:400 14.5px var(--pt);line-height:1.65;color:var(--ink-2);max-width:78ch}
.xb b{color:var(--ink);font-weight:600}
.xchain{
  display:flex;flex-wrap:wrap;align-items:center;gap:9px;
  font:600 11px var(--pm);letter-spacing:.06em;text-transform:uppercase;
}
.xchain span{padding:6px 11px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink-2)}
.xchain span:first-child{border-color:var(--red);color:var(--red);background:var(--red-wash)}
.xchain i{color:var(--rule-3);font-style:normal}
@media (max-width:760px){
  .xrow{grid-template-columns:42px 1fr}
  .xb{padding:14px 15px}
  .xb h3{font-size:15.5px}
}

/* ---------- Chart recorders ---------- */
.stripwall{padding:0 !important}
.strip{
  display:grid;grid-template-columns:196px 1fr 100px;align-items:stretch;
  border-bottom:1px solid var(--rule);
}
.strip:last-child{border-bottom:none}
.strip .sid{
  padding:10px 14px;border-right:1px solid var(--rule);
  display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;
}
.strip .sid .nm{font:600 10px var(--pm);letter-spacing:.13em;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .sid .th{font:400 9px var(--pm);color:var(--ink-3);letter-spacing:.03em}
.strip .plot{position:relative;min-width:0;background:var(--plate)}
.strip .plot svg{display:block;width:100%;height:56px}
.strip .val{
  padding:10px 14px;border-left:1px solid var(--rule);
  display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:3px;
}
.strip .val .n{font:700 17px var(--pm);letter-spacing:-.02em;line-height:1;color:var(--ink)}
.strip .val .d{font:500 9px var(--pm);letter-spacing:.04em;color:var(--ink-3)}
.strip.s-warn .val .n{color:var(--amber)}
.strip.s-bad .val .n{color:var(--red)}
.strip.s-bad .sid .nm{color:var(--red)}
/* alarm rows get printer's hatching, not a glow */
.strip.s-bad .plot{
  background:
    repeating-linear-gradient(45deg,rgba(194,38,26,.055) 0 4px,transparent 4px 9px),
    var(--plate);
}
.strip .val .d.up{color:var(--red)}
.strip .val .d.down{color:var(--green)}
.gridline{stroke:rgba(21,23,28,.11);stroke-width:1;vector-effect:non-scaling-stroke}
.gridline.major{stroke:rgba(21,23,28,.22)}
.strip-thresh{stroke:var(--red);stroke-width:1;stroke-dasharray:5 3;opacity:.75;vector-effect:non-scaling-stroke}
.strip-axis{
  display:grid;grid-template-columns:196px 1fr 100px;
  border-top:1px solid var(--rule-2);background:var(--paper);
}
.strip-axis .lead{padding:5px 14px;border-right:1px solid var(--rule);font:600 8px var(--pm);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.strip-axis .ticks{display:flex;justify-content:space-between;padding:5px 6px;font:500 8.5px var(--pm);color:var(--ink-3);letter-spacing:.05em}
.strip-axis .tail{border-left:1px solid var(--rule)}


/* label gutters read like a chart recorder's paper margins */
.strip .sid,.strip .val,.mhead,.mstats{background:var(--paper)}
.yhi,.ylo{
  position:absolute;left:5px;font:500 8px var(--pm);letter-spacing:.04em;
  color:var(--ink-3);pointer-events:none;background:rgba(255,255,255,.72);padding:0 2px;
}
.yhi{top:2px}
.ylo{bottom:2px}

/* ---------- Metrics wall ---------- */
.mwall{padding:0 !important}
.mstrip{display:grid;grid-template-columns:216px 1fr 312px;align-items:stretch;border-bottom:1px solid var(--rule)}
.mstrip:last-child{border-bottom:none}
.mhead{padding:14px;border-right:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0}
.mname{font:600 11px var(--pm);letter-spacing:.13em;text-transform:uppercase;color:var(--ink)}
.mthresh{font:400 9px var(--pm);letter-spacing:.04em;color:var(--ink-3)}
.mplot{position:relative;min-width:0;background:var(--plate)}
.mplot svg{display:block;width:100%;height:104px}
.mstrip.s-bad .mplot{background:repeating-linear-gradient(45deg,rgba(194,38,26,.055) 0 4px,transparent 4px 9px),var(--plate)}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--rule)}
.ms{padding:14px 10px;border-right:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;gap:5px;text-align:right}
.ms:last-child{border-right:none}
.ms .k{font:600 8px var(--pm);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.ms .v{font:600 12.5px var(--pm);color:var(--ink-2);letter-spacing:-.01em}
.mstrip.s-ok .v.now{color:var(--green)}
.mstrip.s-warn .v.now{color:var(--amber)}
.mstrip.s-bad .v.now{color:var(--red)}
.mstrip.s-bad .mname{color:var(--red)}
@media (max-width:1200px){
  .mstrip{grid-template-columns:1fr}
  .mhead,.mstats{border-right:none;border-left:none;border-bottom:1px solid var(--rule)}
}

/* ---------- Annunciator ---------- */
.annun{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:0 !important}
@media (max-width:1240px){.annun{grid-template-columns:repeat(2,1fr)}}
.ann{
  position:relative;padding:12px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px;min-width:0;
}
.annun .ann:nth-child(3n){border-right:none}
@media (max-width:1240px){.annun .ann:nth-child(3n){border-right:1px solid var(--rule)}.annun .ann:nth-child(2n){border-right:none}}
.annun .ann:nth-last-child(-n+3){border-bottom:none}
.ann .lamp{width:12px;height:12px;flex:none;border:1px solid rgba(0,0,0,.25);background:var(--ink-3)}
.ann .meta{min-width:0;flex:1;display:flex;flex-direction:column}
.ann .code{display:block;font:600 11.5px var(--pm);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ann .stat{display:block;font:600 8px var(--pm);letter-spacing:.18em;text-transform:uppercase;margin-top:4px}
.ann .load{font:600 10.5px var(--pm);color:var(--ink-3);flex:none}
.ann.ok .lamp{background:var(--green)}
.ann.ok .stat{color:var(--green)}
.ann.bad{background:repeating-linear-gradient(45deg,rgba(194,38,26,.06) 0 4px,transparent 4px 9px),var(--red-wash)}
.ann.bad .lamp{background:var(--red);animation:lampBlink 1.1s steps(1,end) infinite}
.ann.bad .stat,.ann.bad .load{color:var(--red)}

/* ---------- Ledger ---------- */
.ledger{padding:0 !important;max-height:330px;overflow-y:auto}
.led{
  display:grid;grid-template-columns:76px 14px 1fr;align-items:baseline;
  padding:8px 14px;border-bottom:1px solid var(--rule);font:400 12.5px var(--pt);
}
.led:last-child{border-bottom:none}
.led .lt{font:500 10px var(--pm);color:var(--ink-3)}
.led .lm{font:600 10px var(--pm);color:var(--rule-3)}
.led .ld{color:var(--ink-2);line-height:1.5}
.led:first-child{background:var(--paper)}
.led:first-child .ld{color:var(--ink);font-weight:500}
.led:first-child .lm{color:var(--red)}
.reasoncursor{display:inline-block;margin-left:2px;color:var(--red);animation:lampBlink 1s steps(1,end) infinite}
@media (prefers-reduced-motion: reduce){ .reasoncursor{animation:none} }
.timeline-list{padding:0}
.timeline-list::before{display:none}
.tl-item{position:relative;padding:0}
.tl-item::before{display:none}

/* ---------- Trace waterfall ---------- */
.waterfall{padding:0 !important}
.wrow{display:grid;grid-template-columns:280px 1fr 78px;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--rule)}
.wlab{display:flex;align-items:baseline;gap:8px;min-width:0}
.wtick{width:9px;height:1px;background:var(--rule-3);flex:none;position:relative;top:-3px}
.wsvc{font:600 10.5px var(--pm);letter-spacing:.04em;color:var(--ink);white-space:nowrap}
.wop{font:400 10px var(--pm);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtrack{position:relative;height:15px;background:var(--paper);border:1px solid var(--rule)}
.wbar{position:absolute;top:0;bottom:0;background:var(--blue);transition:left .4s ease,width .4s ease}
.wrow.slow .wbar{background:repeating-linear-gradient(45deg,var(--red) 0 4px,#8e1a11 4px 8px)}
.wrow.slow .wsvc,.wrow.slow .wdur{color:var(--red)}
.wdur{font:600 10.5px var(--pm);text-align:right;color:var(--ink-2)}
.waxis{display:grid;grid-template-columns:280px 1fr 78px;gap:12px;padding:6px 14px;background:var(--paper);border-top:1px solid var(--rule-2)}
.wticks{display:flex;justify-content:space-between;font:500 8.5px var(--pm);letter-spacing:.05em;color:var(--ink-3)}
@media (max-width:1000px){.wrow,.waxis{grid-template-columns:154px 1fr 64px}}

/* ---------- Tables, logs, rows ---------- */
table.k8s{width:100%;border-collapse:collapse;font:500 11.5px var(--pm)}
table.k8s th{
  text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule-2);background:var(--paper);
  font:600 8px var(--pm);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);
}
table.k8s td{padding:8px 10px;border-bottom:1px solid var(--rule);color:var(--ink-2)}
table.k8s tr:last-child td{border-bottom:none}
table.k8s td:first-child{color:var(--ink)}
.pod-status{display:inline-flex;align-items:center;gap:7px;font:600 9.5px var(--pm);letter-spacing:.12em;text-transform:uppercase}
.pod-status .d{width:9px;height:9px;flex:none;border:1px solid rgba(0,0,0,.22)}
.pod-status.run{color:var(--green)}.pod-status.run .d{background:var(--green)}
.pod-status.restart{color:var(--amber)}.pod-status.restart .d{background:var(--amber)}
.pod-status.crash{color:var(--red)}.pod-status.crash .d{background:var(--red);animation:lampBlink 1.1s steps(1,end) infinite}

.logbox{
  background:var(--plate);border:1px solid var(--rule-2);font-family:var(--pm);
  font-size:11.5px;line-height:1.6;padding:0;max-height:540px;overflow-y:auto;
}
.logline{
  display:grid;grid-template-columns:66px 46px 136px 1fr;gap:12px;
  padding:3px 12px;white-space:pre-wrap;word-break:break-word;
  border-bottom:1px solid #f1efe9;
}
.logline .ts{color:var(--ink-3)}
.logline .lvl{letter-spacing:.1em;font-weight:600}
.logline .svc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--blue)}
.logline .msg{color:var(--ink-2)}
.logline.INFO .lvl{color:var(--ink-3)}
.logline.WARN .lvl{color:var(--amber)}
.logline.WARN{background:var(--amber-wash)}
.logline.ERROR .lvl{color:var(--red)}
.logline.ERROR{background:var(--red-wash)}

.pool-bar-track{height:28px;background:var(--paper);border:1px solid var(--rule-2);overflow:hidden}
.pool-bar{height:100%;transition:width .5s linear;background:repeating-linear-gradient(90deg,var(--green) 0 8px,transparent 8px 11px)}
.pool-bar.crit{background:repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 11px)}
.gaugewrap{display:flex;align-items:center;gap:18px}
.gaugewrap .num{font:700 28px var(--pm);letter-spacing:-.03em;color:var(--ink)}
.gaugewrap .cap{font:500 9.5px var(--pm);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);line-height:1.8}

.dep-row{display:flex;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--rule);gap:13px}
.dep-row:last-child{border-bottom:none}
.dep-row .body{flex:1;min-width:0}
.dep-dot{width:9px;height:9px;flex:none;margin-top:4px;background:var(--rule-3);border:1px solid rgba(0,0,0,.2)}
.dep-row.flagged{background:var(--red-wash)}
.dep-row.flagged .dep-dot{background:var(--red);animation:lampBlink 1.1s steps(1,end) infinite}
.dep-row .ver{font:600 12.5px var(--pm);letter-spacing:.03em;color:var(--ink)}
.dep-row .flag{font:600 8px var(--pm);letter-spacing:.14em;background:var(--red);color:#fff;padding:2px 6px;margin-left:8px}
.dep-row .sub{font:400 12px var(--pt);color:var(--ink-3);margin-top:4px;line-height:1.5}
.rollback-btn{
  margin-top:10px;font:600 9.5px var(--pm);letter-spacing:.16em;text-transform:uppercase;
  background:var(--plate);border:1px solid var(--ink);color:var(--ink);padding:7px 13px;cursor:pointer;
}
.rollback-btn:hover{background:var(--ink);color:#fff}

.gh-card{background:var(--paper);border:1px solid var(--rule-2);padding:14px 16px}
.gh-card .title{font:600 13px var(--pt);color:var(--ink)}
.gh-card .meta{font:500 10px var(--pm);color:var(--ink-3);letter-spacing:.03em;margin:7px 0 11px}
.gh-diff{font:600 10.5px var(--pm);letter-spacing:.05em;display:flex;gap:14px;color:var(--ink-3)}
.gh-diff .add{color:var(--green)}.gh-diff .del{color:var(--red)}

.sess-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);font-family:var(--pm);font-size:11px}
.sess-row:last-child{border-bottom:none}
.sess-row .sid{color:var(--blue);width:96px;flex:none;font-weight:600}
.sess-row .txt{flex:1;min-width:0;color:var(--ink-2);font-family:var(--pt);font-size:12.5px}
.sess-row .badge,.sess-row .ts{flex:none}
.sess-row .badge{font:600 8px var(--pm);letter-spacing:.14em;padding:3px 7px}
.sess-row .badge.fail{background:var(--red);color:#fff}
.sess-row .badge.ok{background:var(--green);color:#fff}
.sess-row .ts{color:var(--ink-3);font-size:10px}

.checklist-item{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--rule);font:500 11.5px var(--pm);letter-spacing:.03em;color:var(--ink-3)}
.checklist-item:last-child{border-bottom:none}
.checklist-item .ck{width:15px;height:15px;flex:none;border:1px solid var(--rule-3);background:var(--plate);display:flex;align-items:center;justify-content:center}
.checklist-item .ck svg{display:none;width:10px;height:10px;stroke:#fff;stroke-width:3.5}
.checklist-item.done{color:var(--ink)}
.checklist-item.done .ck{background:var(--green);border-color:var(--green)}
.checklist-item.done .ck svg{display:block}

.evi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:0;padding:0 !important}
.evi-card{background:transparent;border:none;padding:12px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.evi-card:last-child{border-right:none}

/* ============================================================
   LIVE RACE — Manual On-Call vs RemOpsAI, side by side, on the
   same real incident, both clocks running in real wall-time.
   Nothing here is simulated pacing — every second shown is a
   second that actually passed while the founder drove it.
   ============================================================ */

@keyframes racePulse{0%,100%{opacity:1}50%{opacity:.35}}

<body>
<div class="simbar">
  <div class="simbar-tag"><span class="dot"></span>LIVE SIMULATION</div>
  <div class="envswitch" id="envSwitch">
    <button class="envbtn active" data-env="store"><span class="b" style="background:var(--mer-accent)"></span>meridian.com — Storefront</button>
    <button class="envbtn" data-env="rops"><span class="b" style="background:var(--accent)"></span>RemOpsAI Console</button>
    <button class="envbtn" data-env="race"><span class="b" style="background:var(--danger)"></span>⚡ Manual vs RemOps</button>
  </div>
  <div class="simbar-spacer"></div>
  <div class="status-pill" id="statusPill"><span class="pdot"></span><span id="statusPillText">All systems healthy</span></div>
  <button class="btn btn-auto" id="ccToggle" aria-pressed="true">CC On</button>
  <button class="btn btn-ghost" id="resetBtn">Reset Demo</button>
</div>

<div class="viewport">
  <div class="env active" id="env-store"></div>
  <div class="env" id="env-rops"></div>
  <div class="env" id="env-race"></div>
</div>

<div class="mer-toast" id="toast"></div>

<div class="ccbar" id="ccBar" hidden>
  <div class="cc-tag"><span class="cc-k">CC</span><span class="cc-sec" id="ccSection">—</span></div>
  <div class="cc-body">
    <p class="cc-what" id="ccWhat"></p>
    <p class="cc-role" id="ccRole"></p>
  </div>
  <button class="cc-x" id="ccClose" aria-label="Hide narration">✕</button>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   SHARED UTILS
   ============================================================ */
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const now=()=>new Date();
const fmtTime=(d)=>d.toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
const fmtMs=(ms)=> ms>=1000 ? (ms/1000).toFixed(2)+'s' : Math.round(ms)+'ms';
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function svgPoints(hist,w,h,min,max){
  if(hist.length<2) return '';
  const n=hist.length;
  return hist.map((v,i)=>{
    const x=(i/(n-1))*w;
    const y=h-((clamp(v,min,max)-min)/(max-min||1))*h;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
}

/* ============================================================
   GLOBAL STATE
   ============================================================ */
const PHASES=['normal','incident','detecting','investigating','rootcause','remediation_ready','sandbox_test','sandbox_failed','remediating','resolved'];
const BROKEN_PHASES=new Set(['incident','detecting','investigating','rootcause','remediation_ready','sandbox_test','sandbox_failed','remediating']);

const state = {
  phase:'normal',
  timers:[],
  heartbeat:null,
  incident:null, // {id, severity, detectedAt, resolvedAt}
  timeline:[],
  evidence:[],
  confidence:0,
  investigation:{connected:[], traced:[]},
  reasoning:[],
  remediationSteps:[
    {key:'rollback', label:'Rollback checkout-service deployment', done:false, ts:null},
    {key:'drain', label:'Drain unhealthy checkout pods', done:false, ts:null},
    {key:'dbrecover', label:'Verify PostgreSQL connection pool recovery', done:false, ts:null},
    {key:'latency', label:'Checkout latency recovering', done:false, ts:null},
    {key:'errorfall', label:'HTTP 500 rate falling', done:false, ts:null},
    {key:'orders', label:'Confirm successful customer orders', done:false, ts:null},
  ],
  sandboxSteps:[
    {key:'provision', label:'Provision isolated sandbox namespace (checkout-service v2.113.2)', done:false, ts:null},
    {key:'seed', label:'Seed sandbox database from anonymized production snapshot', done:false, ts:null},
    {key:'replay', label:'Replay 500 production checkout requests as synthetic traffic', done:false, ts:null},
    {key:'compare_err', label:'Compare sandbox error rate vs. production baseline', done:false, ts:null},
    {key:'compare_lat', label:'Compare sandbox p95 latency vs. production baseline', done:false, ts:null},
    {key:'decision', label:'Pass/fail decision — promote or auto-rollback', done:false, ts:null},
  ],
  sandbox:{status:'idle', attempts:0, failReason:null},
  authorized:false,
  logs:[],
  pods:[
    {name:'checkout-service-7f9d4c-2k9x', restarts:0, status:'run'},
    {name:'checkout-service-7f9d4c-x81m', restarts:0, status:'run'},
    {name:'checkout-service-7f9d4c-qw3v', restarts:0, status:'run'},
    {name:'checkout-service-7f9d4c-h6bp', restarts:0, status:'run'},
    {name:'checkout-service-7f9d4c-n0lz', restarts:0, status:'run'},
    {name:'checkout-service-7f9d4c-t4ry', restarts:0, status:'run'},
  ],
  sessions:[],
  failedCheckoutAttempts:0,
  orderConfirmed:false,
  orderConfirmedAt:null,
  metrics:{
    errorRate:{cur:0.15, hist:[], min:0, max:45, unit:'%', label:'Checkout Error Rate'},
    p95:{cur:230, hist:[], min:0, max:5200, unit:'ms', label:'Checkout API p95 Latency'},
    dbPool:{cur:41, hist:[], min:0, max:100, unit:'%', label:'DB Connection Pool'},
    payTimeout:{cur:0.1, hist:[], min:0, max:35, unit:'%', label:'Payment Timeout Rate'},
    orders:{cur:812, hist:[], min:0, max:2000, unit:'', label:'Successful Orders (5m)'},
  },
};

function targetsFor(phase){
  if(phase==='normal' || phase==='resolved'){
    return {errorRate:0.15, p95:230, dbPool:41, payTimeout:0.1};
  }
  return {errorRate:38.7, p95:4800, dbPool:100, payTimeout:29.4};
}

/* ============================================================
   LOGGING / EVENTS
   ============================================================ */
function pushLog(level, svc, msg, tsDate){
  const e={ts:fmtTime(tsDate||now()), level, svc, msg};
  state.logs.push(e);
  if(state.logs.length>240) state.logs.shift();
  if(state.rops.activeSection==='logs') renderLogsAppend(e);
}
function pushTimeline(text){
  state.timeline.push({t:fmtTime(now()), d:text});
  if(state.rops.activeSection==='investigation' || state.rops.activeSection==='command') renderActiveConsole();
  renderRaceIfVisible();
}
function pushSession(text, ok){
  state.sessions.unshift({sid:'#'+(8800+Math.floor(Math.random()*90)), t:text, ok, ts:fmtTime(now())});
  if(state.sessions.length>30) state.sessions.pop();
  if(state.rops.activeSection==='sessions') renderActiveConsole();
}
/* The step-by-step "thinking" trace — what RemOps is checking and ruling
   out, live, before it ever states a root cause. The point is to never
   let the diagnosis feel like a black box. */
function pushReasoning(text){
  state.reasoning.push({t:fmtTime(now()), d:text});
  if(state.rops.activeSection==='investigation') renderActiveConsole();
}

/* ============================================================
   PHASE / INCIDENT ENGINE
   ============================================================ */
function schedule(fn, ms){
  const id=setTimeout(fn, ms);
  state.timers.push(id);
  return id;
}
function clearTimers(){ state.timers.forEach(id=>clearTimeout(id)); state.timers=[]; }

function setPhase(p){
  state.phase=p;
  updateStatusPill();
  renderActiveConsole();
  renderStoreCheckoutIfVisible();
  updateTriggerBtn();
  renderRaceIfVisible();
}

function startIncident(){
  if(state.phase!=='normal') return;
  state.incident={ id:'INC-'+(2100+Math.floor(Math.random()*800)), severity:'P1', detectedAt:null, resolvedAt:null };
  state.timeline=[]; state.evidence=[]; state.confidence=0; state.authorized=false;
  state.investigation={connected:[], traced:[]};
  state.reasoning=[];
  state.remediationSteps.forEach(s=>{s.done=false; s.ts=null;});
  state.sandboxSteps.forEach(s=>{s.done=false; s.ts=null;});
  state.sandbox={status:'idle', attempts:0, failReason:null};
  state.failedCheckoutAttempts=0;

  setPhase('incident');
  pushLog('WARN','checkout-service','p99 latency exceeded 2000ms threshold on /v1/checkout/place-order');
  pushLog('ERROR','order-service','context deadline exceeded calling payment-service');
  flipPod(2,'restart');

  schedule(()=>{
    pushLog('ERROR','payment-service','upstream timeout after 5000ms (gateway: authnet-prod)');
    pushLog('WARN','postgres-primary','connection wait time p95 = 1840ms');
    pushTimeline('Checkout error rate begins increasing (0.2% → rising)');
  },900);

  schedule(()=>{
    flipPod(0,'restart');
    pushLog('ERROR','order-service','could not acquire db connection: pool exhausted (120/120 in use)');
    pushTimeline('Payment API p95 latency increases (240ms → 4.8s)');
  },2600);

  schedule(()=>{
    pushTimeline('PostgreSQL connection pool reaches saturation (100% utilized)');
    flipPod(4,'crash');
  },4200);

  schedule(()=>{
    state.incident.detectedAt=now();
    setPhase('detecting');
    pushTimeline('Checkout failures cross critical threshold — auto-detected by RemOps');
    pushLog('ERROR','remops-detector','anomaly correlation triggered: checkout.error_rate + db.pool_utilization + payment.timeout_rate');
  },5600);

  schedule(()=>{
    pushTimeline('Customer session telemetry shows repeated order failures');
  },6600);

  schedule(()=> startInvestigation(), 7600);
}

function flipPod(idx,status){
  const p=state.pods[idx];
  if(!p) return;
  p.status=status;
  if(status!=='run') p.restarts++;
  if(state.rops.activeSection==='k8s') renderActiveConsole();
}
function healPods(){
  state.pods.forEach((p,i)=>{
    schedule(()=>{ p.status='run'; if(state.rops.activeSection==='k8s') renderActiveConsole(); }, 400*i+200);
  });
}

const SIGNAL_SOURCES=['Customer Sessions','Application Logs','Metrics','Distributed Traces','Kubernetes','Database','Deployments','GitHub'];

/* Narrates what RemOps is doing at each moment of the investigation, so the
   diagnosis never just appears — you watch it get ruled in and ruled out. */
const REASONING_STEPS=[
  {t:200,  s:'Pulling signal sources: logs, metrics, traces, Kubernetes, database, deployments, GitHub, customer sessions.'},
  {t:900,  s:'Checkout 5xx rate crossed baseline — opening a correlation window around the spike.'},
  {t:1700, s:'Scanning deploys within the blast radius of checkout-service…'},
  {t:2300, s:'checkout-service v2.114.0 deployed 8 minutes ago — flagging as primary suspect.'},
  {t:3000, s:'Tracing the request path: checkout → order → payment → postgres.'},
  {t:3800, s:'Ruling out payment-service — its latency spike sits downstream of a wait, not a slow call of its own.'},
  {t:4600, s:'Ruling out inventory-service and search-service — no correlated error signal on either.'},
  {t:5400, s:'Database connection pool saturation lines up with the deploy timestamp within 40 seconds.'},
  {t:6200, s:'Cross-referencing the GitHub diff for v2.114.0…'},
  {t:7000, s:'Diff opens one DB connection per cart line item instead of reusing the pooled connection — matches the exhaustion pattern exactly.'},
  {t:7800, s:'Hypothesis confirmed. Computing confidence score.'},
];

function startInvestigation(){
  setPhase('investigating');
  REASONING_STEPS.forEach(step=>{
    schedule(()=> pushReasoning(step.s), step.t);
  });
  SIGNAL_SOURCES.forEach((s,i)=>{
    schedule(()=>{
      state.investigation.connected.push(s);
      if(state.rops.activeSection==='investigation') renderActiveConsole();
    }, 300*i);
  });
  const TRACE_HOPS=['Customer Session','Checkout API','Order Service','Payment Service','PostgreSQL','DB Connection Pool'];
  schedule(()=>{
    TRACE_HOPS.forEach((h,i)=>{
      schedule(()=>{
        state.investigation.traced.push(h);
        if(state.rops.activeSection==='investigation'||state.rops.activeSection==='servicemap') renderActiveConsole();
      }, 420*i);
    });
  }, 2600);

  const EVIDENCE=[
    {k:'Recent Deployment', v:'checkout-service', s:'8 minutes ago · v2.114.0 · commit a13f9c2 · deployed by j.romero'},
    {k:'Database Connections', v:'42% → 100%', s:'PostgreSQL primary pool saturated shortly after deploy'},
    {k:'Error Pattern', v:'connection pool exhausted', s:'1,842 occurrences across 6 checkout-service pods'},
    {k:'Trace', v:'checkout → order → payment → postgres', s:'db.connection.acquire span: 240ms → 4.8s (p95)'},
  ];
  schedule(()=>{
    EVIDENCE.forEach((e,i)=>{
      schedule(()=>{
        state.evidence.push(e);
        if(state.rops.activeSection==='investigation') renderActiveConsole();
      }, 550*i);
    });
  }, 5600);

  schedule(()=> setPhase('rootcause'), 8200);
  schedule(()=>{
    animateConfidence(96);
    pushTimeline('Root cause identified — checkout-service deployment linked to connection pool exhaustion');
  }, 8400);

  schedule(()=>{
    setPhase('remediation_ready');
    pushTimeline('Remediation plan generated — awaiting authorization');
  }, 10600);
}

function animateConfidence(target){
  let v=0;
  const step=()=>{
    v=Math.min(target, v+Math.ceil((target-v)*0.22)+3);
    state.confidence=v;
    if(state.rops.activeSection==='investigation') renderActiveConsole();
    if(v<target) schedule(step,60);
  };
  step();
}

function authorizeRemediation(){
  if(state.phase!=='remediation_ready') return;
  state.authorized=true;
  runSandboxValidation();
}

/* Before anything touches production, RemOps replays the same fix against an
   isolated sandbox copy of checkout-service. A failed sandbox run is torn
   down automatically — production is only ever touched after a pass. */
function runSandboxValidation(){
  setPhase('sandbox_test');
  state.sandbox.attempts++;
  state.sandbox.status='running';
  state.sandbox.failReason=null;
  state.sandboxSteps.forEach(s=>{s.done=false; s.ts=null;});
  const ns='checkout-sandbox-'+Math.random().toString(36).slice(2,7);
  pushLog('INFO','remops-sandbox','provisioning isolated namespace '+ns+' — cloning checkout-service at v2.113.2');
  pushTimeline('Sandbox validation started — testing the rollback in an isolated namespace before it ever reaches production');
  if(state.rops.activeSection==='sandbox'||state.rops.activeSection==='remediation'||state.rops.activeSection==='command') renderActiveConsole();

  // First attempt occasionally trips the same failure signature, purely to
  // demonstrate the auto-rollback safety net — it always converges on retry.
  const willFail = state.sandbox.attempts===1 && Math.random()<0.28;
  const offsets=[500,1300,2200,3100,3900];
  const logs=[
    ['INFO','remops-sandbox','namespace ready — checkout-service:v2.113.2 deployed to sandbox'],
    ['INFO','remops-sandbox','sandbox seeded from anonymized production snapshot'],
    ['INFO','remops-sandbox','replaying 500 production checkout requests as synthetic canary traffic'],
    ['INFO','remops-sandbox','comparing sandbox error rate against production baseline'],
    ['INFO','remops-sandbox','comparing sandbox p95 latency against production baseline'],
  ];
  state.sandboxSteps.slice(0,5).forEach((st,i)=>{
    schedule(()=>{
      st.done=true; st.ts=fmtTime(now());
      pushLog(logs[i][0],logs[i][1],logs[i][2]);
      if(state.rops.activeSection==='sandbox') renderActiveConsole();
    }, offsets[i]);
  });

  schedule(()=>{
    const decision=state.sandboxSteps[5];
    decision.done=true; decision.ts=fmtTime(now());
    if(willFail){
      state.sandbox.status='failed';
      state.sandbox.failReason='Sandbox connection pool re-saturated under replayed load (97% util) — same regression pattern as production';
      pushLog('ERROR','remops-sandbox','validation FAILED — '+state.sandbox.failReason);
      pushLog('WARN','remops-sandbox','auto-rollback: tearing down sandbox namespace '+ns+' — production was never touched');
      pushTimeline('Sandbox validation failed — RemOps auto-rolled back the sandbox test and blocked the production promotion');
      setPhase('sandbox_failed');
      schedule(()=> runSandboxValidation(), 2800);
    } else {
      state.sandbox.status='passed';
      pushLog('INFO','remops-sandbox','validation PASSED — 0 errors across 500 synthetic transactions, p95 612ms, pool util 58%');
      pushTimeline('Sandbox validation passed — promoting the identical rollback to production');
      if(state.rops.activeSection==='sandbox'||state.rops.activeSection==='command') renderActiveConsole();
      schedule(()=> runProductionRemediation(), 1200);
    }
  }, offsets[4]+900);
}

function runProductionRemediation(){
  setPhase('remediating');
  pushLog('INFO','remops-executor','sandbox-validated — starting rollback of checkout-service in production');

  const steps=state.remediationSteps;
  const offsets=[900,2400,4000,5600,7200,8800];
  const logs=[
    ['INFO','deploy-controller','checkout-service rolled back: v2.114.0 → v2.113.2'],
    ['INFO','k8s-controller','draining 6 unhealthy checkout-service pods, replacing with v2.113.2'],
    ['INFO','postgres-primary','connection pool utilization falling: 100% → 63%'],
    ['INFO','checkout-service','p95 latency recovering: 4.8s → 890ms'],
    ['INFO','remops-monitor','HTTP 500 rate falling: 38.7% → 4.2%'],
    ['INFO','order-service','successful order rate returning to baseline'],
  ];
  steps.forEach((st,i)=>{
    schedule(()=>{
      st.done=true; st.ts=fmtTime(now());
      pushLog(logs[i][0],logs[i][1],logs[i][2]);
      if(i===1) healPods();
      if(state.rops.activeSection==='remediation'||state.rops.activeSection==='command') renderActiveConsole();
    }, offsets[i]);
  });

  schedule(()=>{
    state.incident.resolvedAt=now();
    setPhase('resolved');
    pushTimeline('Incident resolved — checkout error rate and DB pool utilization back to baseline');
  }, 10200);
}

/* ============================================================
   METRICS HEARTBEAT
   ============================================================ */
function heartbeatTick(){
  const targets=targetsFor(state.phase);
  const m=state.metrics;
  const rate = state.phase==='remediating' ? 0.30 : 0.22;

  m.errorRate.cur = clamp(lerp(m.errorRate.cur, targets.errorRate, rate) + rnd(-0.6,0.6), 0, 45);
  m.p95.cur = clamp(lerp(m.p95.cur, targets.p95, rate) + rnd(-40,40), 150, 5200);
  m.dbPool.cur = clamp(lerp(m.dbPool.cur, targets.dbPool, rate) + rnd(-1.5,1.5), 0, 100);
  m.payTimeout.cur = clamp(lerp(m.payTimeout.cur, targets.payTimeout, rate) + rnd(-0.4,0.4), 0, 35);

  const healthy = state.phase==='normal' || state.phase==='resolved';
  m.orders.cur = clamp(m.orders.cur + (healthy ? (Math.random()<0.5? rnd(0.5,3):0) : (Math.random()<0.08? 1:0)), 0, 2000);

  Object.values(m).forEach(mm=>{
    mm.hist.push(mm.cur);
    if(mm.hist.length>36) mm.hist.shift();
  });

  renderKpisLive();
  if(state.rops.activeSection==='metrics') renderMetricsLive();
  if(state.rops.activeSection==='database') renderDbLive();
  updateStatusPillSpark();
}

function ambientTick(){
  if(state.phase==='normal' || state.phase==='resolved'){
    const svcs=['api-gateway','checkout-service','inventory-service','search-service','order-service'];
    const msgs=['request handled','health check ok','cache hit ratio 94.2%','GET /v1/products 200 OK','scaling check: nominal'];
    pushLog('INFO', svcs[Math.floor(Math.random()*svcs.length)], msgs[Math.floor(Math.random()*msgs.length)]);
  }
}

  $$('[data-size]').forEach(b=>b.addEventListener('click',()=>{store.size=b.getAttribute('data-size'); renderStoreBody();}));
  $$('[data-color]').forEach(b=>b.addEventListener('click',()=>{store.color=b.getAttribute('data-color'); renderStoreBody();}));
  $$('[data-qty]').forEach(b=>b.addEventListener('click',()=>{store.qty=clamp(store.qty+(+b.getAttribute('data-qty')),1,9); renderStoreBody();}));
  $$('[data-nav]').forEach(el=>el.addEventListener('click', ()=>{

  if(addBtn) addBtn.addEventListener('click', ()=>{

    const existing=store.cart.find(i=>i.id===p.id && i.size===store.size && i.color===store.color);
    if(existing) existing.qty+=store.qty;
    else store.cart.push({id:p.id,name:p.name,price:p.price,emoji:p.emoji,size:store.size,color:store.color,qty:store.qty});

  });

  if(placeBtn) placeBtn.addEventListener('click', handlePlaceOrder);

  if(store.view==='checkout') renderStoreBody();

function handlePlaceOrder(){
  if(state.phase==='normal') startIncident();
  const btn=$('#placeOrderBtn');
  if(!btn || btn.disabled) return;
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> Processing payment…';
  const broken = BROKEN_PHASES.has(state.phase);
  setTimeout(()=>{
    if(broken){
      state.failedCheckoutAttempts++;
      pushSession('order attempt failed — HTTP 500 (checkout_failed)', false);
      pushLog('ERROR','checkout-api','POST /v1/checkout/place-order → 500 (upstream: payment-service timeout)');
      renderStoreBody();
    } else {
      store.lastOrderItems = store.cart.map(i=>({...i}));
      store.lastOrderTotals = checkoutTotals();
      store.cart=[];
      state.orderConfirmed=true; state.orderConfirmedAt=now();
      pushSession('order placed successfully — #4829137', true);
      pushLog('INFO','order-service','order #4829137 confirmed and queued for fulfillment');
      store.view='confirm';
      renderStore();
    }
  }, 950);
}

function elapsedStr(){
  const inc=state.incident;

  const end = inc.resolvedAt || now();
  const secs=Math.max(0,Math.floor((end-inc.detectedAt)/1000));
  return String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');

function sevTopline(title){
  const inc=state.incident;

/* The incident as a flight plan: five checkpoints, left to right. */

function ladderIndex(){
  const p=state.phase;
  if(p==='normal') return -1;
  if(p==='resolved') return LADDER.length; // every checkpoint cleared
  for(let i=0;i<LADDER.length;i++) if(LADDER[i].phases.includes(p)) return i;
  return LADDER.length-1;
}

/* Scale each strip to its own recent range (with headroom for the alarm
   line) instead of a fixed 0..max — a flat baseline still shows its shape. */
function stripDomain(m,cfg){
  const h=m.hist.length?m.hist:[m.cur];
  let hi=Math.max(...h, m.cur);
  if(cfg.thresh!=null) hi=Math.max(hi, cfg.thresh*1.15);
  let lo=Math.min(...h, m.cur);
  const pad=(hi-lo)*0.28 || Math.max(hi*0.25, 1);
  return {lo:Math.max(0,lo-pad), hi:hi+pad};
}
function stripSvg(m,cfg,H){
  const W=400; H=H||56;
  const dom=stripDomain(m,cfg);
  const pts=svgPoints(m.hist,W,H,dom.lo,dom.hi);
  const bad = cfg.thresh!=null && m.cur>=cfg.thresh;
  const warn = cfg.thresh!=null && m.cur>=cfg.thresh*0.55;
  const col = bad?'var(--red)':warn?'var(--amber)':'var(--green)';
  // Graph-paper ruling drawn into the plot, like chart-recorder stock.
  let rule='';
  for(let i=1;i<10;i++){
    const x=(i/10)*W;
    rule+=`<line class="gridline${i%5===0?' major':''}" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`;
  }
  for(let i=1;i<4;i++){
    const y=(i/4)*H;
    rule+=`<line class="gridline${i===2?' major':''}" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;
  }
  if(!pts) return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${rule}</svg>`;
  const tyRaw = cfg.thresh!=null ? H-((cfg.thresh-dom.lo)/((dom.hi-dom.lo)||1))*H : null;
  const ty = (tyRaw!=null && tyRaw>=0 && tyRaw<=H) ? tyRaw.toFixed(1) : null;
  const last=pts.split(' ').slice(-1)[0].split(',');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${rule}
    ${ty!=null?`<line class="strip-thresh" x1="0" y1="${ty}" x2="${W}" y2="${ty}"/>`:''}
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5"
      stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <line x1="${last[0]}" y1="0" x2="${last[0]}" y2="${H}" stroke="${col}" stroke-width="1" opacity=".35" vector-effect="non-scaling-stroke"/>
    <rect x="${(parseFloat(last[0])-1.7).toFixed(1)}" y="${(parseFloat(last[1])-1.7).toFixed(1)}" width="3.4" height="3.4" fill="${col}"/>
  </svg>`;
}
function stripDelta(m){
  if(m.hist.length<9) return '';
  const a=m.hist[m.hist.length-9], b=m.hist[m.hist.length-1];
  if(!a) return '';
  const d=((b-a)/a)*100;
  if(Math.abs(d)<2) return `<span class="d">flat</span>`;
  const n=Math.abs(d)>=1000?'>999':Math.round(Math.abs(d));
  return `<span class="d ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${n}%</span>`;
}
function stripWallHtml(){
  const m=state.metrics;
  const rows = STRIPS.map(cfg=>{
    const mm=m[cfg.k];
    const bad = cfg.thresh!=null && mm.cur>=cfg.thresh;
    const warn = cfg.thresh!=null && mm.cur>=cfg.thresh*0.55;
    return `<div class="strip s-${bad?'bad':warn?'warn':'ok'}" data-strip="${cfg.k}">
      <div class="sid">
        <span class="nm">${cfg.nm}</span>
        <span class="th">${cfg.thresh!=null?'alarm ≥ '+cfg.fmt(cfg.thresh):'no alarm'}</span>
      </div>
      <div class="plot">${stripSvg(mm,cfg)}<span class="yhi">${cfg.fmt(stripDomain(mm,cfg).hi)}</span><span class="ylo">${cfg.fmt(stripDomain(mm,cfg).lo)}</span></div>
      <div class="val"><span class="n" data-sval>${cfg.fmt(mm.cur)}</span>${stripDelta(mm)}</div>
    </div>`;
  }).join('');
  return rows + `<div class="strip-axis">
    <div class="lead">Time</div>
    <div class="ticks"><span>−60s</span><span>−45s</span><span>−30s</span><span>−15s</span><span>now</span></div>
    <div class="tail"></div>
  </div>`;
}

/* Cockpit-style caution/warning panel: one lamp per service. */
function annunHtml(){
  const broken=BROKEN_PHASES.has(state.phase);
  const mid=['incident','detecting','investigating','rootcause','remediation_ready','sandbox_test','sandbox_failed'].includes(state.phase);

    ['CHECKOUT', broken],
    ['PAYMENTS', mid],
    ['INVENTORY', false],
    ['SEARCH', false],
    ['ORDERS', broken],
    ['INFRA', infra],
  ];
  return services.map(([name,bad])=>{
    let h=0; const seed=name+state.phase;
    for(let i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))>>>0;

  }).join('');
}

const MAP_NODES=[
  {id:'Customer Session', x:40, y:130, w:172},
  {id:'Checkout API', x:262, y:60, w:158},
  {id:'Order Service', x:470, y:130, w:158},
  {id:'Payment Service', x:648, y:60, w:164},

  {id:'DB Connection Pool', x:648, y:220, w:164},
];
const MAP_EDGES=[['Customer Session','Checkout API'],['Checkout API','Order Service'],['Order Service','Payment Service'],['Order Service','PostgreSQL'],['PostgreSQL','DB Connection Pool']];
function nodeState(name){
  const traced=state.investigation.traced.includes(name);
  const broken = BROKEN_PHASES.has(state.phase);
  const badNodes=['Checkout API','Order Service','Payment Service','PostgreSQL','DB Connection Pool'];
  if(!broken) return {color:'var(--green)', label:'Nominal'};
  if(state.phase==='remediating' || state.phase==='resolved') return {color:'var(--green)', label:'Recovering'};
  if(name==='DB Connection Pool' && ['rootcause','remediation_ready','sandbox_test','sandbox_failed'].includes(state.phase)) return {color:'var(--red)', label:'Saturated · root cause'};
  if(traced) return {color:'var(--amber)', label:badNodes.includes(name)?'Degraded':'Traced'};
  if(badNodes.includes(name)) return {color:'var(--red)', label:'Degraded'};
  return {color:'var(--green)', label:'Nominal'};
}
function serviceMapSvg(){
  const edges=MAP_EDGES.map(([a,b])=>{
    const A=MAP_NODES.find(n=>n.id===a), B=MAP_NODES.find(n=>n.id===b);
    const traced = state.investigation.traced.includes(a) && state.investigation.traced.includes(b);
    // Orthogonal routing reads like a real topology diagram, not a spline.
    // Stacked nodes get a vertical drop; the rest get a right-angle elbow.
    const overlap = A.x < B.x+B.w && B.x < A.x+A.w;
    let d;
    if(overlap){
      const cx=Math.round(A.x+Math.min(A.w,B.w)/2);
      d = B.y>A.y ? `M${cx},${A.y+40} V${B.y-7}` : `M${cx},${A.y} V${B.y+47}`;
    } else {
      const x1=A.x+A.w, y1=A.y+20, x2=B.x-7, y2=B.y+20;
      const mx=Math.round(x1+(x2-x1)/2);
      d = `M${x1},${y1} H${mx} V${y2} H${x2}`;
    }
    return `<path d="${d}" fill="none" stroke="${traced?'var(--amber)':'var(--rule-3)'}" stroke-width="${traced?1.6:1.2}"
      ${traced?'stroke-dasharray="4 3" class="edge-live"':''} marker-end="url(#arrow)"/>`;
  }).join('');
  const nodes=MAP_NODES.map(n=>{
    const st=nodeState(n.id);
    const bad = st.color==='var(--red)';
    return `<g>
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="40" fill="${bad?'var(--red-wash)':'var(--plate)'}" stroke="${st.color}" stroke-width="1.2"/>
      <rect x="${n.x}" y="${n.y}" width="3" height="40" fill="${st.color}"/>
      <text x="${n.x+13}" y="${n.y+17}" class="svcnode-label">${n.id.toUpperCase()}</text>
      <text x="${n.x+13}" y="${n.y+30}" class="svcnode-sub" fill="${st.color}">${st.label}</text>
    </g>`;
  }).join('');
  return `<svg class="svcmap" viewBox="0 0 830 285">
    <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#a9a496"/></marker></defs>
    ${edges}${nodes}
  </svg>`;
}

function sectionSandbox(){

  if(idle) banner = bannerHtml('b-idle','—','No validation run yet','Sandbox testing runs automatically once remediation is authorized. Nothing is ever pushed to production without passing here first.', []);
  else if(running) banner = bannerHtml('b-info','~','Testing the fix in an isolated sandbox','Rolling back a private replica of checkout-service to v2.113.2 and replaying real traffic against it — before touching production.',
    [['Namespace','checkout-sandbox'],['Target','v2.113.2'],['Traffic','500 replayed requests'],['Attempt',sb.attempts]]);
  else if(failed) banner = bannerHtml('b-bad','!','Validation failed — auto-rolled back','The sandbox run tripped the same failure signature. RemOps tore the sandbox down automatically and blocked production. Production was never touched.',
    [['Result','FAILED'],['Reason',sb.failReason||'—'],['Production impact','none — blocked'],['Next','auto-retrying']]);
  else if(passed) banner = bannerHtml('b-ok','OK','Validation passed — promoted to production','0 errors across 500 synthetic transactions in the sandbox. The identical rollback is now running against production.',
    [['Result','PASSED'],['Errors','0 / 500'],['p95 (sandbox)','612ms'],['Promoted','yes']]);

  return `
    ${sevTopline('Sandbox Validation')}
    ${banner}
    <div class="panel">
      <div class="panel-h"><h2>Pre-production Test Plan</h2><span class="sub">isolated namespace · attempt ${sb.attempts||0}</span></div>
      ${!sb.attempts ? `<div class="empty-console" style="padding:24px 10px">Runs automatically after remediation is authorized.</div>` : state.sandboxSteps.map((s,i)=>`
        <div class="remstep ${s.done?'done':(running && i===pendingIdx?'active':'')}">
          <div class="n">${s.done?'✓':i+1}</div>
          <div class="txt">${s.label}</div>
          ${s.ts?`<div class="ts">${s.ts}</div>`:''}
        </div>`).join('')}
    </div>
    ${failed ? `<div class="panel">
      <div class="panel-h"><h2>Auto-Rollback</h2></div>
      <div style="padding:12px 0 4px">
        <p style="margin:0;font:400 13px var(--pt);color:var(--ink-2);line-height:1.6">RemOps automatically tore down the sandbox namespace the moment the failure signature matched — no human had to intervene, and production was never in scope. A fresh sandbox attempt starts automatically.</p>
      </div>
    </div>` : ''}
    ${(running||failed) ? `<div class="banner b-info" style="margin-top:0">
      <div class="bicon">i</div>
      <div class="btext"><h3>Safety Gate</h3><p>Production promotion is blocked until this sandbox run reports PASSED. There is no path from here to production on a failure.</p></div>
    </div>` : ''}
  `;
}

/* ---- Metrics ---- */
/* Same strip language as the command wall, expanded: each signal keeps its
   own row but gains a now / peak / floor readout to the right. */
function metricStrip(cfg){
  const m=state.metrics[cfg.k];
  const hist=m.hist.length?m.hist:[m.cur];
  const peak=Math.max(...hist), floor=Math.min(...hist);
  const bad = cfg.thresh!=null && m.cur>=cfg.thresh;
  const warn = cfg.thresh!=null && m.cur>=cfg.thresh*0.55;
  return `<div class="mstrip s-${bad?'bad':warn?'warn':'ok'}" data-mkey="${cfg.k}">
    <div class="mhead">
      <span class="mname">${m.label}</span>
      <span class="mthresh">${cfg.thresh!=null?'alarm ≥ '+cfg.fmt(cfg.thresh):'no alarm configured'}</span>
    </div>
    <div class="mplot">${stripSvg(m,cfg,104)}<span class="yhi">${cfg.fmt(stripDomain(m,cfg).hi)}</span><span class="ylo">${cfg.fmt(stripDomain(m,cfg).lo)}</span></div>
    <div class="mstats">
      <div class="ms"><span class="k">Now</span><span class="v now">${cfg.fmt(m.cur)}</span></div>
      <div class="ms"><span class="k">Peak</span><span class="v">${cfg.fmt(peak)}</span></div>
      <div class="ms"><span class="k">Floor</span><span class="v">${cfg.fmt(floor)}</span></div>
      <div class="ms"><span class="k">Samples</span><span class="v">${hist.length}</span></div>
    </div>
  </div>`;
}
function sectionMetrics(){
  return `
    ${sevTopline('Metrics')}
    <div class="panel">
      <div class="panel-h"><h2>Live Production Metrics</h2><span class="sub">0.7s resolution · meridian-prod · dashed = alarm threshold</span></div>
      <div class="mwall" id="metricsGrid">${STRIPS.map(metricStrip).join('')}</div>
    </div>
  `;
}

function renderMetricsLive(){

function logLineHtml(e){

/* ---- Traces ---- */
function sectionTraces(){
  const broken=BROKEN_PHASES.has(state.phase) && state.phase!=='remediating';
  const recovering = state.phase==='remediating';
  const pick=(bad,rec,ok)=> broken?bad:recovering?rec:ok;
  // depth = nesting level, start = offset from trace origin (ms)
  const spans=[
    {svc:'checkout-service',      op:'POST /v1/checkout/place-order', depth:0, start:0,                       dur:pick(4800,1400,210)},
    {svc:'order-service',         op:'orders.create',                 depth:1, start:pick(90,50,18),          dur:pick(4200,1050,150)},
    {svc:'db.connection.acquire', op:'pool.acquire',                  depth:2, start:pick(140,80,26),         dur:pick(3900,900,12)},
    {svc:'payment-service',       op:'payments.authorize',            depth:2, start:pick(4100,980,52),       dur:pick(1600,520,80)},
  ];
  const total=Math.max(...spans.map(s=>s.start+s.dur),300);
  return `
    ${sevTopline('Traces')}
    <div class="panel">
      <div class="panel-h"><h2>Trace — POST /v1/checkout/place-order</h2><span class="sub">${broken?'trace_id 9c14ef2a · status error':'trace_id 771ab30f · status ok'}</span></div>
      <div class="waterfall">
        ${spans.map(sp=>{
          const slow = sp.dur>1000;
          const left=(sp.start/total)*100, w=Math.max(0.6,(sp.dur/total)*100);
          return `<div class="wrow ${slow?'slow':''}">
            <div class="wlab" style="padding-left:${sp.depth*14}px">
              ${sp.depth?'<span class="wtick"></span>':''}
              <span class="wsvc">${sp.svc}</span>
              <span class="wop">${sp.op}</span>
            </div>
            <div class="wtrack">
              <div class="wbar" style="left:${left.toFixed(2)}%;width:${w.toFixed(2)}%"></div>
            </div>
            <span class="wdur">${fmtMs(sp.dur)}</span>
          </div>`;
        }).join('')}
        <div class="waxis">
          <div></div>
          <div class="wticks">${[0,.25,.5,.75,1].map(f=>`<span>${fmtMs(total*f)}</span>`).join('')}</div>
          <div></div>
        </div>
      </div>
    </div>
  `;
}
